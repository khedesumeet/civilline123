<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client Bills</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #172033;
      --muted: #64748b;
      --dark: #111827;
      --accent: #f59e0b;
      --danger: #dc2626;
      --line: #e5e7eb;
      --ok: #16a34a
    }
    * {
      box-sizing: border-box
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text)
    }
    header {
      background: var(--dark);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 10
    }
    .bar {
      max-width: 1200px;
      margin: auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px
    }
    .logo {
      font-size: 24px;
      font-weight: 900
    }
    .logo span {
      color: var(--accent)
    }
    nav {
      display: flex;
      gap: 5px;
      flex-wrap: wrap
    }
    nav a,
    nav button {
      color: #fff;
      text-decoration: none;
      background: transparent;
      border: 0;
      padding: 9px 11px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700
    }
    nav a:hover,
    nav button:hover {
      background: #374151
    }
    .wrap {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 20px #0000000a;
      margin-bottom: 18px
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }
    .grid4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px
    }
    label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 6px
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      font-size: 14px
    }
    textarea {
      min-height: 90px
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #111827;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none
    }
    .btn.secondary {
      background: #e5e7eb
    }
    .btn.dark {
      background: var(--dark);
      color: #fff
    }
    .btn.danger {
      background: var(--danger);
      color: #fff
    }
    .btn.success {
      background: var(--ok);
      color: #fff
    }
    .btn.small {
      padding: 7px 9px;
      font-size: 12px
    }
    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }
    .msg {
      padding: 11px;
      border-radius: 8px;
      margin-top: 14px;
      display: none
    }
    .successmsg {
      background: #dcfce7;
      color: #166534
    }
    .errormsg {
      background: #fee2e2;
      color: #991b1b
    }
    .table-scroll {
      overflow: auto
    }
    table {
      width: 100%;
      border-collapse: collapse
    }
    th,
    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      vertical-align: top
    }
    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase
    }
    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 17px
    }
    .stat .label {
      color: var(--muted);
      font-size: 13px
    }
    .stat .value {
      font-size: 24px;
      font-weight: 900;
      margin-top: 7px
    }
    .muted {
      color: var(--muted)
    }
    .auth {
      max-width: 430px;
      margin: 70px auto
    }
    .hero {
      max-width: 950px;
      margin: 60px auto;
      text-align: center;
      padding: 25px
    }
    .hero h1 {
      font-size: 45px
    }
    @media(max-width:900px) {
      .grid4 {
        grid-template-columns: 1fr 1fr
      }
    }
    @media(max-width:650px) {
      .grid,
      .grid4 {
        grid-template-columns: 1fr
      }
      .bar {
        align-items: flex-start;
        flex-direction: column
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="logo">Civil<span>Line</span></div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="projects.html">Projects</a>
        <a href="expenses.html">Expenses</a>
        <a href="ledger.html">Ledger</a>
        <button id="logout">Logout</button>
      </nav>
    </div>
  </header>
  <div class="wrap">
    <div class="card">
      <h1>Client Bills / Income</h1>
      <form id="form">
        <div class="grid">
          <div>
            <label>Project *</label>
            <select id="project" required></select>
          </div>
          <div>
            <label>Date *</label>
            <input id="date" type="date" required>
          </div>
          <div>
            <label>Bill Number</label>
            <input id="bill">
          </div>
          <div>
            <label>Amount *</label>
            <input id="amount" type="number" min="0" step=".01" required>
          </div>
          <div>
            <label>Status</label>
            <select id="billStatus">
              <option value="paid">Paid</option>
              <option value="pending">Pending</option>
              <option value="overdue">Overdue</option>
            </select>
          </div>
          <div>
            <label>Notes</label>
            <input id="notes">
          </div>
        </div>
        <button class="btn" id="save">Save Client Bill</button>
        <button type="button" class="btn secondary" id="cancel" style="display:none">Cancel</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
    <div class="card">
      <div class="grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div>
          <label>From</label>
          <input id="fromDate" type="date">
        </div>
        <div>
          <label>To</label>
          <input id="toDate" type="date">
        </div>
        <div>
          <label>Status</label>
          <select id="filterStatus">
            <option value="">All</option>
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
            <option value="overdue">Overdue</option>
          </select>
        </div>
      </div>
      <button class="btn small secondary" onclick="load()">Apply Filters</button>
    </div>
    <div class="card table-scroll">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Project</th>
            <th>Bill</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <script>
    const sb = supabase.createClient(
      "https://aoicywtjwvqzzhmxkxvs.supabase.co",
      "sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W"
    );
    let uid, edit = null;
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[c]));

    (async () => {
      const u = await sb.auth.getUser();
      if (!u.data.user) return location.href = "contractor-login.html";
      uid = u.data.user.id;
      const p = await sb.from("profiles").select("role,status").eq("id", uid).single();
      if (p.data?.role !== "contractor" || p.data.status !== "approved") return location.href = "contractor-login.html";
      document.getElementById('date').value = new Date().toISOString().slice(0, 10);
      await projects();
      load();
    })();

    async function projects() {
      const r = await sb.from("projects").select("id,name").eq("user_id", uid).order("name");
      if (r.error) return show(r.error.message, "error");
      document.getElementById('project').innerHTML = (r.data || []).map(x =>
        `<option value="${x.id}">${esc(x.name)}</option>`).join("");
    }

    document.getElementById('form').onsubmit = async e => {
      e.preventDefault();
      const d = {
        user_id: uid,
        project_id: document.getElementById('project').value,
        date: document.getElementById('date').value,
        bill_number: document.getElementById('bill').value.trim() || null,
        amount: Number(document.getElementById('amount').value || 0),
        status: document.getElementById('billStatus').value,
        notes: document.getElementById('notes').value.trim() || null
      };
      const r = edit ? await sb.from("client_bills").update(d).eq("id", edit).eq("user_id", uid) :
        await sb.from("client_bills").insert(d);
      if (r.error) return show(r.error.message, "error");
      show(edit ? "Updated" : "Saved", "success");
      reset();
      load();
    };

    async function load() {
      const from = document.getElementById('fromDate').value || '1970-01-01';
      const to = document.getElementById('toDate').value || '2099-12-31';
      const st = document.getElementById('filterStatus').value;
      let q = sb.from("client_bills").select("*,projects(name)").eq("user_id", uid).gte("date", from).lte("date", to);
      if (st) q = q.eq("status", st);
      const r = await q.order("date", { ascending: false });
      if (r.error) return show(r.error.message, "error");
      document.getElementById('rows').innerHTML = (r.data || []).map(x =>
        `<tr><td>${x.date}</td><td>${esc(x.projects?.name||"-")}</td><td>${esc(x.bill_number||"-")}</td><td>₹${Number(x.amount||0).toLocaleString("en-IN")}</td><td>${esc(x.status)}</td><td>${esc(x.notes||"-")}</td><td><button class="btn small secondary" onclick="ed('${x.id}')">Edit</button> <button class="btn small danger" onclick="del('${x.id}')">Delete</button></td></tr>`
      ).join("");
    }

    async function ed(id) {
      const r = await sb.from("client_bills").select("*").eq("id", id).eq("user_id", uid).single();
      if (r.error) return show(r.error.message, "error");
      const x = r.data;
      edit = id;
      document.getElementById('project').value = x.project_id;
      document.getElementById('date').value = x.date;
      document.getElementById('bill').value = x.bill_number || "";
      document.getElementById('amount').value = x.amount;
      document.getElementById('billStatus').value = x.status;
      document.getElementById('notes').value = x.notes || "";
      document.getElementById('save').textContent = "Save Changes";
      document.getElementById('cancel').style.display = "inline-flex";
    }

    async function del(id) {
      if (!confirm("Delete client bill?")) return;
      const r = await sb.from("client_bills").delete().eq("id", id).eq("user_id", uid);
      if (r.error) show(r.error.message, "error");
      else load();
    }

    function reset() {
      edit = null;
      document.getElementById('form').reset();
      document.getElementById('date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('save').textContent = "Save Client Bill";
      document.getElementById('cancel').style.display = "none";
    }
    document.getElementById('cancel').onclick = reset;

    function show(t, c) {
      const msg = document.getElementById('msg');
      msg.textContent = t;
      msg.className = "msg " + (c === "error" ? "errormsg" : "successmsg");
      msg.style.display = "block";
    }
    logout.onclick = async () => {
      await sb.auth.signOut();
      location.href = "contractor-login.html"
    };
  </script>
</body>
</html>
