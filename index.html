<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CivilLine - Contractor Registration</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #111827;
            color: white;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand span {
            color: #f59e0b;
        }

        .home-link {
            text-decoration: none;
            color: white;
            border: 1px solid #4b5563;
            padding: 9px 16px;
            border-radius: 7px;
            font-size: 14px;
        }

        .home-link:hover {
            background: #f59e0b;
            color: #111827;
            border-color: #f59e0b;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #6b7280;
            font-size: 15px;
        }

        /* =========================
           FORM CARD
        ========================= */

        .card {
            background: white;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 8px 35px rgba(0,0,0,0.07);
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 19px;
            font-weight: 700;
            padding-bottom: 10px;
            margin-bottom: 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .required {
            color: #dc2626;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            background: white;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* =========================
           SERVICES
        ========================= */

        .services {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .service-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            background: #fafafa;
            transition: 0.2s;
            font-size: 14px;
        }

        .service-item:hover {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .service-item input {
            width: auto;
            cursor: pointer;
        }

        /* =========================
           IMAGE
        ========================= */

        .upload-box {
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            background: #fafafa;
        }

        .upload-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .upload-box p {
            color: #6b7280;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .upload-box input {
            border: none;
            max-width: 350px;
        }

        #preview {
            display: none;
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            margin: 20px auto 0;
            border: 1px solid #ddd;
        }

        /* =========================
           SUBMIT
        ========================= */

        .submit-button {
            width: 100%;
            border: none;
            background: #f59e0b;
            color: #111827;
            padding: 16px;
            font-size: 17px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .submit-button:hover {
            background: #d97706;
            color: white;
        }

        .submit-button:disabled {
            background: #9ca3af;
            color: white;
            cursor: not-allowed;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #6b7280;
            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .services {
                grid-template-columns: 1fr 1fr;
            }

            .card {
                padding: 22px;
            }

            .page {
                margin-top: 25px;
            }

            .page-title h1 {
                font-size: 27px;
            }

        }

        @media (max-width: 450px) {

            .services {
                grid-template-columns: 1fr;
            }

            .brand {
                font-size: 22px;
            }

            .home-link {
                padding: 7px 11px;
            }

        }

    </style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-inner">

        <div class="brand">
            Civil<span>Line</span>
        </div>

        <a href="index.html" class="home-link">
            Home
        </a>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="page">

    <div class="page-title">

        <h1>Contractor Registration</h1>

        <p>
            Register your construction business on CivilLine
        </p>

    </div>


    <div class="card">

        <form id="contractorForm">


            <!-- =========================
                 BUSINESS INFORMATION
            ========================= -->

            <div class="section">

                <div class="section-title">
                    Business Information
                </div>

                <div class="grid">

                    <div class="field">

                        <label>
                            Company / Contractor Name
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="company_name"
                            placeholder="ABC Construction"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Owner Name
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="owner_name"
                            placeholder="Owner name"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Mobile Number
                            <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            placeholder="9876543210"
                            maxlength="10"
                            inputmode="numeric"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            WhatsApp Number
                        </label>

                        <input
                            type="tel"
                            id="whatsapp"
                            placeholder="9876543210"
                            maxlength="10"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="field full">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="contractor@gmail.com"
                        >

                    </div>

                </div>

            </div>


            <!-- =========================
                 LOCATION
            ========================= -->

            <div class="section">

                <div class="section-title">
                    Location
                </div>

                <div class="grid">

                    <div class="field">

                        <label>
                            City
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Pune"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Area
                        </label>

                        <input
                            type="text"
                            id="area"
                            placeholder="Kothrud"
                        >

                    </div>


                    <div class="field full">

                        <label>
                            Full Address
                        </label>

                        <textarea
                            id="address"
                            placeholder="Enter complete business address"
                        ></textarea>

                    </div>

                </div>

            </div>


            <!-- =========================
                 WORK TYPE
            ========================= -->

            <div class="section">

                <div class="section-title">
                    Type of Work
                </div>

                <div class="services">

                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Building Contractor"
                        >
                        Building Contractor
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="RCC Work"
                        >
                        RCC Work
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Shuttering"
                        >
                        Shuttering
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Masonry"
                        >
                        Masonry
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Road Work"
                        >
                        Road Work
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Plumbing"
                        >
                        Plumbing
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Electrical"
                        >
                        Electrical
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Painting"
                        >
                        Painting
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Interior"
                        >
                        Interior
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Waterproofing"
                        >
                        Waterproofing
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Tiles"
                        >
                        Tiles
                    </label>


                    <label class="service-item">
                        <input
                            type="checkbox"
                            value="Other"
                        >
                        Other
                    </label>

                </div>

            </div>


            <!-- =========================
                 EXPERIENCE
            ========================= -->

            <div class="section">

                <div class="section-title">
                    Experience
                </div>

                <div class="grid">

                    <div class="field">

                        <label>
                            Experience (Years)
                        </label>

                        <input
                            type="number"
                            id="experience"
                            min="0"
                            placeholder="10"
                        >

                    </div>


                    <div class="field">

                        <label>
                            Projects Completed
                        </label>

                        <input
                            type="number"
                            id="projects_completed"
                            min="0"
                            placeholder="25"
                        >

                    </div>


                    <div class="field full">

                        <label>
                            About Your Business
                        </label>

                        <textarea
                            id="description"
                            placeholder="Tell customers about your business, experience and services..."
                        ></textarea>

                    </div>

                </div>

            </div>


            <!-- =========================
                 LOGO
            ========================= -->

            <div class="section">

                <div class="section-title">
                    Company Logo
                </div>

                <div class="upload-box">

                    <div class="upload-icon">
                        🏗️
                    </div>

                    <p>
                        Upload your company logo
                    </p>

                    <input
                        type="file"
                        id="logo"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <img
                        id="preview"
                        alt="Company Logo Preview"
                    >

                </div>

            </div>


            <!-- =========================
                 SUBMIT
            ========================= -->

            <button
                type="submit"
                id="submitButton"
                class="submit-button"
            >
                REGISTER CONTRACTOR
            </button>


            <div id="message"></div>


        </form>

    </div>

</main>


<footer>

    © 2026 CivilLine — Contractor Directory

</footer>


<script>

    /* ==================================================
       SUPABASE CONNECTION
    ================================================== */

    const SUPABASE_URL =
        "https://aoicywtjwvqzzhmxkxvs.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* ==================================================
       ELEMENTS
    ================================================== */

    const form =
        document.getElementById("contractorForm");

    const logoInput =
        document.getElementById("logo");

    const preview =
        document.getElementById("preview");

    const message =
        document.getElementById("message");

    const submitButton =
        document.getElementById("submitButton");


    /* ==================================================
       IMAGE PREVIEW
    ================================================== */

    logoInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {

            preview.style.display = "none";

            return;
        }


        if (!file.type.startsWith("image/")) {

            alert("Please select an image file.");

            this.value = "";

            preview.style.display = "none";

            return;
        }


        if (file.size > 5 * 1024 * 1024) {

            alert("Image must be smaller than 5 MB.");

            this.value = "";

            preview.style.display = "none";

            return;
        }


        const imageURL =
            URL.createObjectURL(file);


        preview.src = imageURL;

        preview.style.display = "block";

    });


    /* ==================================================
       MESSAGE
    ================================================== */

    function showMessage(text, type) {

        message.textContent = text;

        message.className = type;

        message.style.display = "block";

        message.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }


    function hideMessage() {

        message.style.display = "none";

        message.textContent = "";

    }


    /* ==================================================
       FORM SUBMIT
    ================================================== */

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        hideMessage();


        submitButton.disabled = true;

        submitButton.textContent =
            "REGISTERING...";


        try {

            /* ==========================
               GET VALUES
            ========================== */

            const companyName =
                document
                .getElementById("company_name")
                .value
                .trim();


            const ownerName =
                document
                .getElementById("owner_name")
                .value
                .trim();


            const mobile =
                document
                .getElementById("mobile")
                .value
                .trim();


            const whatsapp =
                document
                .getElementById("whatsapp")
                .value
                .trim();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const city =
                document
                .getElementById("city")
                .value
                .trim();


            const area =
                document
                .getElementById("area")
                .value
                .trim();


            const address =
                document
                .getElementById("address")
                .value
                .trim();


            const experienceValue =
                document
                .getElementById("experience")
                .value;


            const projectsValue =
                document
                .getElementById("projects_completed")
                .value;


            const description =
                document
                .getElementById("description")
                .value
                .trim();


            /* ==========================
               SERVICES
            ========================== */

            const selectedServices =
                document.querySelectorAll(
                    ".service-item input:checked"
                );


            const services =
                Array.from(selectedServices)
                .map(function (item) {
                    return item.value;
                });


            /* ==========================
               VALIDATION
            ========================== */

            if (!companyName) {

                throw new Error(
                    "Please enter company / contractor name."
                );

            }


            if (!ownerName) {

                throw new Error(
                    "Please enter owner name."
                );

            }


            if (!/^[0-9]{10}$/.test(mobile)) {

                throw new Error(
                    "Please enter a valid 10 digit mobile number."
                );

            }


            if (
                whatsapp &&
                !/^[0-9]{10}$/.test(whatsapp)
            ) {

                throw new Error(
                    "Please enter a valid WhatsApp number."
                );

            }


            if (!city) {

                throw new Error(
                    "Please enter city."
                );

            }


            if (services.length === 0) {

                throw new Error(
                    "Please select at least one type of work."
                );

            }


            /* ==========================
               IMAGE UPLOAD
            ========================== */

            let logoURL = null;


            const logoFile =
                logoInput.files[0];


            if (logoFile) {

                if (logoFile.size > 5 * 1024 * 1024) {

                    throw new Error(
                        "Logo must be smaller than 5 MB."
                    );

                }


                const extension =
                    logoFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


                const uniqueName =
                    "logo-" +
                    Date.now() +
                    "-" +
                    Math.random()
                    .toString(36)
                    .substring(2, 10) +
                    "." +
                    extension;


                const filePath =
                    "logos/" + uniqueName;


                submitButton.textContent =
                    "UPLOADING LOGO...";


                const {
                    data: uploadData,
                    error: uploadError
                } = await supabaseClient
                    .storage
                    .from("contractor-images")
                    .upload(
                        filePath,
                        logoFile,
                        {
                            cacheControl: "3600",
                            upsert: false,
                            contentType: logoFile.type
                        }
                    );


                if (uploadError) {

                    console.error(
                        "Storage error:",
                        uploadError
                    );

                    throw new Error(
                        "Logo upload failed: " +
                        uploadError.message
                    );

                }


                /* ==========================
                   PUBLIC IMAGE URL
                ========================== */

                const {
                    data: publicURL
                } =
                    supabaseClient
                    .storage
                    .from("contractor-images")
                    .getPublicUrl(filePath);


                logoURL =
                    publicURL.publicUrl;

            }


            /* ==========================
               DATABASE INSERT
            ========================== */

            submitButton.textContent =
                "SAVING DETAILS...";


            const {
                data,
                error
            } =
                await supabaseClient
                .from("contractors")
                .insert({

                    company_name:
                        companyName,

                    owner_name:
                        ownerName,

                    mobile:
                        mobile,

                    whatsapp:
                        whatsapp || null,

                    email:
                        email || null,

                    city:
                        city,

                    area:
                        area || null,

                    address:
                        address || null,

                    services:
                        services,

                    experience:
                        experienceValue
                        ? Number(experienceValue)
                        : null,

                    projects_completed:
                        projectsValue
                        ? Number(projectsValue)
                        : null,

                    description:
                        description || null,

                    logo_url:
                        logoURL,

                    plan:
                        "free",

                    is_verified:
                        false,

                    is_featured:
                        false,

                    status:
                        "pending"

                })
                .select();


            if (error) {

                console.error(
                    "Database error:",
                    error
                );

                throw new Error(
                    error.message
                );

            }


            /* ==========================
               SUCCESS
            ========================== */

            showMessage(
                "Registration successful! Your contractor profile has been submitted and is waiting for approval.",
                "success"
            );


            form.reset();


            preview.src = "";

            preview.style.display =
                "none";


        }
        catch (error) {

            console.error(
                "ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Something went wrong. Please try again.",
                "error"
            );

        }
        finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "REGISTER CONTRACTOR";

        }

    });

</script>

</body>
</html>
