<style>
/* GLOBAL */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#111827}

/* HEADER (animated) */
header{position:sticky;top:0;z-index:1000;color:#fff;padding:16px 20px;
  background:linear-gradient(120deg,#0b1020,#111827,#1e3a8a,#111827,#0b1020);

  background:linear-gradient(90deg,transparent,#f59e0b,#ef4444,#f59e0b,transparent);
  background-size:200% 100%;animation:sweep 3.5s linear infinite}
header.scrolled{padding:8px 20px}
header.scrolled .tagline{max-height:0;opacity:0;margin-top:0}
header.scrolled .logo{font-size:22px}
.header-inner{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:14px}
.logo{font-size:30px;font-weight:800;letter-spacing:2px;transition:font-size .3s ease}
.logo span{background:linear-gradient(90deg,#f59e0b,#fde68a,#f59e0b);background-size:200% 100%;

.tagline{font-size:12px;color:#94a3b8;margin-top:4px;max-height:20px;overflow:hidden;
  transition:max-height .3s ease,opacity .3s ease,margin .3s ease}
.tagline b{font-weight:600;animation:tagPulse 6s infinite}
.tagline b:nth-child(2){animation-delay:2s}
.tagline b:nth-child(3){animation-delay:4s}
.live{display:flex;align-items:center;gap:6px;background:rgba(220,38,38,.18);border:1px solid rgba(248,113,113,.5);

.header-right{display:flex;align-items:center;gap:14px}

.search-box{width:260px;transition:width .3s ease}
.search-box:focus-within{width:340px}

@keyframes headerIn{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes shimmer{from{background-position:0% 0}to{background-position:200% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@keyframes tagPulse{0%,33%,100%{color:#94a3b8}10%,25%{color:#fbbf24}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* LANGUAGE SWITCH */
.lang-select{padding:9px 10px;border:2px solid transparent;border-radius:10px;font-size:13px;font-weight:bold;background:#fff;color:#111827;cursor:pointer;outline:none}
.lang-select:focus{border-color:#f59e0b}

/* BREAKING NEWS */
.breaking{background:#dc2626;color:#fff;height:42px;display:flex;align-items:center;overflow:hidden}
.breaking-title{background:#991b1b;height:100%;display:flex;align-items:center;padding:0 18px;font-weight:bold;font-size:13px;z-index:2;white-space:nowrap}
.breaking-window{overflow:hidden;flex:1}

.breaking-dot{width:7px;height:7px;background:#fff;border-radius:50%;margin-right:8px}

/* MAIN */

.read-btn:hover{background:#374151}

.empty{background:#fff;padding:40px;border-radius:10px}

@media(max-width:600px){

  .date-chip{display:none}

  .news-grid{grid-template-columns:1fr}
  .news-image{height:220px}
  .breaking-title{padding:0 10px;font-size:11px}
  .breaking-item{font-size:12px}
  .modal{padding:10px}
  .modal-content{padding:18px}
  .modal-title{font-size:24px}
  .modal-actions{flex-direction:column}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* SUPABASE */
const SUPABASE_URL = "https://aoicywtjwvqzzhmxkxvs.supabase.co";
const SUPABASE_KEY = "sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allNews = [], currentCategory = "All", currentNews = null;

/* LANGUAGES (interface text only; news text stays as written in the database) */
const LOCALES = { en:"en-IN", hi:"hi-IN", bn:"bn-IN", ta:"ta-IN" };
const I18N = {
  en:{tag1:"Local News",tag2:"Public Problems",tag3:"Protest",live:"LIVE",search:"Search news...",breaking:"BREAKING",all:"All",common:"Common News",protest:"Protest",public:"Public Problem",news:"News",authority:"Authority Response",shareNews:"📤 Share News",copyLink:"🔗 Copy Link",read:"Read Full News",share:"📤 Share",noNews:"No news found.",noBreaking:"No breaking news available",unable:"Unable to load news.",tryLater:"Please try again later.",copied:t("copied"),loading:"Loading latest news...",india:"India",rights:"© 2026 CIVILLINE. All rights reserved."},
  hi:{tag1:"स्थानीय समाचार",tag2:"जन समस्याएं",tag3:"विरोध प्रदर्शन",live:"लाइव",search:"समाचार खोजें...",breaking:"ताज़ा खबर",all:"सभी",common:"सामान्य समाचार",protest:"विरोध प्रदर्शन",public:"जन समस्या",news:"समाचार",authority:"प्राधिकरण का जवाब",shareNews:"📤 समाचार शेयर करें",copyLink:"🔗 लिंक कॉपी करें",read:"पूरी खबर पढ़ें",share:"📤 शेयर",noNews:"कोई समाचार नहीं मिला।",noBreaking:"कोई ताज़ा खबर उपलब्ध नहीं",unable:"समाचार लोड नहीं हो सका।",tryLater:"कृपया बाद में पुनः प्रयास करें।",copied:"समाचार लिंक कॉपी हो गया!",loading:"ताज़ा समाचार लोड हो रहे हैं...",india:"भारत",rights:"© 2026 CIVILLINE. सर्वाधिकार सुरक्षित।"},
  bn:{tag1:"স্থানীয় সংবাদ",tag2:"জনসমস্যা",tag3:"বিক্ষোভ",live:"লাইভ",search:"সংবাদ খুঁজুন...",breaking:"ব্রেকিং",all:"সব",common:"সাধারণ সংবাদ",protest:"বিক্ষোভ",public:"জনসমস্যা",news:"সংবাদ",authority:"কর্তৃপক্ষের প্রতিক্রিয়া",shareNews:"📤 সংবাদ শেয়ার করুন",copyLink:"🔗 লিংক কপি করুন",read:"সম্পূর্ণ খবর পড়ুন",share:"📤 শেয়ার",noNews:"কোনো সংবাদ পাওয়া যায়নি।",noBreaking:"কোনো ব্রেকিং নিউজ নেই",unable:"সংবাদ লোড করা যায়নি।",tryLater:"অনুগ্রহ করে পরে আবার চেষ্টা করুন।",copied:"সংবাদের লিংক কপি হয়েছে!",loading:"সর্বশেষ সংবাদ লোড হচ্ছে...",india:"ভারত",rights:"© 2026 CIVILLINE. সর্বস্বত্ব সংরক্ষিত।"},
  ta:{tag1:"உள்ளூர் செய்திகள்",tag2:"பொதுப் பிரச்சினைகள்",tag3:"போராட்டம்",live:"நேரலை",search:"செய்திகளைத் தேடுங்கள்...",breaking:"முக்கியச் செய்தி",all:"அனைத்தும்",common:"பொதுச் செய்திகள்",protest:"போராட்டம்",public:"பொதுப் பிரச்சினை",news:"செய்தி",authority:"அதிகாரிகளின் பதில்",shareNews:"📤 செய்தியைப் பகிரவும்",copyLink:"🔗 இணைப்பை நகலெடு",read:"முழுச் செய்தியைப் படிக்க",share:"📤 பகிர்",noNews:"செய்திகள் எதுவும் இல்லை.",noBreaking:"முக்கியச் செய்திகள் இல்லை",unable:"செய்திகளை ஏற்ற முடியவில்லை.",tryLater:"பிறகு மீண்டும் முயற்சிக்கவும்.",copied:"செய்தி இணைப்பு நகலெடுக்கப்பட்டது!",loading:"சமீபத்திய செய்திகள் ஏற்றப்படுகின்றன...",india:"இந்தியா",rights:"© 2026 CIVILLINE. அனைத்து உரிமைகளும் பாதுகாக்கப்பட்டவை."}
};
Object.values(I18N).forEach(L => L.tagline = [L.tag1, L.tag2, L.tag3].join(" • "));

let LANG = "en";
try{ const saved = localStorage.getItem("civilline_lang"); if(I18N[saved]) LANG = saved; }catch(e){}

const t = key => (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
const CAT_KEYS = { "Common News":"common", "Protest":"protest", "Public Problem":"public", "News":"news" };
const catLabel = c => CAT_KEYS[c] ? t(CAT_KEYS[c]) : (c || t("news"));

/* Built-in placeholder (no external service needed) */
const PLACEHOLDER = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><rect width="800" height="500" fill="#111827"/>' +
  '<text x="400" y="265" font-size="56" font-weight="bold" font-family="Arial" fill="#f59e0b" text-anchor="middle">CIVILLINE</text></svg>');

/* HEADER ANIMATION: shrink on scroll + date */
const header = document.getElementById("siteHeader");
window.addEventListener("scroll", () => header.classList.toggle("scrolled", window.scrollY > 40), { passive:true });
/* date chip is set in applyLang() */

/* HELPERS */
const byId = id => document.getElementById(id);
const findNews = id => allNews.find(n => String(n.id) === String(id));
function escapeHtml(v){
  if(v === null || v === undefined) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
const escapeAttribute = escapeHtml;
function formatDate(date){
  if(!date) return "";
  return new Date(date).toLocaleDateString(LOCALES[LANG] || "en-IN", { day:"2-digit", month:"short", year:"numeric" });
}

/* LOAD NEWS */
async function loadNews(){
  const grid = byId("newsGrid");
  if(!allNews.length) grid.innerHTML = `<div class="loading">${t("loading")}</div>`;

  const { data, error } = await db.from("news")
    .select("id,title,category,location,excerpt,content,authority_response,status,image_url,created_at")
    .eq("published", true)
    .order("created_at", { ascending:false });

  if(error){
    console.error("Supabase error:", error);
    grid.innerHTML = `<div class="empty">${t("unable")}<br><br>${t("tryLater")}</div>`;
    return;
  }
  allNews = data || [];
  updateBreakingNews();
  renderNews();
  if(!currentNews) openNewsFromURL();
}

/* BREAKING NEWS */
function updateBreakingNews(){
  const track = byId("breakingTrack");
  if(!allNews.length){
    track.innerHTML = `<div class="breaking-item"><span class="breaking-dot"></span>${t("noBreaking")}</div>`;
    return;
  }
  const html = allNews.slice(0,10).map(n =>
    `<div class="breaking-item" onclick="openNews('${escapeAttribute(n.id)}')"><span class="breaking-dot"></span>${escapeHtml(n.title)}</div>`
  ).join("");
  track.innerHTML = html + html;
}

/* RENDER NEWS */
function renderNews(){
  const grid = byId("newsGrid");
  const search = byId("searchInput").value.trim().toLowerCase();

  const filtered = allNews.filter(n => {
    const categoryMatch = currentCategory === "All" || n.category === currentCategory;
    const text = ((n.title||"") + " " + (n.excerpt||"") + " " + (n.location||"") + " " + (n.category||"")).toLowerCase();
    return categoryMatch && (!search || text.includes(search));
  });

  if(!filtered.length){
    grid.innerHTML = `<div class="empty">${t("noNews")}</div>`;
    return;
  }

  grid.innerHTML = filtered.map((n, i) => {
    const id = escapeAttribute(n.id);
    return `
      <article class="news-card" style="animation-delay:${Math.min(i,8)*60}ms">
        <img class="news-image" src="${escapeAttribute(n.image_url || PLACEHOLDER)}"
             alt="${escapeAttribute(n.title || "News image")}" loading="lazy"
             onclick="openNews('${id}')" onerror="this.onerror=null;this.src=PLACEHOLDER">
        <div class="news-content">
          <div class="news-category">${escapeHtml(catLabel(n.category))}</div>
          <h2 class="news-title" onclick="openNews('${id}')">${escapeHtml(n.title || "")}</h2>
          <p class="news-excerpt" onclick="openNews('${id}')">${escapeHtml(n.excerpt || "")}</p>
          <div class="news-meta">
            <span>${escapeHtml(n.location || t("india"))}</span>
            <span>${formatDate(n.created_at)}</span>
          </div>
          <div class="news-actions">
            <button class="read-btn" onclick="openNews('${id}')">${t("read")}</button>
            <button class="share-btn" onclick="shareNews('${id}',event)">${t("share")}</button>
          </div>
        </div>
      </article>`;
  }).join("");
}

/* CATEGORY + SEARCH */
function setCategory(category, button){
  currentCategory = category;
  document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
  if(button) button.classList.add("active");
  renderNews();
}
function filterNews(){ renderNews(); }

/* SHARE */
function getNewsUrl(id){
  const url = new URL(window.location.href);
  url.search = ""; url.hash = "";
  url.searchParams.set("news", id);
  return url.toString();
}

async function shareNews(id, event){
  if(event) event.stopPropagation();
  const news = findNews(id);
  if(!news) return;
  const shareUrl = getNewsUrl(news.id);
  const title = news.title || "CIVILLINE News";
  const description = news.excerpt || news.content || "Read the latest news on CIVILLINE.";

  if(navigator.share){
    try{
      await navigator.share({ title, text: title + "\n\n" + description + "\n\nCIVILLINE", url: shareUrl });
      return;
    }catch(error){
      if(error && error.name === "AbortError") return;
    }
  }
  copyToClipboard(shareUrl, t("copied"));
}

async function shareCurrentNews(){ if(currentNews) await shareNews(currentNews.id); }
function copyCurrentNewsLink(){ if(currentNews) copyToClipboard(getNewsUrl(currentNews.id), t("copied")); }

async function copyToClipboard(text, message){
  try{
    await navigator.clipboard.writeText(text);
  }catch(error){
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    document.execCommand("copy");
    document.body.removeChild(t);
  }
  alert(message || "Link copied!");
}

/* MODAL */
function openNews(id){
  const news = findNews(id);
  if(!news) return;
  currentNews = news;
  window.history.pushState({ newsId: news.id }, "", getNewsUrl(news.id));
  showNewsContent(news);
}

function showNewsContent(news){
  const img = byId("modalImage");
  img.onerror = function(){ this.onerror = null; this.src = PLACEHOLDER; };
  img.src = news.image_url || PLACEHOLDER;

  byId("modalCategory").textContent = catLabel(news.category);
  byId("modalTitle").textContent = news.title || "";
  byId("modalMeta").textContent = (news.location || t("india")) + " • " + formatDate(news.created_at) + (news.status ? " • " + news.status : "");
  byId("modalBody").textContent = news.content || news.excerpt || "";

  const box = byId("authorityBox");
  if(news.authority_response){
    box.style.display = "block";
    byId("modalAuthority").textContent = news.authority_response;
  }else{
    box.style.display = "none";
  }
  byId("newsModal").style.display = "block";
  document.body.style.overflow = "hidden";
}

function openNewsFromURL(){
  const id = new URLSearchParams(window.location.search).get("news");
  if(!id) return;
  const news = findNews(id);
  if(news){ currentNews = news; showNewsContent(news); }
}

function closeModal(){
  byId("newsModal").style.display = "none";
  document.body.style.overflow = "";
  const url = new URL(window.location.href);
  url.searchParams.delete("news");
  window.history.pushState({}, "", url.pathname + url.search);
  currentNews = null;
}
function closeOutside(e){ if(e.target.id === "newsModal") closeModal(); }

window.addEventListener("popstate", function(){
  const id = new URLSearchParams(window.location.search).get("news");
  const news = id ? findNews(id) : null;
  if(news){
    currentNews = news; showNewsContent(news);
  }else{
    byId("newsModal").style.display = "none";
    document.body.style.overflow = "";
    currentNews = null;
  }
});

document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

/* REALTIME */
db.channel("news-realtime")
  .on("postgres_changes", { event:"*", schema:"public", table:"news" }, () => loadNews())
  .subscribe();

/* LANGUAGE SWITCHER */
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  byId("langSelect").value = LANG;
  byId("dateChip").textContent = new Date().toLocaleDateString(LOCALES[LANG] || "en-IN", { weekday:"short", day:"2-digit", month:"short", year:"numeric" });
  if(allNews.length){ updateBreakingNews(); renderNews(); }
  if(currentNews) showNewsContent(currentNews);
}
function setLang(code){
  if(!I18N[code]) return;
  LANG = code;
  try{ localStorage.setItem("civilline_lang", code); }catch(e){}
  applyLang();
}

/* INITIAL LOAD */
applyLang();
loadNews();
</script>
