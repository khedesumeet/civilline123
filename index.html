<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contractor Enquiry Portal</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#123047;
    color:white;
    padding:15px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#ffb000;
}

header button,
.submit{
    background:#ffb000;
    color:#111;
    border:0;
    padding:11px 17px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.hero{
    background:linear-gradient(135deg,#123047,#17639a);
    color:white;
    padding:55px 5%;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}

.hero h1{
    font-size:40px;
    margin:0 0 12px;
}

.hero p{
    max-width:700px;
    line-height:1.6;
}

.search{
    background:white;
    max-width:900px;
    margin-top:25px;
    padding:10px;
    border-radius:10px;
    display:flex;
    gap:10px;
}

.search input{
    flex:1;
    padding:13px;
    border:1px solid #ddd;
    border-radius:7px;
}

.search button{
    background:#ffb000;
    border:0;
    padding:0 20px;
    border-radius:7px;
    font-weight:bold;
}

.section{
    padding:35px 0;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.jobs{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.job{
    background:white;
    border-radius:12px;
    padding:20px;
    border:1px solid #e2e2e2;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.job h3{
    color:#123047;
}

.tag{
    display:inline-block;
    background:#edf5fb;
    color:#17639a;
    padding:6px 9px;
    border-radius:20px;
    font-size:12px;
    margin:3px;
}

.budget{
    color:#198754;
    font-size:18px;
    font-weight:bold;
    margin:12px 0;
}

.description{
    color:#555;
    line-height:1.5;
}

.job-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
}

.interest{
    background:#17639a;
    color:white;
    border:0;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
}

.loading,
.empty{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:10px;
    grid-column:1/-1;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:999;
    padding:20px;
    overflow:auto;
}

.modal-box{
    background:white;
    max-width:650px;
    margin:40px auto;
    padding:25px;
    border-radius:12px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    font-size:28px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:14px;
}

textarea{
    min-height:120px;
}

footer{
    background:#123047;
    color:white;
    text-align:center;
    padding:30px;
}

@media(max-width:700px){

    .hero h1{
        font-size:30px;
    }

    .search{
        flex-direction:column;
    }

    .search button{
        padding:12px;
    }

    .jobs{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .section-title{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
Civil<span>Connect</span>
</div>

<button onclick="openPost()">
+ Post Enquiry
</button>

</header>


<section class="hero">

<div class="container">

<h1>
Contractor Enquiry Portal
</h1>

<p>
Find construction enquiries, connect with customers,
and get new civil engineering and contracting work.
</p>

<div class="search">

<input
id="search"
type="text"
placeholder="Search RCC, road, wall, shuttering..."
oninput="searchJobs()">

<button onclick="searchJobs()">
Search
</button>

</div>

</div>

</section>


<section class="section">

<div class="container">

<div class="section-title">

<h2>
Latest Construction Enquiries
</h2>

<button
class="submit"
onclick="openPost()">

Post Requirement

</button>

</div>

<div id="jobs" class="jobs">

<div class="loading">
Loading enquiries...
</div>

</div>

</div>

</section>


<!-- POST ENQUIRY -->

<div id="postModal" class="modal">

<div class="modal-box">

<div class="modal-header">

<h2>
Post Construction Enquiry
</h2>

<span class="close" onclick="closePost()">
×
</span>

</div>

<br>

<form id="postForm">

<div class="form-grid">

<div>
<label>Name *</label>
<input name="name" required>
</div>

<div>
<label>Phone *</label>
<input name="phone" type="tel" required>
</div>

<div>
<label>Work Type *</label>

<select name="workType" required>

<option value="">Select Work</option>
<option>Building Construction</option>
<option>RCC Work</option>
<option>Plum Concrete</option>
<option>Retaining Wall</option>
<option>Road Work</option>
<option>Shuttering</option>
<option>Bar Bending</option>
<option>Tremix Flooring</option>
<option>Excavation</option>
<option>Waterproofing</option>
<option>Painting</option>
<option>Electrical</option>
<option>Plumbing</option>
<option>Other</option>

</select>
</div>

<div>
<label>Location *</label>
<input name="location" required>
</div>

<div>
<label>Budget</label>
<input name="budget" placeholder="₹2,00,000">
</div>

<div>
<label>Required Date</label>
<input name="requiredDate" type="date">
</div>

<div class="full">
<label>Description *</label>

<textarea
name="description"
placeholder="Describe your construction requirement..."
required></textarea>
</div>

<div class="full">
<label>Project Image URL</label>

<input
name="imageUrl"
type="url"
placeholder="https://example.com/image.jpg">
</div>

</div>

<br>

<button class="submit" type="submit">
Submit Enquiry
</button>

</form>

</div>

</div>


<!-- INTEREST -->

<div id="interestModal" class="modal">

<div class="modal-box">

<div class="modal-header">

<h2>
I'm Interested
</h2>

<span class="close" onclick="closeInterest()">
×
</span>

</div>

<br>

<form id="interestForm">

<input
type="hidden"
id="enquiryId"
name="enquiryId">

<label>
Contractor Name *
</label>

<input name="contractor" required>

<br><br>

<label>
Phone / WhatsApp *
</label>

<input name="phone" type="tel" required>

<br><br>

<label>
Message *
</label>

<textarea
name="message"
placeholder="Tell the customer about your experience and quotation..."
required></textarea>

<br><br>

<button class="submit" type="submit">
Send Response
</button>

</form>

</div>

</div>


<footer>

<strong>
Civilline
</strong>

<p>
Construction Enquiry Platform
</p>

</footer>


<script>

/* =====================================================
   NEW APPS SCRIPT URL
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwvGbYKGWxHY7LflutBB_oZer5uNeOnWe7ninp6eJFI-VxCi5pkYb1qnpwuWd1qEL4Qeg/exec";


let allJobs = [];


/* =====================================================
   LOAD ENQUIRIES
   ===================================================== */

async function loadJobs(){

    const box =
    document.getElementById("jobs");

    box.innerHTML =
    `<div class="loading">
    Loading enquiries...
    </div>`;

    try{

        const response =
        await fetch(
            API_URL + "?action=getEnquiries"
        );

        if(!response.ok){

            throw new Error(
                "HTTP error " +
                response.status
            );

        }

        const data =
        await response.json();

        console.log(
            "Apps Script response:",
            data
        );

        if(data.success === true){

            allJobs =
            data.enquiries || [];

            displayJobs(allJobs);

        }else{

            throw new Error(
                data.error ||
                "API returned an error"
            );

        }

    }catch(error){

        console.error(
            "API ERROR:",
            error
        );

        box.innerHTML = `

        <div class="empty">

        <h3>
        Could not load enquiries
        </h3>

        <p>
        ${escapeHTML(error.message)}
        </p>

        <br>

        <button
        class="submit"
        onclick="loadJobs()">

        Try Again

        </button>

        </div>

        `;

    }

}


/* =====================================================
   DISPLAY
   ===================================================== */

function displayJobs(jobs){

    const box =
    document.getElementById("jobs");

    if(!jobs.length){

        box.innerHTML = `

        <div class="empty">

        <h3>
        No enquiries available
        </h3>

        <p>
        Post the first construction requirement.
        </p>

        </div>

        `;

        return;
    }

    box.innerHTML =
    jobs.map(function(job){

        let image = "";

        if(job.imageUrl){

            image = `

            <img
            src="${escapeHTML(job.imageUrl)}"
            style="
            width:100%;
            height:180px;
            object-fit:cover;
            border-radius:8px;
            margin:12px 0;
            "
            onerror="this.style.display='none'">

            `;

        }

        return `

        <div class="job">

        <small>
        ${escapeHTML(job.name)}
        </small>

        <h3>
        ${escapeHTML(job.workType)}
        </h3>

        <span class="tag">
        📍 ${escapeHTML(job.location)}
        </span>

        ${
            job.requiredDate
            ?
            `<span class="tag">
            📅 ${escapeHTML(job.requiredDate)}
            </span>`
            :
            ""
        }

        <div class="budget">

        ${
            escapeHTML(job.budget) ||
            "Budget negotiable"
        }

        </div>

        <div class="description">

        ${escapeHTML(job.description)}

        </div>

        ${image}

        <div class="job-footer">

        <small>
        ${escapeHTML(job.date)}
        </small>

        <button
        class="interest"
        onclick="openInterest('${escapeHTML(job.id)}')">

        I'm Interested

        </button>

        </div>

        </div>

        `;

    }).join("");

}


/* =====================================================
   SEARCH
   ===================================================== */

function searchJobs(){

    const keyword =
    document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();

    if(!keyword){

        displayJobs(allJobs);
        return;

    }

    const results =
    allJobs.filter(function(job){

        const text = `

        ${job.name || ""}
        ${job.workType || ""}
        ${job.location || ""}
        ${job.description || ""}
        ${job.budget || ""}

        `.toLowerCase();

        return text.includes(keyword);

    });

    displayJobs(results);

}


/* =====================================================
   SEND TO APPS SCRIPT
   ===================================================== */

async function sendData(
    action,
    formData
){

    const data = {
        action:action
    };

    for(
        const [key,value]
        of formData.entries()
    ){

        data[key] = value;

    }

    const response =
    await fetch(

        API_URL,

        {
            method:"POST",

            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
            JSON.stringify(data)
        }

    );

    if(!response.ok){

        throw new Error(
            "HTTP error " +
            response.status
        );

    }

    return await response.json();

}


/* =====================================================
   POST ENQUIRY
   ===================================================== */

document
.getElementById("postForm")
.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    const form =
    e.target;

    const button =
    form.querySelector("button");

    button.disabled = true;

    button.innerText =
    "Submitting...";

    try{

        const result =
        await sendData(
            "postEnquiry",
            new FormData(form)
        );

        console.log(
            "Post result:",
            result
        );

        if(result.success){

            alert(
                "Enquiry submitted successfully!"
            );

            form.reset();

            closePost();

            loadJobs();

        }else{

            alert(
                result.error ||
                "Submission failed"
            );

        }

    }catch(error){

        console.error(error);

        alert(
            "Could not connect to Apps Script."
        );

    }

    button.disabled = false;

    button.innerText =
    "Submit Enquiry";

});


/* =====================================================
   CONTRACTOR RESPONSE
   ===================================================== */

document
.getElementById("interestForm")
.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    const form =
    e.target;

    const button =
    form.querySelector("button");

    button.disabled = true;

    button.innerText =
    "Sending...";

    try{

        const result =
        await sendData(
            "sendResponse",
            new FormData(form)
        );

        if(result.success){

            alert(
                "Your response has been sent!"
            );

            form.reset();

            closeInterest();

        }else{

            alert(
                result.error ||
                "Unable to send response"
            );

        }

    }catch(error){

        console.error(error);

        alert(
            "Could not connect to Apps Script."
        );

    }

    button.disabled = false;

    button.innerText =
    "Send Response";

});


/* =====================================================
   MODALS
   ===================================================== */

function openPost(){

    document
    .getElementById("postModal")
    .style.display =
    "block";

}

function closePost(){

    document
    .getElementById("postModal")
    .style.display =
    "none";

}

function openInterest(id){

    document
    .getElementById("enquiryId")
    .value =
    id;

    document
    .getElementById("interestModal")
    .style.display =
    "block";

}

function closeInterest(){

    document
    .getElementById("interestModal")
    .style.display =
    "none";

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   CLOSE MODALS
   ===================================================== */

window.onclick =
function(event){

    if(
        event.target.classList
        .contains("modal")
    ){

        event.target.style.display =
        "none";

    }

};


/* =====================================================
   START
   ===================================================== */

loadJobs();

</script>

</body>
</html>
