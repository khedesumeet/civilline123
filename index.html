/* =====================================================

*{

/* =====================================================

header{

.breaking-item{

</style>

<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://aoicywtjwvqzzhmxkxvs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let allNews = [];

let currentCategory = "All";

let currentNews = null;


/* =====================================================
   LOAD NEWS
===================================================== */

async function loadNews(){

  const grid =
    document.getElementById(
      "newsGrid"
    );


  grid.innerHTML =
    '<div class="loading">Loading latest news...</div>';


  const {
    data,
    error
  } = await db
    .from("news")
    .select(`
      id,
      title,
      category,
      location,
      excerpt,
      content,
      authority_response,
      status,
      image_url,
      created_at
    `)
    .eq(
      "published",
      true
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "Supabase error:",
      error
    );


    grid.innerHTML = `
      <div class="empty">

        Unable to load news.

        <br><br>

        Please try again later.

      </div>
    `;

    return;

  }


  allNews =
    data || [];


  updateBreakingNews();

  renderNews();

  openNewsFromURL();

}


/* =====================================================
   BREAKING NEWS
===================================================== */

function updateBreakingNews(){

  const track =
    document.getElementById(
      "breakingTrack"
    );


  if(!allNews.length){

    track.innerHTML = `
      <div class="breaking-item">

        <span class="breaking-dot"></span>

        No breaking news available

      </div>
    `;

    return;

  }


  const latest =
    allNews.slice(
      0,
      10
    );


  let html = "";


  latest.forEach(function(news){

    html += `

      <div
        class="breaking-item"
        onclick="openNews('${escapeAttribute(news.id)}')"
      >

        <span class="breaking-dot"></span>

        ${escapeHtml(news.title)}

      </div>

    `;

  });


  track.innerHTML =
    html + html;

}


/* =====================================================
   RENDER NEWS
===================================================== */

function renderNews(){

  const grid =
    document.getElementById(
      "newsGrid"
    );


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allNews.filter(function(news){

      const categoryMatch =
        currentCategory === "All" ||
        news.category ===
        currentCategory;


      const searchText =
        (
          (news.title || "") +
          " " +
          (news.excerpt || "") +
          " " +
          (news.location || "") +
          " " +
          (news.category || "")
        ).toLowerCase();


      const searchMatch =
        !search ||
        searchText.includes(
          search
        );


      return (
        categoryMatch &&
        searchMatch
      );

    });


  if(!filtered.length){

    grid.innerHTML = `
      <div class="empty">
        No news found.
      </div>
    `;

    return;

  }


  grid.innerHTML =
    filtered.map(function(news){

      const image =
        news.image_url ||
        "https://via.placeholder.com/800x500?text=CIVILLINE";


      return `

        <article class="news-card">


          <img
            class="news-image"
            src="${escapeAttribute(image)}"
            alt="${escapeAttribute(news.title || "News image")}"
            loading="lazy"
            onclick="openNews('${escapeAttribute(news.id)}')"
            onerror="this.src='https://via.placeholder.com/800x500?text=CIVILLINE'"
          >


          <div class="news-content">


            <div class="news-category">

              ${escapeHtml(
                news.category ||
                "News"
              )}

            </div>


            <h2
              class="news-title"
              onclick="openNews('${escapeAttribute(news.id)}')"
            >

              ${escapeHtml(
                news.title ||
                ""
              )}

            </h2>


            <p
              class="news-excerpt"
              onclick="openNews('${escapeAttribute(news.id)}')"
            >

              ${escapeHtml(
                news.excerpt ||
                ""
              )}

            </p>


            <div class="news-meta">

              <span>

                ${escapeHtml(
                  news.location ||
                  "India"
                )}

              </span>


              <span>

                ${formatDate(
                  news.created_at
                )}

              </span>

            </div>


            <div class="news-actions">


              <button
                class="read-btn"
                onclick="openNews('${escapeAttribute(news.id)}')"
              >
                Read Full News
              </button>


              <button
                class="share-btn"
                onclick="shareNews('${escapeAttribute(news.id)}',event)"
              >
                📤 Share
              </button>


            </div>


          </div>

        </article>

      `;

    }).join("");

}


/* =====================================================
   CATEGORY
===================================================== */

function setCategory(
  category,
  button
){

  currentCategory =
    category;


  document
    .querySelectorAll(
      ".category-btn"
    )
    .forEach(function(btn){

      btn.classList.remove(
        "active"
      );

    });


  if(button){

    button.classList.add(
      "active"
    );

  }


  renderNews();

}


/* =====================================================
   SEARCH
===================================================== */

function filterNews(){

  renderNews();

}


/* =====================================================
   CREATE NEWS URL
===================================================== */

function getNewsUrl(id){

  const url =
    new URL(
      window.location.href
    );


  url.search = "";

  url.hash = "";


  url.searchParams.set(
    "news",
    id
  );


  return url.toString();

}


/* =====================================================
   SHARE NEWS
===================================================== */

async function shareNews(
  id,
  event
){

  if(event){

    event.stopPropagation();

  }


  const news =
    allNews.find(function(item){

      return String(
        item.id
      ) ===
      String(id);

    });


  if(!news){

    return;

  }


  const shareUrl =
    getNewsUrl(
      news.id
    );


  /* Actual news title */

  const title =
    news.title ||
    "CIVILLINE News";


  /* News description */

  const description =
    news.excerpt ||
    news.content ||
    "Read the latest news on CIVILLINE.";


  const shareData = {

    title:
      title,

    text:
      title +
      "\n\n" +
      description +
      "\n\nCIVILLINE",

    url:
      shareUrl

  };


  /*
    Android / iPhone native
    share menu.
  */

  if(
    navigator.share
  ){

    try{

      await navigator.share(
        shareData
      );

      return;

    }
    catch(error){

      if(
        error &&
        error.name ===
        "AbortError"
      ){

        return;

      }

    }

  }


  /*
    Browser fallback.
  */

  copyToClipboard(
    shareUrl,
    "News link copied!"
  );

}


/* =====================================================
   SHARE CURRENT NEWS
===================================================== */

async function shareCurrentNews(){

  if(!currentNews){

    return;

  }


  await shareNews(
    currentNews.id
  );

}


/* =====================================================
   COPY CURRENT NEWS LINK
===================================================== */

function copyCurrentNewsLink(){

  if(!currentNews){

    return;

  }


  const url =
    getNewsUrl(
      currentNews.id
    );


  copyToClipboard(
    url,
    "News link copied!"
  );

}


/* =====================================================
   COPY LINK
===================================================== */

async function copyToClipboard(
  text,
  message
){

  try{

    await navigator.clipboard.writeText(
      text
    );


    alert(
      message ||
      "Link copied!"
    );

  }
  catch(error){

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    document.body.removeChild(
      textarea
    );


    alert(
      message ||
      "Link copied!"
    );

  }

}


/* =====================================================
   OPEN NEWS
===================================================== */

function openNews(id){

  const news =
    allNews.find(function(item){

      return String(
        item.id
      ) ===
      String(id);

    });


  if(!news){

    return;

  }


  currentNews =
    news;


  const newUrl =
    getNewsUrl(
      news.id
    );


  window.history.pushState(
    {
      newsId:news.id
    },
    "",
    newUrl
  );


  showNewsContent(
    news
  );

}


/* =====================================================
   SHOW NEWS CONTENT
===================================================== */

function showNewsContent(
  news
){

  const image =
    news.image_url ||
    "https://via.placeholder.com/800x500?text=CIVILLINE";


  document.getElementById(
    "modalImage"
  ).src =
    image;


  document.getElementById(
    "modalImage"
  ).onerror =
    function(){

      this.src =
        "https://via.placeholder.com/800x500?text=CIVILLINE";

    };


  document.getElementById(
    "modalCategory"
  ).textContent =
    news.category ||
    "NEWS";


  document.getElementById(
    "modalTitle"
  ).textContent =
    news.title ||
    "";


  document.getElementById(
    "modalMeta"
  ).textContent =
    (
      news.location ||
      "India"
    ) +
    " • " +
    formatDate(
      news.created_at
    ) +
    (
      news.status
        ? " • " +
          news.status
        : ""
    );


  document.getElementById(
    "modalBody"
  ).textContent =
    news.content ||
    news.excerpt ||
    "";


  const authorityBox =
    document.getElementById(
      "authorityBox"
    );


  if(
    news.authority_response
  ){

    authorityBox.style.display =
      "block";


    document.getElementById(
      "modalAuthority"
    ).textContent =
      news.authority_response;

  }
  else{

    authorityBox.style.display =
      "none";

  }


  document.getElementById(
    "newsModal"
  ).style.display =
    "block";


  document.body.style.overflow =
    "hidden";

}


/* =====================================================
   OPEN SHARED NEWS
===================================================== */

function openNewsFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const newsId =
    params.get(
      "news"
    );


  if(!newsId){

    return;

  }


  const news =
    allNews.find(function(item){

      return String(
        item.id
      ) ===
      String(newsId);

    });


  if(news){

    setTimeout(function(){

      currentNews =
        news;


      showNewsContent(
        news
      );

    },300);

  }

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

  document.getElementById(
    "newsModal"
  ).style.display =
    "none";


  document.body.style.overflow =
    "";


  const url =
    new URL(
      window.location.href
    );


  url.searchParams.delete(
    "news"
  );


  window.history.pushState(
    {},
    "",
    url.pathname +
    (
      url.search
        ? url.search
        : ""
    )
  );


  currentNews =
    null;

}


/* =====================================================
   CLOSE OUTSIDE
===================================================== */

function closeOutside(
  event
){

  if(
    event.target.id ===
    "newsModal"
  ){

    closeModal();

  }

}


/* =====================================================
   BROWSER BACK
===================================================== */

window.addEventListener(
  "popstate",
  function(){

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get(
        "news"
      );


    if(id){

      const news =
        allNews.find(function(item){

          return String(
            item.id
          ) ===
          String(id);

        });


      if(news){

        currentNews =
          news;


        showNewsContent(
          news
        );

      }

    }
    else{

      document.getElementById(
        "newsModal"
      ).style.display =
        "none";


      document.body.style.overflow =
        "";


      currentNews =
        null;

    }

  }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Escape"
    ){

      closeModal();

    }

  }
);


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(
  date
){

  if(!date){

    return "";

  }


  const d =
    new Date(date);


  return d.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ATTRIBUTE ESCAPE
===================================================== */

function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}


/* =====================================================
   SUPABASE REALTIME
===================================================== */

db
.channel(
  "news-realtime"
)
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"news"
  },
  function(){

    loadNews();

  }
)
.subscribe();


/* =====================================================
   INITIAL LOAD
===================================================== */

loadNews();
