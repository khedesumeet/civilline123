<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CIVILLINE | Latest News</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#222;
}

/* HEADER */

header{
    background:#111827;
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:28px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#f59e0b;
}

.tagline{
    font-size:13px;
    color:#d1d5db;
}

/* BREAKING NEWS */

.breaking{
    background:#dc2626;
    color:white;
    padding:10px;
    overflow:hidden;
    white-space:nowrap;
}

.breaking-title{
    font-weight:bold;
    margin-right:15px;
}

/* NAV */

.nav{
    background:white;
    border-bottom:1px solid #ddd;
    padding:12px 15px;
    position:sticky;
    top:73px;
    z-index:900;
}

.nav-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    gap:10px;
    overflow-x:auto;
}

.category-btn{
    border:1px solid #ddd;
    background:white;
    padding:9px 16px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    font-weight:600;
}

.category-btn:hover,
.category-btn.active{
    background:#111827;
    color:white;
}

/* MAIN */

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

/* SEARCH */

.search-box{
    margin-bottom:25px;
}

.search-box input{
    width:100%;
    padding:15px 18px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.search-box input:focus{
    border-color:#111827;
}

/* GRID */

.news-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

/* CARD */

.news-card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    cursor:pointer;
    transition:.2s;
}

.news-card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.news-image{
    width:100%;
    height:210px;
    object-fit:cover;
    display:block;
    background:#e5e7eb;
}

.news-content{
    padding:17px;
}

.category{
    display:inline-block;
    padding:5px 9px;
    background:#eef2ff;
    color:#3730a3;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:9px;
}

.news-title{
    font-size:20px;
    line-height:1.3;
    margin-bottom:8px;
}

.news-meta{
    color:#6b7280;
    font-size:13px;
    margin-bottom:10px;
}

.news-excerpt{
    color:#4b5563;
    line-height:1.5;
    font-size:14px;
}

/* STATUS */

.status{
    display:inline-block;
    margin-top:12px;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.status.Pending{
    background:#fef3c7;
    color:#92400e;
}

.status.In-Progress{
    background:#dbeafe;
    color:#1e40af;
}

.status.Resolved{
    background:#dcfce7;
    color:#166534;
}

/* LOADING */

.loading{
    text-align:center;
    padding:50px;
    color:#666;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    background:white;
    padding:50px;
    border-radius:12px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:2000;
    overflow-y:auto;
    padding:30px 15px;
}

.modal.show{
    display:block;
}

.modal-box{
    max-width:850px;
    margin:auto;
    background:white;
    border-radius:14px;
    overflow:hidden;
    position:relative;
}

.modal-image{
    width:100%;
    max-height:450px;
    object-fit:cover;
    display:block;
}

.modal-content{
    padding:25px;
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    width:38px;
    height:38px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:24px;
    cursor:pointer;
    z-index:10;
}

.modal-title{
    font-size:30px;
    line-height:1.25;
    margin:12px 0;
}

.modal-meta{
    color:#6b7280;
    margin-bottom:20px;
}

.modal-text{
    line-height:1.8;
    white-space:pre-line;
}

.authority{
    margin-top:25px;
    padding:18px;
    background:#f3f4f6;
    border-left:4px solid #111827;
}

.authority h3{
    margin-bottom:8px;
}

/* FOOTER */

footer{
    margin-top:50px;
    background:#111827;
    color:#d1d5db;
    padding:30px 15px;
    text-align:center;
}

.footer-logo{
    font-size:24px;
    font-weight:bold;
    color:white;
    margin-bottom:8px;
}

/* RESPONSIVE */

@media(max-width:900px){

    .news-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .header-inner{
        display:block;
    }

    .tagline{
        margin-top:5px;
    }

    .nav{
        top:84px;
    }

    .news-grid{
        grid-template-columns:1fr;
    }

    .news-image{
        height:220px;
    }

    .modal-title{
        font-size:24px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div class="header-inner">

        <div>
            <div class="logo">
                CIVIL<span>LINE</span>
            </div>

            <div class="tagline">
                Local News • Public Problems • Protest
            </div>
        </div>

    </div>

</header>


<!-- BREAKING NEWS -->

<div class="breaking">

    <span class="breaking-title">
        BREAKING NEWS
    </span>

    <span id="breakingText">
        Latest CIVILLINE updates
    </span>

</div>


<!-- CATEGORY NAVIGATION -->

<div class="nav">

    <div class="nav-inner">

        <button
            class="category-btn active"
            onclick="setCategory('All',this)">
            All
        </button>

        <button
            class="category-btn"
            onclick="setCategory('Common News',this)">
            Common News
        </button>

        <button
            class="category-btn"
            onclick="setCategory('Protest',this)">
            Protest
        </button>

        <button
            class="category-btn"
            onclick="setCategory('Public Problem',this)">
            Public Problem
        </button>

    </div>

</div>


<!-- MAIN -->

<main class="container">

    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="Search news, location or title..."
            oninput="filterNews()"
        >

    </div>


    <!-- NEWS -->

    <div
        id="newsGrid"
        class="news-grid">

        <div class="loading">
            Loading news...
        </div>

    </div>

</main>


<!-- NEWS MODAL -->

<div
    id="newsModal"
    class="modal"
    onclick="closeOutside(event)">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()">
            ×
        </button>

        <img
            id="modalImage"
            class="modal-image"
            src=""
            alt="News image"
        >

        <div class="modal-content">

            <div
                id="modalCategory"
                class="category">
            </div>

            <h1
                id="modalTitle"
                class="modal-title">
            </h1>

            <div
                id="modalMeta"
                class="modal-meta">
            </div>

            <div
                id="modalStatus"
                class="status">
            </div>

            <div
                id="modalText"
                class="modal-text"
                style="margin-top:20px;">
            </div>

            <div
                id="authorityBox"
                class="authority"
                style="display:none;">

                <h3>
                    Authority Response
                </h3>

                <div id="authorityText"></div>

            </div>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <div class="footer-logo">
        CIVILLINE
    </div>

    <div>
        Local News • Public Problems • Protest
    </div>

    <div style="margin-top:10px;font-size:13px;">
        © 2026 CIVILLINE. All Rights Reserved.
    </div>

</footer>


<script>

/* ==========================================
   SUPABASE CONFIGURATION
========================================== */

const SUPABASE_URL =
    "https://aoicywtjwvqzzhmxkxvs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   GLOBAL VARIABLES
========================================== */

let allNews = [];

let currentCategory = "All";


/* ==========================================
   LOAD NEWS
========================================== */

async function loadNews(){

    const grid =
        document.getElementById("newsGrid");

    grid.innerHTML =
        `<div class="loading">
            Loading news...
        </div>`;

    try{

        const { data, error } =

            await db
                .from("news")
                .select(`
                    id,
                    title,
                    category,
                    location,
                    excerpt,
                    content,
                    authority_response,
                    status,
                    image_url,
                    created_at
                `)
                .eq("published", true)
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(error);

            grid.innerHTML =
                `<div class="empty">
                    Unable to load news.
                </div>`;

            return;
        }


        allNews = data || [];

        updateBreakingNews();

        renderNews(allNews);

    }

    catch(error){

        console.error(error);

        grid.innerHTML =
            `<div class="empty">
                Unable to connect to CIVILLINE.
            </div>`;

    }

}


/* ==========================================
   RENDER NEWS
========================================== */

function renderNews(news){

    const grid =
        document.getElementById("newsGrid");


    if(!news.length){

        grid.innerHTML =
            `<div class="empty">
                No news found.
            </div>`;

        return;
    }


    grid.innerHTML =
        news.map(item => {

            const date =
                formatDate(item.created_at);


            const image =
                item.image_url
                ? item.image_url
                : "";


            const statusClass =
                (item.status || "Pending")
                .replace(/\s+/g,"-");


            return `

                <article
                    class="news-card"
                    onclick="openNews('${item.id}')">

                    ${
                        image
                        ?
                        `<img
                            class="news-image"
                            src="${escapeAttribute(image)}"
                            alt="${escapeAttribute(item.title)}"
                            loading="lazy"
                            onerror="this.style.display='none';"
                        >`
                        :
                        ``
                    }


                    <div class="news-content">

                        <div class="category">
                            ${escapeHtml(item.category)}
                        </div>


                        <h2 class="news-title">
                            ${escapeHtml(item.title)}
                        </h2>


                        <div class="news-meta">

                            ${
                                item.location
                                ?
                                escapeHtml(item.location) + " • "
                                :
                                ""
                            }

                            ${date}

                        </div>


                        <div class="news-excerpt">

                            ${escapeHtml(
                                item.excerpt ||
                                item.content.substring(0,180)
                            )}

                        </div>


                        <span
                            class="status ${statusClass}">

                            ${escapeHtml(
                                item.status || "Pending"
                            )}

                        </span>

                    </div>

                </article>

            `;

        })
        .join("");

}


/* ==========================================
   CATEGORY FILTER
========================================== */

function setCategory(category, button){

    currentCategory = category;


    document
        .querySelectorAll(".category-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    filterNews();

}


/* ==========================================
   SEARCH + FILTER
========================================== */

function filterNews(){

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        allNews.filter(item => {

            const categoryMatch =
                currentCategory === "All" ||
                item.category === currentCategory;


            const searchText = (

                (item.title || "") +
                " " +
                (item.location || "") +
                " " +
                (item.excerpt || "") +
                " " +
                (item.content || "")

            ).toLowerCase();


            const searchMatch =
                !search ||
                searchText.includes(search);


            return categoryMatch &&
                   searchMatch;

        });


    renderNews(filtered);

}


/* ==========================================
   OPEN NEWS
========================================== */

function openNews(id){

    const item =
        allNews.find(
            news => news.id === id
        );


    if(!item) return;


    const modal =
        document.getElementById("newsModal");


    const modalImage =
        document.getElementById("modalImage");


    if(item.image_url){

        modalImage.src =
            item.image_url;

        modalImage.style.display =
            "block";

    }

    else{

        modalImage.style.display =
            "none";

    }


    document.getElementById(
        "modalCategory"
    ).textContent =
        item.category || "";


    document.getElementById(
        "modalTitle"
    ).textContent =
        item.title || "";


    document.getElementById(
        "modalMeta"
    ).textContent =

        (
            item.location
            ? item.location + " • "
            : ""
        ) +

        formatDate(item.created_at);


    const status =
        document.getElementById(
            "modalStatus"
        );


    status.textContent =
        item.status || "Pending";


    status.className =
        "status " +
        (item.status || "Pending")
            .replace(/\s+/g,"-");


    document.getElementById(
        "modalText"
    ).textContent =
        item.content || "";


    const authorityBox =
        document.getElementById(
            "authorityBox"
        );


    if(item.authority_response){

        authorityBox.style.display =
            "block";


        document.getElementById(
            "authorityText"
        ).textContent =
            item.authority_response;

    }

    else{

        authorityBox.style.display =
            "none";

    }


    modal.classList.add("show");

    document.body.style.overflow =
        "hidden";

}


/* ==========================================
   CLOSE MODAL
========================================== */

function closeModal(){

    document
        .getElementById("newsModal")
        .classList.remove("show");

    document.body.style.overflow =
        "";

}


function closeOutside(event){

    if(
        event.target.id ===
        "newsModal"
    ){

        closeModal();

    }

}


document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeModal();

        }

    }
);


/* ==========================================
   BREAKING NEWS
========================================== */

function updateBreakingNews(){

    const element =
        document.getElementById(
            "breakingText"
        );


    if(!allNews.length){

        element.textContent =
            "No breaking news available.";

        return;

    }


    element.textContent =
        allNews
            .slice(0,5)
            .map(item => item.title)
            .join("  •  ");

}


/* ==========================================
   DATE
========================================== */

function formatDate(date){

    if(!date) return "";

    return new Date(date)
        .toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        );

}


/* ==========================================
   SECURITY HELPERS
========================================== */

function escapeHtml(value){

    if(value === null ||
       value === undefined){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHtml(value);

}


/* ==========================================
   REAL-TIME UPDATES
========================================== */

db.channel(
    "civilline-public-news"
)
.on(
    "postgres_changes",
    {
        event:"*",
        schema:"public",
        table:"news"
    },
    function(){

        loadNews();

    }
)
.subscribe();


/* ==========================================
   INITIAL LOAD
========================================== */

loadNews();

</script>

</body>
</html>
