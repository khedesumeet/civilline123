<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - CivilLine</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --dark:#111827;
  --accent:#f59e0b;
  --danger:#dc2626;
  --line:#e5e7eb;
  --ok:#16a34a;
  --blue:#2563eb;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--dark);
  color:#fff;
  position:sticky;
  top:0;
  z-index:10;
}

.bar{
  max-width:1250px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:var(--accent);
}

nav{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

nav a,
nav button{
  color:#fff;
  text-decoration:none;
  background:transparent;
  border:0;
  padding:9px 11px;
  border-radius:7px;
  cursor:pointer;
  font-weight:700;
}

nav a:hover,
nav button:hover{
  background:#374151;
}

.wrap{
  max-width:1250px;
  margin:24px auto;
  padding:0 16px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  box-shadow:0 5px 20px #0000000a;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:#fff;
  font-size:14px;
}

textarea{
  min-height:90px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:#111827;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
}

.btn.secondary{
  background:#e5e7eb;
}

.btn.danger{
  background:var(--danger);
  color:#fff;
}

.btn.success{
  background:var(--ok);
  color:#fff;
}

.btn.blue{
  background:var(--blue);
  color:#fff;
}

.btn.small{
  padding:7px 9px;
  font-size:12px;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.msg{
  padding:11px;
  border-radius:8px;
  margin-top:14px;
  display:none;
}

.successmsg{
  background:#dcfce7;
  color:#166534;
}

.errormsg{
  background:#fee2e2;
  color:#991b1b;
}

.table-scroll{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,
td{
  padding:10px 8px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:13px;
  vertical-align:top;
}

th{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
}

.muted{
  color:var(--muted);
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:450px;
  border-radius:14px;
  padding:24px;
  box-shadow:0 20px 60px #0005;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  border:0;
  background:#e5e7eb;
  border-radius:50%;
  width:32px;
  height:32px;
  cursor:pointer;
  font-size:18px;
}

.password-row{
  position:relative;
}

.password-row input{
  padding-right:80px;
}

.show-password{
  position:absolute;
  right:7px;
  top:7px;
  border:0;
  background:#e5e7eb;
  padding:7px 9px;
  border-radius:6px;
  cursor:pointer;
  font-weight:700;
  font-size:11px;
}

.warning{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  padding:11px;
  border-radius:8px;
  font-size:12px;
  line-height:1.5;
  margin-bottom:15px;
}

.status-badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  background:#e5e7eb;
}

.status-approved{
  background:#dcfce7;
  color:#166534;
}

.status-suspended{
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .bar{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
<div class="bar">

<div class="logo">
Civil<span>Line</span>
</div>

<nav>
<a href="index.html">Home</a>
<button id="logout">Logout</button>
</nav>

</div>
</header>


<div class="wrap">


<!-- CREATE CONTRACTOR -->

<div class="card">

<h1>Admin Dashboard</h1>

<p class="muted">
Only Admin can create and manage contractor accounts.
</p>

<form id="contractorForm">

<div class="grid">

<div>
<label>Contractor Email *</label>
<input id="email" type="email" required>
</div>

<div>
<label>Temporary Password *</label>
<input id="password" type="text" minlength="6" required>
</div>

<div>
<label>Company Name *</label>
<input id="company" required>
</div>

<div>
<label>Owner Name *</label>
<input id="owner" required>
</div>

<div>
<label>Mobile *</label>
<input id="mobile" required>
</div>

<div>
<label>WhatsApp</label>
<input id="whatsapp">
</div>

<div>
<label>City *</label>
<input id="city" required>
</div>

<div>
<label>Area</label>
<input id="area">
</div>

<div style="grid-column:1/-1">
<label>Address</label>
<textarea id="address"></textarea>
</div>

<div style="grid-column:1/-1">
<label>Services</label>
<input
id="services"
placeholder="RCC, Shuttering, Masonry"
>
</div>

</div>

<button
class="btn"
id="createButton"
style="margin-top:16px"
type="submit"
>
CREATE CONTRACTOR
</button>

</form>

<div id="msg" class="msg"></div>

</div>


<!-- CONTRACTOR LIST -->

<div class="card">

<h2>Contractors</h2>

<div class="grid">

<input
id="search"
placeholder="Search contractor..."
>

<select id="filter">

<option value="">All statuses</option>
<option value="pending">Pending</option>
<option value="approved">Approved</option>
<option value="suspended">Suspended</option>
<option value="rejected">Rejected</option>

</select>

</div>

<br>

<div class="table-scroll">

<table>

<thead>
<tr>
<th>Company</th>
<th>Owner</th>
<th>Email</th>
<th>Mobile</th>
<th>City</th>
<th>Status</th>
<th>Featured</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

</div>

</div>


<!-- RESET PASSWORD MODAL -->

<div id="passwordModal" class="modal">

<div class="modal-box">

<div class="modal-header">

<h2>Reset Password</h2>

<button
class="close"
id="closeModal"
type="button"
>
×
</button>

</div>

<div class="warning">

The old password cannot be retrieved.

Admin can set a new password for this contractor.

</div>

<p>
<strong id="resetCompany">Contractor</strong>
<br>
<span id="resetEmail" class="muted"></span>
</p>

<label>New Password *</label>

<div class="password-row">

<input
id="newPassword"
type="password"
minlength="6"
placeholder="Minimum 6 characters"
>

<button
type="button"
class="show-password"
id="showPassword"
>
SHOW
</button>

</div>

<div id="resetMsg" class="msg"></div>

<div
class="actions"
style="margin-top:18px"
>

<button
class="btn secondary"
id="cancelReset"
type="button"
>
Cancel
</button>

<button
class="btn blue"
id="resetButton"
type="button"
>
SET NEW PASSWORD
</button>

</div>

</div>
</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://aoicywtjwvqzzhmxkxvs.supabase.co";

/*
 IMPORTANT:
 Put your CURRENT Supabase Publishable key here.
 Do NOT use the service-role/secret key.
*/

const SUPABASE_KEY =
"YOUR_CURRENT_PUBLISHABLE_KEY";


const RESET_FUNCTION_URL =
"https://aoicywtjwvqzzhmxkxvs.supabase.co/functions/v1/reset-contractor-password";


const CREATE_FUNCTION_URL =
"https://aoicywtjwvqzzhmxkxvs.supabase.co/functions/v1/create-contractor";


const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let me = null;
let contractors = [];
let selectedContractor = null;


/* =====================================================
   ELEMENTS
===================================================== */

const contractorForm =
document.getElementById("contractorForm");

const createButton =
document.getElementById("createButton");

const rows =
document.getElementById("rows");

const search =
document.getElementById("search");

const filter =
document.getElementById("filter");

const msg =
document.getElementById("msg");

const logout =
document.getElementById("logout");

const passwordModal =
document.getElementById("passwordModal");

const newPassword =
document.getElementById("newPassword");

const resetButton =
document.getElementById("resetButton");

const resetMsg =
document.getElementById("resetMsg");


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(c){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c];

});

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

msg.textContent = text;

msg.className =
"msg " +
(type === "error"
 ? "errormsg"
 : "successmsg");

msg.style.display = "block";

setTimeout(function(){

msg.style.display = "none";

},5000);

}


function showResetMessage(text,type){

resetMsg.textContent = text;

resetMsg.className =
"msg " +
(type === "error"
 ? "errormsg"
 : "successmsg");

resetMsg.style.display = "block";

}


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

try{

const result =
await sb.auth.getUser();

if(result.error){

throw result.error;

}

if(!result.data.user){

location.href =
"admin-login.html";

return false;

}

me =
result.data.user;


const profile =
await sb

.from("profiles")

.select("role")

.eq("id",me.id)

.single();


if(profile.error){

throw profile.error;

}


if(profile.data?.role !== "admin"){

await sb.auth.signOut();

location.href =
"admin-login.html";

return false;

}

return true;

}

catch(error){

console.error(error);

showMessage(
error.message,
"error"
);

return false;

}

}


/* =====================================================
   INITIALIZE
===================================================== */

(async function(){

const ok =
await checkAdmin();

if(ok){

await loadContractors();

}

})();


/* =====================================================
   LOAD CONTRACTORS
===================================================== */

async function loadContractors(){

const result =
await sb

.from("profiles")

.select("*")

.eq("role","contractor")

.order(
"created_at",
{
ascending:false
}
);


if(result.error){

showMessage(
result.error.message,
"error"
);

return;

}


contractors =
result.data || [];

renderContractors();

}


/* =====================================================
   RENDER CONTRACTORS
===================================================== */

function renderContractors(){

const query =
search.value.trim().toLowerCase();

const status =
filter.value;


const list =
contractors.filter(function(x){

const searchText = [

x.company_name,
x.owner_name,
x.email,
x.mobile,
x.city,
x.area

].join(" ").toLowerCase();


const matchesSearch =
!query ||
searchText.includes(query);


const matchesStatus =
!status ||
x.status === status;


return matchesSearch &&
matchesStatus;

});


if(!list.length){

rows.innerHTML = `
<tr>
<td colspan="8" style="text-align:center;padding:25px">
No contractors found.
</td>
</tr>
`;

return;

}


rows.innerHTML =
list.map(function(x){

let statusClass = "";

if(x.status === "approved")
statusClass = "status-approved";

if(x.status === "suspended")
statusClass = "status-suspended";


return `

<tr>

<td>
<b>${esc(x.company_name)}</b>
</td>

<td>
${esc(x.owner_name)}
</td>

<td>
${esc(x.email)}
</td>

<td>
${esc(x.mobile)}
</td>

<td>
${esc(x.city)}
</td>

<td>
<span class="status-badge ${statusClass}">
${esc(x.status)}
</span>
</td>

<td>
${x.is_featured ? "Yes" : "No"}
</td>

<td>

<div class="actions">

<button
class="btn small success"
onclick="changeStatus('${x.id}','approved')"
>
Approve
</button>

<button
class="btn small secondary"
onclick="changeStatus('${x.id}','suspended')"
>
Suspend
</button>

<button
class="btn small"
onclick="toggleFeatured('${x.id}')"
>
${x.is_featured ? "Unfeature" : "Feature"}
</button>

<button
class="btn small blue"
onclick="openPasswordModal('${x.id}')"
>
Reset Password
</button>

<button
class="btn small danger"
onclick="deleteProfile('${x.id}')"
>
Delete
</button>

</div>

</td>

</tr>

`;

}).join("");

}


search.addEventListener(
"input",
renderContractors
);

filter.addEventListener(
"change",
renderContractors
);


/* =====================================================
   CREATE CONTRACTOR
===================================================== */

contractorForm.addEventListener(
"submit",
async function(e){

e.preventDefault();

createButton.disabled = true;

createButton.textContent =
"CREATING...";

try{

const mobileValue =
document.getElementById("mobile")
.value.trim();


if(!/^\d{10}$/.test(mobileValue)){

throw new Error(
"Mobile must contain exactly 10 digits."
);

}


const sessionResult =
await sb.auth.getSession();


const session =
sessionResult.data.session;


if(!session){

throw new Error(
"Admin session expired. Please login again."
);

}


const response =
await fetch(
CREATE_FUNCTION_URL,
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
session.access_token

},

body:JSON.stringify({

email:
document.getElementById("email")
.value.trim(),

password:
document.getElementById("password")
.value,

company_name:
document.getElementById("company")
.value.trim(),

owner_name:
document.getElementById("owner")
.value.trim(),

mobile:
mobileValue,

whatsapp:
document.getElementById("whatsapp")
.value.trim(),

city:
document.getElementById("city")
.value.trim(),

area:
document.getElementById("area")
.value.trim(),

address:
document.getElementById("address")
.value.trim(),

services:
document.getElementById("services")
.value
.split(",")
.map(x=>x.trim())
.filter(Boolean)

})

});


const text =
await response.text();

let result;

try{
result = JSON.parse(text);
}
catch{
throw new Error(text);
}


if(!response.ok){

throw new Error(
result.error ||
"Could not create contractor."
);

}


showMessage(
"Contractor created successfully.",
"success"
);


contractorForm.reset();

await loadContractors();

}

catch(error){

console.error(error);

showMessage(
error.message,
"error"
);

}

finally{

createButton.disabled = false;

createButton.textContent =
"CREATE CONTRACTOR";

}

});


/* =====================================================
   CHANGE STATUS
===================================================== */

async function changeStatus(id,status){

const result =
await sb

.from("profiles")

.update({
status:status
})

.eq("id",id);


if(result.error){

showMessage(
result.error.message,
"error"
);

return;

}

await loadContractors();

}


/* =====================================================
   FEATURE
===================================================== */

async function toggleFeatured(id){

const contractor =
contractors.find(
x=>x.id === id
);

if(!contractor)
return;


const result =
await sb

.from("profiles")

.update({

is_featured:
!contractor.is_featured

})

.eq("id",id);


if(result.error){

showMessage(
result.error.message,
"error"
);

return;

}

await loadContractors();

}


/* =====================================================
   DELETE PROFILE
===================================================== */

async function deleteProfile(id){

const contractor =
contractors.find(
x=>x.id === id
);


if(!contractor)
return;


const yes =
confirm(
"Delete this contractor profile?\n\n" +
"Note: this deletes the profile record only. " +
"The Auth account will remain."
);


if(!yes)
return;


const result =
await sb

.from("profiles")

.delete()

.eq("id",id);


if(result.error){

showMessage(
result.error.message,
"error"
);

return;

}

showMessage(
"Contractor profile deleted.",
"success"
);

await loadContractors();

}


/* =====================================================
   OPEN PASSWORD MODAL
===================================================== */

function openPasswordModal(id){

const contractor =
contractors.find(
x=>x.id === id
);


if(!contractor){

showMessage(
"Contractor not found.",
"error"
);

return;

}


selectedContractor =
contractor;


document.getElementById(
"resetCompany"
).textContent =
contractor.company_name ||
contractor.owner_name ||
"Contractor";


document.getElementById(
"resetEmail"
).textContent =
contractor.email || "";


newPassword.value = "";

resetMsg.style.display = "none";

passwordModal.classList.add("show");

setTimeout(function(){

newPassword.focus();

},100);

}


/* =====================================================
   CLOSE PASSWORD MODAL
===================================================== */

function closePasswordModal(){

passwordModal.classList.remove(
"show"
);

selectedContractor = null;

newPassword.value = "";

}


/* =====================================================
   SHOW/HIDE PASSWORD
===================================================== */

document.getElementById(
"showPassword"
).addEventListener(
"click",
function(){

if(newPassword.type === "password"){

newPassword.type = "text";

this.textContent = "HIDE";

}else{

newPassword.type = "password";

this.textContent = "SHOW";

}

});


document.getElementById(
"closeModal"
).addEventListener(
"click",
closePasswordModal
);


document.getElementById(
"cancelReset"
).addEventListener(
"click",
closePasswordModal
);


passwordModal.addEventListener(
"click",
function(e){

if(e.target === passwordModal){

closePasswordModal();

}

});


/* =====================================================
   RESET CONTRACTOR PASSWORD
===================================================== */

resetButton.addEventListener(
"click",
async function(){

if(!selectedContractor){

return;

}


const password =
newPassword.value;


if(password.length < 6){

showResetMessage(
"Password must contain at least 6 characters.",
"error"
);

return;

}


resetButton.disabled = true;

resetButton.textContent =
"RESETTING...";


try{

const sessionResult =
await sb.auth.getSession();


const session =
sessionResult.data.session;


if(!session){

throw new Error(
"Admin session expired. Please login again."
);

}


const response =
await fetch(
RESET_FUNCTION_URL,
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
session.access_token

},

body:JSON.stringify({

user_id:
selectedContractor.id,

password:
password

})

});


const text =
await response.text();


let result;

try{

result =
JSON.parse(text);

}catch{

throw new Error(
text ||
"Invalid server response."
);

}


if(!response.ok){

throw new Error(
result.error ||
"Password reset failed."
);

}


showResetMessage(
"Password changed successfully.",
"success"
);


newPassword.value = "";


setTimeout(function(){

closePasswordModal();

},1200);


}

catch(error){

console.error(error);

showResetMessage(
error.message,
"error"
);

}

finally{

resetButton.disabled = false;

resetButton.textContent =
"SET NEW PASSWORD";

}

});


/* =====================================================
   LOGOUT
===================================================== */

logout.addEventListener(
"click",
async function(){

await sb.auth.signOut();

location.href =
"admin-login.html";

});

</script>

</body>
</html>
