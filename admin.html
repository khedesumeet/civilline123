<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | CivilLine</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><header><div class="bar"><div class="logo">Civil<span>Line</span></div><nav><a href="index.html">Home</a><button onclick="logout()">Logout</button></nav></div></header><main class="wrap"><div class="card"><div class="kicker">Administration</div><h1>Contractor Management</h1><p class="subtitle">Create and control contractor Login IDs. Only Admin can create accounts.</p><form id="cf"><div class="grid3"><div><label>Contractor Login ID / Email *</label><input id="email" type="email" required></div><div><label>Temporary Password *</label><input id="password" minlength="6" required></div><div><label>Company Name *</label><input id="company" required></div><div><label>Owner Name *</label><input id="owner" required></div><div><label>Mobile *</label><input id="mobile" required></div><div><label>WhatsApp</label><input id="whatsapp"></div><div><label>City *</label><input id="city" required></div><div><label>Area</label><input id="area"></div><div><label>Services</label><input id="services" placeholder="RCC, Shuttering, Masonry"></div><div class="full"><label>Address</label><textarea id="address"></textarea></div></div><button class="btn" style="margin-top:16px" id="create">CREATE CONTRACTOR LOGIN</button></form><div id="msg" class="msg"></div></div><div class="card"><div class="toolbar"><h2>Contractors</h2><div class="actions"><input id="search" placeholder="Search" style="width:220px"><select id="filter"><option value="">All</option><option>pending</option><option>approved</option><option>suspended</option><option>rejected</option></select></div></div><div class="table-scroll"><table><thead><tr><th>Company</th><th>Owner</th><th>Login ID</th><th>Mobile</th><th>City</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>let data=[];(async()=>{const a=await auth('admin');if(a)load()})();cf.onsubmit=async e=>{e.preventDefault();create.disabled=true;try{if(!/^\d{10}$/.test(mobile.value.trim()))throw Error('Mobile must be 10 digits.');const s=await sb.auth.getSession();const r=await fetch(SB_URL+'/functions/v1/create-contractor',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.data.session.access_token,'apikey':SB_KEY},body:JSON.stringify({email:email.value.trim(),password:password.value,company_name:company.value.trim(),owner_name:owner.value.trim(),mobile:mobile.value.trim(),whatsapp:whatsapp.value.trim(),city:city.value.trim(),area:area.value.trim(),address:address.value.trim(),services:services.value.split(',').map(x=>x.trim()).filter(Boolean)})});const j=await r.json();if(!r.ok)throw Error(j.error||'Could not create contractor.');msg('Contractor Login ID created successfully.');cf.reset();load()}catch(x){msg(x.message,false)}finally{create.disabled=false}};async function load(){const r=await sb.from('profiles').select('*').eq('role','contractor').order('created_at',{ascending:false});if(r.error)return msg(r.error.message,false);data=r.data||[];render()}function render(){const q=search.value.toLowerCase(),s=filter.value;rows.innerHTML=data.filter(x=>(!s||x.status===s)&&[x.company_name,x.owner_name,x.email,x.mobile,x.city].join(' ').toLowerCase().includes(q)).map(x=>`<tr><td><b>${esc(x.company_name)}</b></td><td>${esc(x.owner_name)}</td><td>${esc(x.email)}</td><td>${esc(x.mobile)}</td><td>${esc(x.city)}</td><td><span class="badge ${x.status==='approved'?'ok':x.status==='suspended'||x.status==='rejected'?'bad':'warn'}">${esc(x.status)}</span></td><td><div class="actions"><button class="btn small success" onclick="status('${x.id}','approved')">Approve</button><button class="btn small secondary" onclick="status('${x.id}','suspended')">Suspend</button><button class="btn small danger" onclick="del('${x.id}')">Delete Profile</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No contractors.</td></tr>'}search.oninput=render;filter.onchange=render;async function status(id,s){const r=await sb.from('profiles').update({status:s}).eq('id',id);if(r.error)return msg(r.error.message,false);load()}async function del(id){if(!confirm('Delete contractor profile? Auth account is not deleted by this button.'))return;const r=await sb.from('profiles').delete().eq('id',id);if(r.error)return msg(r.error.message,false);load()}</script></body></html>
