<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin | CivilLine</title>

  <link rel="stylesheet" href="common.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</head>

<body>

<header>
  <div class="bar">
    <div class="logo">Civil<span>Line</span></div>

    <nav>
      <a href="index.html">Home</a>
      <button type="button" id="logoutBtn">Logout</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- CREATE CONTRACTOR -->
  <section class="card">

    <div class="kicker">Administration</div>

    <h1>Contractor Management</h1>

    <p class="subtitle">
      Create and control contractor Login IDs. Only Admin can create accounts.
    </p>

    <form id="contractorForm">

      <div class="grid3">

        <div>
          <label for="email">Contractor Login ID / Email *</label>
          <input
            id="email"
            type="email"
            autocomplete="username"
            required
          >
        </div>

        <div>
          <label for="password">Temporary Password *</label>
          <input
            id="password"
            type="password"
            minlength="6"
            autocomplete="new-password"
            required
          >
        </div>

        <div>
          <label for="company">Company Name *</label>
          <input id="company" required>
        </div>

        <div>
          <label for="owner">Owner Name *</label>
          <input id="owner" required>
        </div>

        <div>
          <label for="mobile">Mobile *</label>
          <input
            id="mobile"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            required
          >
        </div>

        <div>
          <label for="whatsapp">WhatsApp</label>
          <input
            id="whatsapp"
            type="tel"
            inputmode="numeric"
            maxlength="10"
          >
        </div>

        <div>
          <label for="city">City *</label>
          <input id="city" required>
        </div>

        <div>
          <label for="area">Area</label>
          <input id="area">
        </div>

        <div>
          <label for="services">Services</label>
          <input
            id="services"
            placeholder="RCC, Shuttering, Masonry"
          >
        </div>

        <div class="full">
          <label for="address">Address</label>
          <textarea id="address"></textarea>
        </div>

      </div>

      <button
        class="btn"
        type="submit"
        id="createBtn"
        style="margin-top:16px"
      >
        CREATE CONTRACTOR LOGIN
      </button>

    </form>

    <div id="msg" class="msg"></div>

  </section>


  <!-- CONTRACTOR LIST -->
  <section class="card">

    <div class="toolbar">

      <h2>Contractors</h2>

      <div class="actions">

        <input
          id="search"
          placeholder="Search"
          style="width:220px"
          type="search"
        >

        <select id="filter">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="suspended">Suspended</option>
          <option value="rejected">Rejected</option>
        </select>

      </div>

    </div>


    <div class="table-scroll">

      <table>

        <thead>
          <tr>
            <th>Company</th>
            <th>Owner</th>
            <th>Login ID</th>
            <th>Mobile</th>
            <th>City</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="rows">
          <tr>
            <td colspan="7" class="empty">
              Loading contractors...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </section>

</main>


<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const contractorForm = document.getElementById("contractorForm");
const createBtn      = document.getElementById("createBtn");

const emailInput     = document.getElementById("email");
const passwordInput  = document.getElementById("password");
const companyInput   = document.getElementById("company");
const ownerInput     = document.getElementById("owner");
const mobileInput    = document.getElementById("mobile");
const whatsappInput  = document.getElementById("whatsapp");
const cityInput      = document.getElementById("city");
const areaInput      = document.getElementById("area");
const servicesInput  = document.getElementById("services");
const addressInput   = document.getElementById("address");

const searchInput    = document.getElementById("search");
const filterInput    = document.getElementById("filter");

const rowsElement    = document.getElementById("rows");
const msgElement     = document.getElementById("msg");

const logoutBtn      = document.getElementById("logoutBtn");


/* =========================================================
   DATA
========================================================= */

let contractors = [];


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(message, success = true) {

  msgElement.textContent = message;

  msgElement.style.display = "block";

  if (success) {
    msgElement.classList.remove("error");
    msgElement.classList.add("success");
  } else {
    msgElement.classList.remove("success");
    msgElement.classList.add("error");
  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   INITIALIZE
========================================================= */

(async function init() {

  try {

    /*
      auth("admin") must exist in app.js.

      It should verify that the current user is logged in
      and has role = admin.
    */

    const authenticated = await auth("admin");

    if (!authenticated) {
      return;
    }

    await loadContractors();

  } catch (error) {

    console.error(error);

    showMessage(
      error.message || "Unable to initialize admin page.",
      false
    );

  }

})();


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener("click", async function () {

  try {

    await logout();

  } catch (error) {

    console.error(error);

    showMessage(
      error.message || "Logout failed.",
      false
    );

  }

});


/* =========================================================
   CREATE CONTRACTOR
========================================================= */

contractorForm.addEventListener("submit", async function (event) {

  event.preventDefault();

  createBtn.disabled = true;
  createBtn.textContent = "CREATING...";

  try {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    const company = companyInput.value.trim();
    const owner = ownerInput.value.trim();

    const mobile = mobileInput.value.trim();
    const whatsapp = whatsappInput.value.trim();

    const city = cityInput.value.trim();
    const area = areaInput.value.trim();

    const address = addressInput.value.trim();

    const services = servicesInput.value
      .split(",")
      .map(function (item) {
        return item.trim();
      })
      .filter(Boolean);


    /* -----------------------------------------
       VALIDATION
    ----------------------------------------- */

    if (!email) {
      throw new Error("Email / Login ID is required.");
    }

    if (password.length < 6) {
      throw new Error(
        "Temporary password must be at least 6 characters."
      );
    }

    if (!/^\d{10}$/.test(mobile)) {
      throw new Error(
        "Mobile number must contain exactly 10 digits."
      );
    }

    if (
      whatsapp &&
      !/^\d{10}$/.test(whatsapp)
    ) {
      throw new Error(
        "WhatsApp number must contain exactly 10 digits."
      );
    }


    /* -----------------------------------------
       CURRENT SESSION
    ----------------------------------------- */

    const sessionResult = await sb.auth.getSession();

    if (sessionResult.error) {
      throw sessionResult.error;
    }

    const session = sessionResult.data.session;

    if (!session) {
      throw new Error(
        "Your login session has expired. Please login again."
      );
    }


    /* -----------------------------------------
       EDGE FUNCTION
    ----------------------------------------- */

    const response = await fetch(
      SB_URL + "/functions/v1/create-contractor",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",

          "Authorization":
            "Bearer " + session.access_token,

          "apikey": SB_KEY
        },

        body: JSON.stringify({

          email: email,

          password: password,

          company_name: company,

          owner_name: owner,

          mobile: mobile,

          whatsapp: whatsapp,

          city: city,

          area: area,

          address: address,

          services: services

        })

      }
    );


    /* -----------------------------------------
       RESPONSE
    ----------------------------------------- */

    let result = {};

    try {
      result = await response.json();
    } catch (jsonError) {
      result = {};
    }


    if (!response.ok) {

      throw new Error(
        result.error ||
        result.message ||
        "Could not create contractor."
      );

    }


    /* -----------------------------------------
       SUCCESS
    ----------------------------------------- */

    showMessage(
      "Contractor Login ID created successfully.",
      true
    );

    contractorForm.reset();

    await loadContractors();


  } catch (error) {

    console.error(
      "CREATE CONTRACTOR ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Could not create contractor.",
      false
    );

  } finally {

    createBtn.disabled = false;
    createBtn.textContent =
      "CREATE CONTRACTOR LOGIN";

  }

});


/* =========================================================
   LOAD CONTRACTORS
========================================================= */

async function loadContractors() {

  rowsElement.innerHTML = `
    <tr>
      <td colspan="7" class="empty">
        Loading contractors...
      </td>
    </tr>
  `;


  const result = await sb
    .from("profiles")
    .select("*")
    .eq("role", "contractor")
    .order("created_at", {
      ascending: false
    });


  if (result.error) {

    console.error(
      "LOAD CONTRACTORS ERROR:",
      result.error
    );

    showMessage(
      result.error.message,
      false
    );

    rowsElement.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Could not load contractors.
        </td>
      </tr>
    `;

    return;
  }


  contractors = result.data || [];

  renderContractors();

}


/* =========================================================
   RENDER
========================================================= */

function renderContractors() {

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  const status =
    filterInput.value;


  const filtered =
    contractors.filter(function (contractor) {

      const searchable = [

        contractor.company_name,
        contractor.owner_name,
        contractor.email,
        contractor.mobile,
        contractor.city,
        contractor.area

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      const matchesSearch =
        !query ||
        searchable.includes(query);


      const matchesStatus =
        !status ||
        contractor.status === status;


      return (
        matchesSearch &&
        matchesStatus
      );

    });


  if (!filtered.length) {

    rowsElement.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          No contractors found.
        </td>
      </tr>
    `;

    return;
  }


  rowsElement.innerHTML =
    filtered.map(function (contractor) {

      const id = esc(contractor.id);

      let badgeClass = "warn";

      if (contractor.status === "approved") {
        badgeClass = "ok";
      }

      if (
        contractor.status === "suspended" ||
        contractor.status === "rejected"
      ) {
        badgeClass = "bad";
      }


      return `
        <tr>

          <td>
            <b>
              ${esc(contractor.company_name)}
            </b>
          </td>

          <td>
            ${esc(contractor.owner_name)}
          </td>

          <td>
            ${esc(contractor.email)}
          </td>

          <td>
            ${esc(contractor.mobile)}
          </td>

          <td>
            ${esc(contractor.city)}
          </td>

          <td>
            <span class="badge ${badgeClass}">
              ${esc(contractor.status || "pending")}
            </span>
          </td>

          <td>

            <div class="actions">

              <button
                type="button"
                class="btn small success"
                data-action="approve"
                data-id="${id}"
              >
                Approve
              </button>

              <button
                type="button"
                class="btn small secondary"
                data-action="suspend"
                data-id="${id}"
              >
                Suspend
              </button>

              <button
                type="button"
                class="btn small danger"
                data-action="delete"
                data-id="${id}"
              >
                Delete Profile
              </button>

            </div>

          </td>

        </tr>
      `;

    })
    .join("");

}


/* =========================================================
   TABLE ACTIONS
========================================================= */

rowsElement.addEventListener(
  "click",
  async function (event) {

    const button =
      event.target.closest("button[data-action]");

    if (!button) {
      return;
    }


    const id =
      button.dataset.id;

    const action =
      button.dataset.action;


    if (!id) {
      return;
    }


    if (action === "approve") {

      await changeStatus(
        id,
        "approved"
      );

    }


    if (action === "suspend") {

      await changeStatus(
        id,
        "suspended"
      );

    }


    if (action === "delete") {

      await deleteContractor(id);

    }

  }
);


/* =========================================================
   CHANGE STATUS
========================================================= */

async function changeStatus(id, status) {

  try {

    const result = await sb
      .from("profiles")
      .update({
        status: status
      })
      .eq("id", id);


    if (result.error) {
      throw result.error;
    }


    showMessage(
      "Contractor status updated to " +
      status +
      ".",
      true
    );


    await loadContractors();


  } catch (error) {

    console.error(
      "STATUS UPDATE ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Could not update contractor status.",
      false
    );

  }

}


/* =========================================================
   DELETE PROFILE
========================================================= */

async function deleteContractor(id) {

  const confirmed =
    confirm(
      "Delete contractor profile?\n\n" +
      "IMPORTANT: This deletes only the profile. " +
      "The Supabase Auth account will remain unless " +
      "your Edge Function also deletes it."
    );


  if (!confirmed) {
    return;
  }


  try {

    const result = await sb
      .from("profiles")
      .delete()
      .eq("id", id);


    if (result.error) {
      throw result.error;
    }


    showMessage(
      "Contractor profile deleted.",
      true
    );


    await loadContractors();


  } catch (error) {

    console.error(
      "DELETE ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Could not delete contractor profile.",
      false
    );

  }

}


/* =========================================================
   SEARCH / FILTER
========================================================= */

searchInput.addEventListener(
  "input",
  renderContractors
);

filterInput.addEventListener(
  "change",
  renderContractors
);

</script>

</body>
</html>
