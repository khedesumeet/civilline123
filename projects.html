<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CivilLine - Projects</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#172033;
}

header{
    background:#111827;
    color:white;
}

.nav{
    max-width:1100px;
    margin:auto;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#f59e0b;
}

nav a,nav button{
    color:white;
    text-decoration:none;
    border:0;
    background:none;
    padding:9px 12px;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:7px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#f59e0b;
}

.secondary{
    background:#e5e7eb;
}

.danger{
    background:#dc2626;
    color:white;
}

.message{
    display:none;
    padding:12px;
    border-radius:7px;
    margin-top:15px;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px 8px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

@media(max-width:650px){
    .grid{
        grid-template-columns:1fr;
    }

    table{
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
Civil<span>Line</span>
</div>

<nav>
<a href="dashboard.html">Dashboard</a>
<a href="expenses.html">Expenses</a>
<a href="client-bills.html">Client Bills</a>
<button onclick="logout()">Logout</button>
</nav>

</div>
</header>


<div class="container">

<div class="card">

<h1 id="pageTitle">Add Project</h1>

<form id="projectForm">

<div class="grid">

<div>
<label>Project Name *</label>
<input
    type="text"
    id="projectName"
    placeholder="Example: ABC Building"
    required>
</div>

<div>
<label>Client Name</label>
<input
    type="text"
    id="clientName"
    placeholder="Client name">
</div>

<div>
<label>Location</label>
<input
    type="text"
    id="projectLocation"
    placeholder="Project location">
</div>

<div>
<label>Contract Amount</label>
<input
    type="number"
    id="contractAmount"
    min="0"
    step="0.01"
    value="0">
</div>

<div>
<label>Start Date</label>
<input
    type="date"
    id="startDate">
</div>

<div>
<label>End Date</label>
<input
    type="date"
    id="endDate">
</div>

</div>

<br>

<button
    type="submit"
    class="primary"
    id="saveButton">
    Add Project
</button>

<button
    type="button"
    class="secondary"
    id="cancelButton"
    style="display:none">
    Cancel
</button>

</form>

<div id="message" class="message"></div>

</div>


<div class="card">

<h2>Your Projects</h2>

<div style="overflow:auto">

<table>

<thead>

<tr>
<th>Project</th>
<th>Client</th>
<th>Location</th>
<th>Contract</th>
<th>Start</th>
<th>End</th>
<th>Action</th>
</tr>

</thead>

<tbody id="projectRows">

<tr>
<td colspan="7">Loading...</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://aoicywtjwvqzzhmxkxvs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;
let editingProjectId = null;


/* =========================
   START
========================= */

window.addEventListener("DOMContentLoaded", async function(){

    try{

        showMessage(
            "Checking login...",
            "success"
        );

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();

        if(error){

            throw error;

        }

        if(!data.user){

            window.location.href =
                "contractor-login.html";

            return;

        }

        currentUser = data.user;


        /* Check profile */

        const {
            data:profile,
            error:profileError
        } = await supabaseClient
            .from("profiles")
            .select("role,status")
            .eq("id",currentUser.id)
            .single();


        if(profileError){

            throw profileError;

        }


        if(profile.role !== "contractor"){

            showMessage(
                "This account is not a contractor account.",
                "error"
            );

            return;

        }


        if(profile.status !== "approved"){

            showMessage(
                "Your contractor account is not approved.",
                "error"
            );

            return;

        }


        hideMessage();

        await loadProjects();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Login/database error: " +
            (error.message || error),
            "error"
        );

    }

});


/* =========================
   ADD / EDIT
========================= */

document
.getElementById("projectForm")
.addEventListener("submit", async function(event){

    event.preventDefault();

    console.log("Project form submitted");


    if(!currentUser){

        showMessage(
            "You are not logged in.",
            "error"
        );

        return;

    }


    const name =
        document.getElementById("projectName")
        .value.trim();


    if(!name){

        showMessage(
            "Project name is required.",
            "error"
        );

        return;

    }


    const data = {

        user_id: currentUser.id,

        name: name,

        client_name:
            document.getElementById("clientName")
            .value.trim() || null,

        location:
            document.getElementById("projectLocation")
            .value.trim() || null,

        contract_amount:
            Number(
                document.getElementById("contractAmount")
                .value || 0
            ),

        start_date:
            document.getElementById("startDate")
            .value || null,

        end_date:
            document.getElementById("endDate")
            .value || null

    };


    console.log("Project data:",data);


    const button =
        document.getElementById("saveButton");

    button.disabled = true;


    try{

        let result;


        if(editingProjectId){

            result =
                await supabaseClient
                .from("projects")
                .update(data)
                .eq("id",editingProjectId)
                .eq("user_id",currentUser.id);

        }
        else{

            result =
                await supabaseClient
                .from("projects")
                .insert(data);

        }


        console.log("Supabase result:",result);


        if(result.error){

            throw result.error;

        }


        showMessage(
            editingProjectId
                ? "Project updated successfully."
                : "Project added successfully.",
            "success"
        );


        resetForm();

        await loadProjects();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Unable to save project: " +
            (error.message || error),
            "error"
        );

    }
    finally{

        button.disabled = false;

    }

});


/* =========================
   LOAD PROJECTS
========================= */

async function loadProjects(){

    const rows =
        document.getElementById("projectRows");


    rows.innerHTML =
        "<tr><td colspan='7'>Loading...</td></tr>";


    try{

        const {
            data,
            error
        } = await supabaseClient
            .from("projects")
            .select("*")
            .eq("user_id",currentUser.id)
            .order("created_at",{
                ascending:false
            });


        if(error){

            throw error;

        }


        if(!data || data.length === 0){

            rows.innerHTML =
                "<tr><td colspan='7'>No projects found.</td></tr>";

            return;

        }


        rows.innerHTML = "";


        data.forEach(project => {

            const tr =
                document.createElement("tr");


            tr.innerHTML = `

                <td>
                    <b>${escapeHtml(project.name)}</b>
                </td>

                <td>
                    ${escapeHtml(project.client_name || "-")}
                </td>

                <td>
                    ${escapeHtml(project.location || "-")}
                </td>

                <td>
                    ₹${Number(
                        project.contract_amount || 0
                    ).toLocaleString("en-IN")}
                </td>

                <td>
                    ${project.start_date || "-"}
                </td>

                <td>
                    ${project.end_date || "-"}
                </td>

                <td>

                    <button
                        class="secondary"
                        onclick="editProject('${project.id}')">
                        Edit
                    </button>

                    <button
                        class="danger"
                        onclick="deleteProject('${project.id}')">
                        Delete
                    </button>

                </td>

            `;


            rows.appendChild(tr);

        });

    }
    catch(error){

        console.error(error);

        rows.innerHTML =
            "<tr><td colspan='7'>Unable to load projects.</td></tr>";

        showMessage(
            "Unable to load projects: " +
            (error.message || error),
            "error"
        );

    }

}


/* =========================
   EDIT
========================= */

async function editProject(id){

    try{

        const {
            data,
            error
        } = await supabaseClient
            .from("projects")
            .select("*")
            .eq("id",id)
            .eq("user_id",currentUser.id)
            .single();


        if(error){

            throw error;

        }


        editingProjectId = id;


        document.getElementById("projectName")
            .value = data.name || "";

        document.getElementById("clientName")
            .value = data.client_name || "";

        document.getElementById("projectLocation")
            .value = data.location || "";

        document.getElementById("contractAmount")
            .value = data.contract_amount || 0;

        document.getElementById("startDate")
            .value = data.start_date || "";

        document.getElementById("endDate")
            .value = data.end_date || "";


        document.getElementById("pageTitle")
            .textContent = "Edit Project";

        document.getElementById("saveButton")
            .textContent = "Save Changes";

        document.getElementById("cancelButton")
            .style.display = "inline-block";


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
    catch(error){

        showMessage(
            "Unable to edit project: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   DELETE
========================= */

async function deleteProject(id){

    if(!confirm(
        "Are you sure you want to delete this project?"
    )){

        return;

    }


    try{

        const {
            error
        } = await supabaseClient
            .from("projects")
            .delete()
            .eq("id",id)
            .eq("user_id",currentUser.id);


        if(error){

            throw error;

        }


        showMessage(
            "Project deleted successfully.",
            "success"
        );


        await loadProjects();

    }
    catch(error){

        showMessage(
            "Unable to delete project: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   RESET
========================= */

document
.getElementById("cancelButton")
.addEventListener("click",resetForm);


function resetForm(){

    editingProjectId = null;

    document.getElementById("projectForm")
        .reset();

    document.getElementById("pageTitle")
        .textContent = "Add Project";

    document.getElementById("saveButton")
        .textContent = "Add Project";

    document.getElementById("cancelButton")
        .style.display = "none";

}


/* =========================
   LOGOUT
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "contractor-login.html";

}


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

}


function hideMessage(){

    const box =
        document.getElementById("message");

    box.style.display = "none";

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
