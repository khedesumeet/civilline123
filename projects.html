<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects | CivilLine</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><header><div class="bar"><div class="logo">Civil<span>Line</span></div><nav><a href="dashboard.html">Dashboard</a><a href="expenses.html">Expenses</a><a href="client-bills.html">Client Bills</a><a href="statements.html">Statements</a><button onclick="logout()">Logout</button></nav></div></header><main class="wrap"><div class="card"><h1>Projects</h1><p class="subtitle">Manage projects, clients, contract value and dates.</p><form id="form"><div class="grid"><div><label>Project Name *</label><input id="name" required></div><div><label>Client Name</label><input id="client"></div><div><label>Location</label><input id="location"></div><div><label>Contract Amount</label><input id="contract" type="number" min="0" step=".01"></div><div><label>Start Date</label><input id="start" type="date"></div><div><label>End Date</label><input id="end" type="date"></div></div><div class="actions" style="margin-top:16px"><button class="btn" id="save">Add Project</button><button type="button" class="btn secondary" id="cancel" style="display:none">Cancel</button></div></form><div id="msg" class="msg"></div></div><div class="card"><div class="toolbar"><h2>Project Register</h2><input id="search" placeholder="Search project/client" style="max-width:280px"></div><div class="table-scroll"><table><thead><tr><th>Project</th><th>Client</th><th>Location</th><th>Contract</th><th>Dates</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>let uid,edit=null,all=[];(async()=>{const a=await auth();if(!a)return;uid=a.user.id;load()})();form.onsubmit=async e=>{e.preventDefault();const d={user_id:uid,name:name.value.trim(),client_name:client.value.trim()||null,location:location.value.trim()||null,contract_amount:Number(contract.value||0),start_date:start.value||null,end_date:end.value||null};const r=edit?await sb.from('projects').update(d).eq('id',edit).eq('user_id',uid):await sb.from('projects').insert(d);if(r.error)return msg(r.error.message,false);msg(edit?'Project updated.':'Project added.');reset();load()};async function load(){const r=await sb.from('projects').select('*').eq('user_id',uid).order('created_at',{ascending:false});if(r.error)return msg(r.error.message,false);all=r.data||[];render()}function render(){const q=search.value.toLowerCase();rows.innerHTML=all.filter(x=>(x.name+' '+(x.client_name||'')).toLowerCase().includes(q)).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.client_name||'-')}</td><td>${esc(x.location||'-')}</td><td>${money(x.contract_amount)}</td><td>${x.start_date||'-'} → ${x.end_date||'-'}</td><td><button class="btn small secondary" onclick="ed('${x.id}')">Edit</button> <button class="btn small danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No projects.</td></tr>'}search.oninput=render;async function ed(id){const x=all.find(v=>v.id===id);edit=id;name.value=x.name||'';client.value=x.client_name||'';location.value=x.location||'';contract.value=x.contract_amount||0;start.value=x.start_date||'';end.value=x.end_date||'';save.textContent='Save Changes';cancel.style.display='inline-flex'}async function del(id){if(!confirm('Delete project?'))return;const r=await sb.from('projects').delete().eq('id',id).eq('user_id',uid);if(r.error)return msg(r.error.message,false);load()}function reset(){edit=null;form.reset();save.textContent='Add Project';cancel.style.display='none'}cancel.onclick=reset;</script></body></html>
