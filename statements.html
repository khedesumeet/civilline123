<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statements | CivilLine</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><header><div class="bar"><div class="logo">Civil<span>Line</span></div><nav><a href="dashboard.html">Dashboard</a><a href="projects.html">Projects</a><a href="expenses.html">Expenses</a><a href="client-bills.html">Client Bills</a><a href="statements.html">Statements</a><button onclick="logout()">Logout</button></nav></div></header><main class="wrap"><div class="card"><h1>Statements & Ledgers</h1><p class="subtitle">Client receivable ledger, labour contractor payable ledger and expense summary.</p><div class="grid3"><div><label>Statement Type</label><select id="type"><option value="client">Client Statement</option><option value="labour">Labour Contractor Statement</option><option value="expense">Expense Summary</option></select></div><div><label>Project</label><select id="project"><option value="">All Projects</option></select></div><div><label>Search Name</label><input id="search" placeholder="Client / contractor / vendor"></div></div></div><div id="clientBox" class="card"><h2>Client Ledger</h2><form id="cf"><div class="grid3"><div><label>Client Name *</label><input id="clientName" required></div><div><label>Date</label><input id="cdate" type="date" required></div><div><label>Project</label><select id="cproject"></select></div><div><label>Entry Type</label><select id="ctype"><option value="bill">Bill / Debit</option><option value="payment">Payment / Credit</option><option value="adjustment">Adjustment</option></select></div><div><label>Reference No.</label><input id="cref"></div><div><label>Amount *</label><input id="camount" type="number" min="0" step=".01" required></div><div class="full"><label>Description</label><input id="cdesc"></div></div><div class="actions" style="margin-top:14px"><button class="btn">Add Client Entry</button></div></form></div><div id="labourBox" class="card" style="display:none"><h2>Labour Contractor Ledger</h2><form id="lf"><div class="grid3"><div><label>Contractor Name *</label><input id="labName" required></div><div><label>Mobile</label><input id="labMobile"></div><div><label>Work Type</label><input id="labWork"></div><div><label>Date</label><input id="ldate" type="date" required></div><div><label>Project</label><select id="lproject"></select></div><div><label>Entry Type</label><select id="ltype"><option value="bill">Labour Bill / Payable</option><option value="payment">Payment</option><option value="adjustment">Adjustment</option></select></div><div><label>Reference No.</label><input id="lref"></div><div><label>Amount *</label><input id="lamount" type="number" min="0" step=".01" required></div><div><label>Description</label><input id="ldesc"></div></div><div class="actions" style="margin-top:14px"><button class="btn">Add Labour Entry</button></div></form></div><div id="tableBox" class="card"><div class="toolbar"><h2 id="tableTitle">Client Statement</h2><button class="btn secondary" onclick="window.print()">Print Statement</button></div><div class="table-scroll"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div></div></main><script>let uid,projects=[];(async()=>{const a=await auth();if(!a)return;uid=a.user.id;cdate.value=ldate.value=new Date().toISOString().slice(0,10);const r=await sb.from('projects').select('id,name').eq('user_id',uid).order('name');projects=r.data||[];project.innerHTML='<option value="">All Projects</option>'+projects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const opts='<option value="">No project</option>'+projects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');cproject.innerHTML=opts;lproject.innerHTML=opts;load()})();type.onchange=()=>{clientBox.style.display=type.value==='client'?'block':'none';labourBox.style.display=type.value==='labour'?'block':'none';load()};project.onchange=load;search.oninput=load;cf.onsubmit=async e=>{e.preventDefault();const debit=ctype.value==='bill'?Number(camount.value):ctype.value==='adjustment'?Number(camount.value):0,credit=ctype.value==='payment'?Number(camount.value):ctype.value==='adjustment'?0:0;const r=await sb.from('client_ledger').insert({user_id:uid,client_name:clientName.value.trim(),date:cdate.value,project_id:cproject.value||null,entry_type:ctype.value,reference_no:cref.value.trim()||null,description:cdesc.value.trim()||null,debit,credit});if(r.error)return msg(r.error.message,false);msg('Client ledger entry added.');cf.reset();cdate.value=new Date().toISOString().slice(0,10);load()};lf.onsubmit=async e=>{e.preventDefault();let contractorId=null;const q=await sb.from('labour_contractors').select('id').eq('user_id',uid).ilike('name',labName.value.trim()).limit(1);if(q.data?.[0])contractorId=q.data[0].id;else{const n=await sb.from('labour_contractors').insert({user_id:uid,name:labName.value.trim(),mobile:labMobile.value.trim()||null,work_type:labWork.value.trim()||null}).select('id').single();if(n.error)return msg(n.error.message,false);contractorId=n.data.id}const debit=ltype.value==='bill'?Number(lamount.value):ltype.value==='adjustment'?Number(lamount.value):0,credit=ltype.value==='payment'?Number(lamount.value):0;const r=await sb.from('labour_ledger').insert({user_id:uid,contractor_id:contractorId,contractor_name:labName.value.trim(),date:ldate.value,project_id:lproject.value||null,entry_type:ltype.value,reference_no:lref.value.trim()||null,description:ldesc.value.trim()||null,debit,credit});if(r.error)return msg(r.error.message,false);msg('Labour ledger entry added.');lf.reset();ldate.value=new Date().toISOString().slice(0,10);load()};async function load(){if(!uid)return;if(type.value==='client')return loadClient();if(type.value==='labour')return loadLabour();return loadExpense()}async function loadClient(){tableTitle.textContent='Client Statement';thead.innerHTML='<tr><th>Date</th><th>Client</th><th>Project</th><th>Type</th><th>Reference</th><th>Debit</th><th>Credit</th><th>Balance</th></tr>';let q=sb.from('client_ledger').select('*,projects(name)').eq('user_id',uid).order('date').order('created_at');if(project.value)q=q.eq('project_id',project.value);const r=await q;if(r.error)return msg(r.error.message,false);let bal=0;rows.innerHTML=(r.data||[]).filter(x=>(x.client_name||'').toLowerCase().includes(search.value.toLowerCase())).map(x=>{bal+=Number(x.debit)-Number(x.credit);return `<tr><td>${x.date}</td><td>${esc(x.client_name)}</td><td>${esc(x.projects?.name||'-')}</td><td>${esc(x.entry_type)}</td><td>${esc(x.reference_no||'-')}</td><td>${money(x.debit)}</td><td>${money(x.credit)}</td><td><b>${money(bal)}</b></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">No client entries.</td></tr>'}async function loadLabour(){tableTitle.textContent='Labour Contractor Statement';thead.innerHTML='<tr><th>Date</th><th>Contractor</th><th>Project</th><th>Type</th><th>Reference</th><th>Payable</th><th>Payment</th><th>Balance</th></tr>';let q=sb.from('labour_ledger').select('*,projects(name)').eq('user_id',uid).order('date').order('created_at');if(project.value)q=q.eq('project_id',project.value);const r=await q;if(r.error)return msg(r.error.message,false);let bal=0;rows.innerHTML=(r.data||[]).filter(x=>(x.contractor_name||'').toLowerCase().includes(search.value.toLowerCase())).map(x=>{bal+=Number(x.debit)-Number(x.credit);return `<tr><td>${x.date}</td><td>${esc(x.contractor_name)}</td><td>${esc(x.projects?.name||'-')}</td><td>${esc(x.entry_type)}</td><td>${esc(x.reference_no||'-')}</td><td>${money(x.debit)}</td><td>${money(x.credit)}</td><td><b>${money(bal)}</b></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">No labour entries.</td></tr>'}async function loadExpense(){tableTitle.textContent='Expense Summary';thead.innerHTML='<tr><th>Date</th><th>Project</th><th>Vendor</th><th>Category</th><th>Amount</th><th>GST</th><th>Total</th></tr>';let q=sb.from('expenses').select('*,projects(name)').eq('user_id',uid).order('date');if(project.value)q=q.eq('project_id',project.value);const r=await q;if(r.error)return msg(r.error.message,false);rows.innerHTML=(r.data||[]).filter(x=>((x.vendor||'')+' '+(x.category||'')).toLowerCase().includes(search.value.toLowerCase())).map(x=>`<tr><td>${x.date}</td><td>${esc(x.projects?.name||'-')}</td><td>${esc(x.vendor||'-')}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${x.gst_included?money(Number(x.total)-Number(x.amount)):'₹0'}</td><td><b>${money(x.total)}</b></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No expenses.</td></tr>'}</script></body></html>
