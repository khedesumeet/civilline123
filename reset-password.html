<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password | CivilLine</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><div class="auth card"><div class="logo" style="text-align:center">Civil<span>Line</span></div><h1 style="margin-top:22px">Set New Password</h1><p class="subtitle">Choose a new secure password.</p><form id="f"><label>New Password</label><input id="password" type="password" minlength="6" required><label style="margin-top:14px">Confirm Password</label><input id="confirm" type="password" minlength="6" required><button class="btn dark" style="width:100%;margin-top:18px">UPDATE PASSWORD</button></form><div id="msg" class="msg"></div></div><script>f.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value)return msg('Passwords do not match.',false);const r=await sb.auth.updateUser({password:password.value});if(r.error)return msg(r.error.message,false);msg('Password updated successfully. You can now login.');setTimeout(()=>location.href='contractor-login.html',1500)};</script></body></html>
