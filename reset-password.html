<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivilLine - Password Reset</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#172033}.card{max-width:430px;margin:70px auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;box-shadow:0 5px 20px #0000000a}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}.btn{width:100%;border:0;border-radius:8px;background:#f59e0b;color:#111827;padding:11px 14px;font-weight:800;cursor:pointer;margin-top:16px}.msg{padding:11px;border-radius:8px;margin-top:14px;display:none}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.logo{text-align:center;font-size:24px;font-weight:900}.logo span{color:#f59e0b}.hidden{display:none!important}a{color:#b45309}</style></head><body><div class="card"><div class="logo">Civil<span>Line</span></div><div id="request"><h1>Reset Password</h1><p>Enter your Login ID (email). We will send a secure password reset link.</p><form id="forgotForm"><label>Login ID (Email)</label><input id="email" type="email" autocomplete="username" required><button class="btn">SEND RESET LINK</button></form></div><div id="change" class="hidden"><h1>Create New Password</h1><form id="changeForm"><label>New Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><label>Confirm Password</label><input id="confirm" type="password" minlength="6" autocomplete="new-password" required><button class="btn">UPDATE PASSWORD</button></form></div><div id="msg" class="msg"></div><p style="text-align:center"><a href="contractor-login.html">Contractor Login</a> &nbsp; | &nbsp; <a href="admin-login.html">Admin Login</a></p></div><script>const sb=supabase.createClient("https://aoicywtjwvqzzhmxkxvs.supabase.co","sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W");const msg=document.getElementById('msg');function show(t,c){msg.textContent=t;msg.className='msg '+(c==='err'?'err':'ok');msg.style.display='block'}(async()=>{const u=new URL(location.href);if(u.hash.includes('access_token')||u.searchParams.get('mode')==='update'){document.getElementById('request').classList.add('hidden');document.getElementById('change').classList.remove('hidden');const r=await sb.auth.getSession();if(!r.data.session)show('Open the password reset link from your email again.','err')}})();forgotForm.onsubmit=async e=>{e.preventDefault();const redirect=location.origin+location.pathname+'?mode=update';const r=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:redirect});if(r.error)return show(r.error.message,'err');show('Password reset link sent. Check your email.','ok');forgotForm.reset()};changeForm.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value)return show('Passwords do not match.','err');const r=await sb.auth.updateUser({password:password.value});if(r.error)return show(r.error.message,'err');show('Password updated successfully. You can now log in.','ok');setTimeout(()=>location.href='contractor-login.html',1200)};</script></body></html>
