<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#172033;--muted:#64748b;--dark:#111827;--accent:#f59e0b;--danger:#dc2626;--line:#e5e7eb;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:10}.bar{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:24px;font-weight:900}.logo span{color:var(--accent)}nav{display:flex;gap:5px;flex-wrap:wrap}nav a,nav button{color:#fff;text-decoration:none;background:transparent;border:0;padding:9px 11px;border-radius:7px;cursor:pointer;font-weight:700}nav a:hover,nav button:hover{background:#374151}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 5px 20px #0000000a;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:14px}textarea{min-height:90px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:var(--accent);color:#111827;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.btn.secondary{background:#e5e7eb}.btn.dark{background:var(--dark);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.success{background:var(--ok);color:#fff}.btn.small{padding:7px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{padding:11px;border-radius:8px;margin-top:14px;display:none}.successmsg{background:#dcfce7;color:#166534}.errormsg{background:#fee2e2;color:#991b1b}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:24px;font-weight:900;margin-top:7px}.muted{color:var(--muted)}.auth{max-width:430px;margin:70px auto}.hero{max-width:950px;margin:60px auto;text-align:center;padding:25px}.hero h1{font-size:45px}@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid,.grid4{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="bar"><div class="logo">Civil<span>Line</span></div><nav><a href="dashboard.html">Dashboard</a><a href="projects.html">Projects</a><a href="client-bills.html">Client Bills</a><a href="statements.html">Statements</a><button id="logout">Logout</button></nav></div></header><div class="wrap"><div class="card"><h1>Expenses</h1><form id="form"><div class="grid"><div><label>Project *</label><select id="project" required></select></div><div><label>Date *</label><input id="date" type="date" required></div><div><label>Category *</label><select id="category"><option>Material</option><option>Labour</option><option>Contractor</option><option>Equipment</option><option>Transport</option><option>Miscellaneous</option><option>Other</option></select></div><div><label>Vendor</label><input id="vendor"></div><div><label>Bill Number</label><input id="bill"></div><div><label>GST</label><select id="gst"><option value="yes">With GST</option><option value="no">Without GST</option></select></div><div><label>Amount *</label><input id="amount" type="number" min="0" step=".01" required></div><div id="gb"><label>GST %</label><input id="gstpct" type="number" value="18" min="0" max="100" step=".01"></div><div><label>Total</label><input id="total" readonly></div><div><label>Bill PDF/Image (max 10MB)</label><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"></div></div><button class="btn" id="save">Save Expense</button><button type="button" class="btn secondary" id="cancel" style="display:none">Cancel</button></form><div id="msg" class="msg"></div></div><div class="card table-scroll"><table><thead><tr><th>Date</th><th>Project</th><th>Vendor</th><th>Category</th><th>GST</th><th>Total</th><th>Bill</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const sb=supabase.createClient("https://aoicywtjwvqzzhmxkxvs.supabase.co","sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W");let uid,edit=null,old=null,all=[];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));(async()=>{const u=await sb.auth.getUser();if(!u.data.user)return location.href="contractor-login.html";uid=u.data.user.id;const p=await sb.from("profiles").select("role,status").eq("id",uid).single();if(p.data?.role!=="contractor"||p.data.status!=="approved")return location.href="contractor-login.html";date.value=new Date().toISOString().slice(0,10);await projects();calc();load()})();async function projects(){const r=await sb.from("projects").select("id,name").eq("user_id",uid).order("name");if(r.error)return show(r.error.message,"error");project.innerHTML=(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}function calc(){const a=Number(amount.value||0),g=gst.value==="yes"?Number(gstpct.value||0):0;gb.style.display=gst.value==="yes"?"block":"none";total.value=(a+a*g/100).toFixed(2)}amount.oninput=calc;gstpct.oninput=calc;gst.onchange=calc;form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{let path=old,fl=file.files[0];if(fl){if(fl.size>10485760)throw Error("File must be 10MB or smaller.");const ext=fl.name.split(".").pop().toLowerCase(),np=uid+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;const up=await sb.storage.from("contractor-bills").upload(np,fl,{upsert:false,contentType:fl.type});if(up.error)throw up.error;path=np;if(old&&old!==np)await sb.storage.from("contractor-bills").remove([old])}const yes=gst.value==="yes",d={user_id:uid,project_id:project.value,date:date.value,category:category.value,vendor:vendor.value.trim()||null,bill_number:bill.value.trim()||null,gst_included:yes,gst_percent:yes?Number(gstpct.value||0):0,amount:Number(amount.value||0),total:Number(total.value),bill_path:path};const r=edit?await sb.from("expenses").update(d).eq("id",edit).eq("user_id",uid):await sb.from("expenses").insert(d);if(r.error)throw r.error;show(edit?"Updated":"Saved","success");reset();load()}catch(x){show(x.message,"error")}finally{save.disabled=false}};async function load(){const r=await sb.from("expenses").select("*,projects(name)").eq("user_id",uid).order("date",{ascending:false});if(r.error)return show(r.error.message,"error");all=r.data||[];rows.innerHTML="";for(const x of all){let link="-";if(x.bill_path){const s=await sb.storage.from("contractor-bills").createSignedUrl(x.bill_path,3600);if(s.data?.signedUrl)link=`<a target="_blank" href="${s.data.signedUrl}">View</a>`}rows.innerHTML+=`<tr><td>${x.date}</td><td>${esc(x.projects?.name||"-")}</td><td>${esc(x.vendor||"-")}</td><td>${esc(x.category)}</td><td>${x.gst_included?"Yes":"No"}</td><td><b>₹${Number(x.total||0).toLocaleString("en-IN")}</b></td><td>${link}</td><td><button class="btn small secondary" onclick="ed('${x.id}')">Edit</button> <button class="btn small danger" onclick="del('${x.id}')">Delete</button></td></tr>`}}function ed(id){const x=all.find(v=>v.id===id);if(!x)return;edit=id;old=x.bill_path||null;project.value=x.project_id;date.value=x.date;category.value=x.category;vendor.value=x.vendor||"";bill.value=x.bill_number||"";gst.value=x.gst_included?"yes":"no";gstpct.value=x.gst_percent||18;amount.value=x.amount;calc();save.textContent="Save Changes";cancel.style.display="inline-flex"}async function del(id){const x=all.find(v=>v.id===id);if(!confirm("Delete expense and bill?"))return;const r=await sb.from("expenses").delete().eq("id",id).eq("user_id",uid);if(r.error)return show(r.error.message,"error");if(x?.bill_path)await sb.storage.from("contractor-bills").remove([x.bill_path]);load()}function reset(){edit=null;old=null;form.reset();date.value=new Date().toISOString().slice(0,10);save.textContent="Save Expense";cancel.style.display="none";calc()}cancel.onclick=reset;function show(t,c){msg.textContent=t;msg.className="msg "+(c==="error"?"errormsg":"successmsg");msg.style.display="block"}logout.onclick=async()=>{await sb.auth.signOut();location.href="contractor-login.html"}</script></body></html>
