<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses | CivilLine</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><header><div class="bar"><div class="logo">Civil<span>Line</span></div><nav><a href="dashboard.html">Dashboard</a><a href="projects.html">Projects</a><a href="client-bills.html">Client Bills</a><a href="statements.html">Statements</a><button onclick="logout()">Logout</button></nav></div></header><main class="wrap"><div class="card"><h1>Expenses</h1><p class="subtitle">Track material, labour, contractor and other project expenses with GST and bill files.</p><form id="form"><div class="grid3"><div><label>Project *</label><select id="project" required></select></div><div><label>Date *</label><input id="date" type="date" required></div><div><label>Category *</label><select id="category"><option>Material</option><option>Labour</option><option>Contractor</option><option>Equipment</option><option>Transport</option><option>Miscellaneous</option><option>Other</option></select></div><div><label>Vendor / Contractor</label><input id="vendor"></div><div><label>Bill Number</label><input id="bill"></div><div><label>GST</label><select id="gst"><option value="yes">With GST</option><option value="no">Without GST</option></select></div><div><label>Amount before GST *</label><input id="amount" type="number" min="0" step=".01" required></div><div id="gb"><label>GST %</label><input id="gstpct" type="number" value="18" min="0" max="100" step=".01"></div><div><label>Total</label><input id="total" readonly></div><div class="full"><label>Bill PDF / Image</label><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"></div></div><div class="actions" style="margin-top:16px"><button class="btn" id="save">Save Expense</button><button type="button" class="btn secondary" id="cancel" style="display:none">Cancel</button></div></form><div id="msg" class="msg"></div></div><div class="card"><div class="toolbar"><h2>Expense Register</h2><input id="search" placeholder="Search vendor/category" style="max-width:280px"></div><div class="table-scroll"><table><thead><tr><th>Date</th><th>Project</th><th>Vendor</th><th>Category</th><th>GST</th><th>Total</th><th>Bill</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>let uid,edit=null,old=null,all=[];(async()=>{const a=await auth();if(!a)return;uid=a.user.id;date.value=new Date().toISOString().slice(0,10);await projects();calc();load()})();async function projects(){const r=await sb.from('projects').select('id,name').eq('user_id',uid).order('name');if(r.error)return msg(r.error.message,false);project.innerHTML=(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}function calc(){const a=Number(amount.value||0),g=gst.value==='yes'?Number(gstpct.value||0):0;gb.style.display=gst.value==='yes'?'block':'none';total.value=(a+a*g/100).toFixed(2)}amount.oninput=calc;gstpct.oninput=calc;gst.onchange=calc;form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{let path=old,fl=file.files[0];if(fl){if(fl.size>10485760)throw Error('File must be 10 MB or smaller.');const ext=fl.name.split('.').pop().toLowerCase(),np=uid+'/expense-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const up=await sb.storage.from('contractor-bills').upload(np,fl,{upsert:false,contentType:fl.type});if(up.error)throw up.error;path=np;if(old)await sb.storage.from('contractor-bills').remove([old])}const yes=gst.value==='yes',d={user_id:uid,project_id:project.value,date:date.value,category:category.value,vendor:vendor.value.trim()||null,bill_number:bill.value.trim()||null,gst_included:yes,gst_percent:yes?Number(gstpct.value||0):0,amount:Number(amount.value||0),total:Number(total.value),bill_path:path||null};const r=edit?await sb.from('expenses').update(d).eq('id',edit).eq('user_id',uid):await sb.from('expenses').insert(d);if(r.error)throw r.error;msg(edit?'Expense updated.':'Expense saved.');reset();load()}catch(x){msg(x.message,false)}finally{save.disabled=false}};async function load(){const r=await sb.from('expenses').select('*,projects(name)').eq('user_id',uid).order('date',{ascending:false});if(r.error)return msg(r.error.message,false);all=r.data||[];render()}async function render(){const q=search.value.toLowerCase();let html='';for(const x of all.filter(v=>(v.vendor||'').toLowerCase().includes(q)||(v.category||'').toLowerCase().includes(q)||(v.projects?.name||'').toLowerCase().includes(q))){let link='-';if(x.bill_path){const s=await sb.storage.from('contractor-bills').createSignedUrl(x.bill_path,3600);if(s.data?.signedUrl)link=`<a target="_blank" href="${s.data.signedUrl}">View</a>`}html+=`<tr><td>${x.date}</td><td>${esc(x.projects?.name||'-')}</td><td>${esc(x.vendor||'-')}</td><td>${esc(x.category)}</td><td>${x.gst_included?'Yes':'No'}</td><td><b>${money(x.total)}</b></td><td>${link}</td><td><button class="btn small secondary" onclick="ed('${x.id}')">Edit</button> <button class="btn small danger" onclick="del('${x.id}')">Delete</button></td></tr>`}rows.innerHTML=html||'<tr><td colspan="8" class="empty">No expenses found.</td></tr>'}search.oninput=render;function ed(id){const x=all.find(v=>v.id===id);edit=id;old=x.bill_path||null;project.value=x.project_id;date.value=x.date;category.value=x.category;vendor.value=x.vendor||'';bill.value=x.bill_number||'';gst.value=x.gst_included?'yes':'no';gstpct.value=x.gst_percent||18;amount.value=x.amount;calc();save.textContent='Save Changes';cancel.style.display='inline-flex'}async function del(id){const x=all.find(v=>v.id===id);if(!confirm('Delete expense and bill?'))return;const r=await sb.from('expenses').delete().eq('id',id).eq('user_id',uid);if(r.error)return msg(r.error.message,false);if(x?.bill_path)await sb.storage.from('contractor-bills').remove([x.bill_path]);load()}function reset(){edit=null;old=null;form.reset();date.value=new Date().toISOString().slice(0,10);save.textContent='Save Expense';cancel.style.display='none';calc()}cancel.onclick=reset;</script></body></html>
