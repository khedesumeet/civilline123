<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - CivilLine</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#172033;--muted:#64748b;--dark:#111827;--accent:#f59e0b;--danger:#dc2626;--line:#e5e7eb;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:10}.bar{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:24px;font-weight:900}.logo span{color:var(--accent)}nav{display:flex;gap:5px;flex-wrap:wrap}nav a,nav button{color:#fff;text-decoration:none;background:transparent;border:0;padding:9px 11px;border-radius:7px;cursor:pointer;font-weight:700}nav a:hover,nav button:hover{background:#374151}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 5px 20px #0000000a;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:14px}textarea{min-height:90px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:var(--accent);color:#111827;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.btn.secondary{background:#e5e7eb}.btn.dark{background:var(--dark);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.success{background:var(--ok);color:#fff}.btn.small{padding:7px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{padding:11px;border-radius:8px;margin-top:14px;display:none}.successmsg{background:#dcfce7;color:#166534}.errormsg{background:#fee2e2;color:#991b1b}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:24px;font-weight:900;margin-top:7px}.muted{color:var(--muted)}.auth{max-width:430px;margin:70px auto}.hero{max-width:950px;margin:60px auto;text-align:center;padding:25px}.hero h1{font-size:45px}@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid,.grid4{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="bar"><div class="logo">Civil<span>Line</span></div><nav><a href="index.html">Home</a><button id="logout">Logout</button></nav></div></header><div class="wrap"><div class="card"><h1>Admin Dashboard</h1><p class="muted">Only Admin can create contractor accounts.</p><form id="cf"><div class="grid"><div><label>Contractor Email *</label><input id="email" type="email" required></div><div><label>Temporary Password *</label><input id="password" type="text" minlength="6" required></div><div><label>Company Name *</label><input id="company" required></div><div><label>Owner Name *</label><input id="owner" required></div><div><label>Mobile *</label><input id="mobile" required></div><div><label>WhatsApp</label><input id="whatsapp"></div><div><label>City *</label><input id="city" required></div><div><label>Area</label><input id="area"></div><div style="grid-column:1/-1"><label>Address</label><textarea id="address"></textarea></div><div style="grid-column:1/-1"><label>Services</label><input id="services" placeholder="RCC, Shuttering, Masonry"></div></div><button class="btn" id="create" style="margin-top:16px">CREATE CONTRACTOR</button></form><div id="msg" class="msg"></div></div><div class="card"><div class="grid"><input id="search" placeholder="Search contractor"><select id="filter"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="suspended">Suspended</option><option value="rejected">Rejected</option></select></div><br><div class="table-scroll"><table><thead><tr><th>Company</th><th>Owner</th><th>Email</th><th>Mobile</th><th>City</th><th>Status</th><th>Featured</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const sb=supabase.createClient("https://aoicywtjwvqzzhmxkxvs.supabase.co","sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W");let me=null,data=[];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));(async()=>{const u=await sb.auth.getUser();if(!u.data.user)return location.href="admin-login.html";me=u.data.user;const p=await sb.from("profiles").select("role").eq("id",me.id).single();if(p.data?.role!=="admin"){await sb.auth.signOut();return location.href="admin-login.html"}load()})();cf.onsubmit=async e=>{e.preventDefault();create.disabled=true;try{if(!/^\d{10}$/.test(mobile.value.trim()))throw Error("Mobile must be 10 digits.");const r=await fetch("https://aoicywtjwvqzzhmxkxvs.supabase.co/functions/v1/create-contractor",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(await sb.auth.getSession()).data.session.access_token,"apikey":"sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W"},body:JSON.stringify({email:email.value.trim(),password:password.value,company_name:company.value.trim(),owner_name:owner.value.trim(),mobile:mobile.value.trim(),whatsapp:whatsapp.value.trim(),city:city.value.trim(),area:area.value.trim(),address:address.value.trim(),services:services.value.split(",").map(x=>x.trim()).filter(Boolean)})});const j=await r.json();if(!r.ok)throw Error(j.error||"Could not create contractor.");show("Contractor account created.","success");cf.reset();load()}catch(x){show(x.message,"error")}finally{create.disabled=false}};async function load(){const r=await sb.from("profiles").select("*").eq("role","contractor").order("created_at",{ascending:false});if(r.error)return show(r.error.message,"error");data=r.data||[];render()}function render(){const q=search.value.toLowerCase(),s=filter.value;rows.innerHTML=data.filter(x=>(!s||x.status===s)&&(!q||[x.company_name,x.owner_name,x.email,x.mobile,x.city].join(" ").toLowerCase().includes(q))).map(x=>`<tr><td><b>${esc(x.company_name)}</b></td><td>${esc(x.owner_name)}</td><td>${esc(x.email)}</td><td>${esc(x.mobile)}</td><td>${esc(x.city)}</td><td>${esc(x.status)}</td><td>${x.is_featured?"Yes":"No"}</td><td><div class="actions"><button class="btn small success" onclick="status('${x.id}','approved')">Approve</button><button class="btn small secondary" onclick="status('${x.id}','suspended')">Suspend</button><button class="btn small" onclick="feature('${x.id}')">${x.is_featured?"Unfeature":"Feature"}</button><button class="btn small danger" onclick="del('${x.id}')">Delete</button></div></td></tr>`).join("")}search.oninput=render;filter.onchange=render;async function status(id,s){const r=await sb.from("profiles").update({status:s}).eq("id",id);if(r.error)show(r.error.message,"error");else load()}async function feature(id){const x=data.find(v=>v.id===id);const r=await sb.from("profiles").update({is_featured:!x.is_featured}).eq("id",id);if(r.error)show(r.error.message,"error");else load()}async function del(id){if(!confirm("Delete contractor profile? Auth user is not deleted by this button."))return;const r=await sb.from("profiles").delete().eq("id",id);if(r.error)show(r.error.message,"error");else load()}function show(t,c){msg.textContent=t;msg.className="msg "+(c==="error"?"errormsg":"successmsg");msg.style.display="block";setTimeout(()=>msg.style.display="none",4000)}logout.onclick=async()=>{await sb.auth.signOut();location.href="admin-login.html"}</script></body></html>
