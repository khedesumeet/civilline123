<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Admin - CivilLine</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --dark:#111827;
  --accent:#f59e0b;
  --danger:#dc2626;
  --line:#e5e7eb;
  --ok:#16a34a;
  --warning:#d97706;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--dark);
  color:#fff;
  position:sticky;
  top:0;
  z-index:100;
}

.bar{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:var(--accent);
}

nav{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

nav a,
nav button{
  color:#fff;
  text-decoration:none;
  background:transparent;
  border:0;
  padding:9px 11px;
  border-radius:7px;
  cursor:pointer;
  font-weight:700;
}

nav a:hover,
nav button:hover{
  background:#374151;
}

.wrap{
  max-width:1200px;
  margin:24px auto;
  padding:0 16px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  box-shadow:0 5px 20px #0000000a;
  margin-bottom:18px;
}

h1{
  margin:0 0 7px;
  font-size:28px;
}

h2{
  margin:0;
  font-size:20px;
}

.muted{
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:#fff;
  font-size:14px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px #f59e0b22;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:#111827;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
}

.btn:hover{
  opacity:.9;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.btn.secondary{
  background:#e5e7eb;
  color:#111827;
}

.btn.danger{
  background:var(--danger);
  color:#fff;
}

.btn.success{
  background:var(--ok);
  color:#fff;
}

.btn.small{
  padding:7px 9px;
  font-size:12px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.msg{
  padding:11px 13px;
  border-radius:8px;
  margin-top:14px;
  display:none;
  font-weight:600;
}

.successmsg{
  background:#dcfce7;
  color:#166534;
}

.errormsg{
  background:#fee2e2;
  color:#991b1b;
}

.infomsg{
  background:#dbeafe;
  color:#1e40af;
}

.table-scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  padding:10px 8px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:13px;
  vertical-align:top;
}

th{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  white-space:nowrap;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.badge.ok{
  background:#dcfce7;
  color:#166534;
}

.badge.bad{
  background:#fee2e2;
  color:#991b1b;
}

.badge.warn{
  background:#fef3c7;
  color:#92400e;
}

.badge.neutral{
  background:#e5e7eb;
  color:#374151;
}

.empty{
  text-align:center;
  padding:30px !important;
  color:var(--muted);
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}

.searchbox{
  display:grid;
  grid-template-columns:1fr 200px;
  gap:10px;
}

.loading{
  opacity:.7;
}

.featured-yes{
  color:#166534;
  font-weight:800;
}

.featured-no{
  color:var(--muted);
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .searchbox{
    grid-template-columns:1fr;
  }

  .wrap{
    margin:15px auto;
    padding:0 10px;
  }

  .card{
    padding:15px;
  }

  h1{
    font-size:24px;
  }

  .bar{
    padding:12px;
  }

}

</style>

</head>


<body>


<header>

  <div class="bar">

    <div class="logo">
      Civil<span>Line</span>
    </div>

    <nav>

      <a href="index.html">
        Home
      </a>

      <button
        type="button"
        id="logoutBtn"
      >
        Logout
      </button>

    </nav>

  </div>

</header>


<div class="wrap">


  <!-- =========================
       CREATE CONTRACTOR
  ========================== -->

  <div class="card">

    <h1>Admin Dashboard</h1>

    <p class="muted">
      Only Admin can create contractor accounts.
    </p>


    <form id="contractorForm">

      <div class="grid">


        <div>

          <label for="email">
            Contractor Email *
          </label>

          <input

            type="email"
            autocomplete="username"

        <div>

          <label for="password">
            Temporary Password *

          <input
            id="password"
            type="password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <div>

          <label for="company">
            Company Name *
          </label>

          <input
            id="company"
            required
          >

        </div>


        <div>

          <label for="owner">
            Owner Name *
          </label>

          <input
            id="owner"
            required
          >

        </div>


        <div>

          <label for="mobile">
            Mobile *
          </label>

          <input
            id="mobile"
            type="tel"
            inputmode="numeric"

            required

        </div>


        <div>

          <label for="whatsapp">
            WhatsApp
          </label>

          <input
            id="whatsapp"
            type="tel"
            inputmode="numeric"

          >

        </div>

          <label for="city">

          <input
            id="city"
            required

  <!-- =========================
       CONTRACTOR LIST
  ========================== -->

  <div class="card">


    <div class="toolbar">

        <option value="">

        <option value="pending">

    <div class="table-scroll">

        <thead>

            </th>

            <th>
              Owner
            </th>

            <th>
              Email
            </th>

            <th>
              Mobile
            </th>

            <th>
              City
            </th>

            <th>
              Status
            </th>

            <th>
              Featured
            </th>

            <th>

        </thead>

      </table>

  </div>


</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://aoicywtjwvqzzhmxkxvs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W";


const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   DOM ELEMENTS
========================================================= */

const contractorForm =
  document.getElementById(
    "contractorForm"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const companyInput =
  document.getElementById(
    "company"
  );

const ownerInput =
  document.getElementById(
    "owner"
  );

const mobileInput =
  document.getElementById(
    "mobile"
  );

const whatsappInput =
  document.getElementById(
    "whatsapp"
  );

const cityInput =
  document.getElementById(
    "city"
  );

const areaInput =
  document.getElementById(
    "area"
  );

const addressInput =
  document.getElementById(
    "address"
  );

const servicesInput =
  document.getElementById(
    "services"
  );

const createBtn =
  document.getElementById(
    "createBtn"
  );

const msgElement =
  document.getElementById(
    "msg"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const filterInput =
  document.getElementById(
    "filterInput"
  );

const rowsElement =
  document.getElementById(
    "rows"
  );

const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );


/* =========================================================
   VARIABLES
========================================================= */

let contractors = [];

let currentUser = null;


/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(
      /[&<>"']/g,
      function(char){

        const map = {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        };

        return map[char];

      }
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  message,
  type = "success"
){

  msgElement.textContent =
    message;

  msgElement.className =
    "msg";


  if(type === "error"){

    msgElement.classList.add(
      "errormsg"
    );

  }
  else if(type === "info"){

    msgElement.classList.add(
      "infomsg"
    );

  }
  else{

    msgElement.classList.add(
      "successmsg"
    );

  }


  msgElement.style.display =
    "block";


  window.clearTimeout(
    showMessage.timer
  );


  showMessage.timer =
    window.setTimeout(
      function(){

        msgElement.style.display =
          "none";

      },
      5000
    );

}


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkAdmin(){

  try{

    const sessionResult =
      await sb.auth.getSession();


    if(
      sessionResult.error
    ){

      throw sessionResult.error;

    }


    const session =
      sessionResult.data.session;


    if(!session){

      window.location.href =
        "admin-login.html";

      return false;

    }


    const userResult =
      await sb.auth.getUser();


    if(
      userResult.error ||
      !userResult.data.user
    ){

      await sb.auth.signOut();

      window.location.href =
        "admin-login.html";

      return false;

    }


    currentUser =
      userResult.data.user;


    /* -----------------------------------------
       CHECK PROFILE
    ----------------------------------------- */

    const profileResult =
      await sb
        .from("profiles")
        .select("id,role,status")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if(
      profileResult.error
    ){

      console.error(
        profileResult.error
      );

      showMessage(
        "Unable to verify admin account: " +
        profileResult.error.message,
        "error"
      );

      return false;

    }


    if(
      !profileResult.data ||
      profileResult.data.role !== "admin"
    ){

      await sb.auth.signOut();

      window.location.href =
        "admin-login.html";

      return false;

    }


    return true;


  }
  catch(error){

    console.error(
      "AUTH ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Authentication error.",
      "error"
    );

    return false;

  }

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

  rowsElement.innerHTML = `
    <tr>
      <td colspan="8" class="empty">
        Checking admin access...
      </td>
    </tr>
  `;


  const isAdmin =
    await checkAdmin();


  if(!isAdmin){

    return;

  }


  await loadContractors();

}


/* =========================================================
   LOAD CONTRACTORS
========================================================= */

async function loadContractors(){

  rowsElement.innerHTML = `
    <tr>
      <td colspan="8" class="empty">
        Loading contractors...
      </td>
    </tr>
  `;


  try{

    const result =
      await sb
        .from("profiles")
        .select("*")
        .eq(
          "role",
          "contractor"
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){

      throw result.error;

    }


    contractors =
      result.data || [];


    renderContractors();


  }
  catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );


    rowsElement.innerHTML = `
      <tr>
        <td colspan="8" class="empty">
          Could not load contractors.
        </td>
      </tr>
    `;


    showMessage(
      "Could not load contractors: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   RENDER CONTRACTORS
========================================================= */

function renderContractors(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  const selectedStatus =
    filterInput.value;


  const filtered =
    contractors.filter(
      function(contractor){

        const searchable = [

          contractor.company_name,
          contractor.owner_name,
          contractor.email,
          contractor.mobile,
          contractor.city,
          contractor.area

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        const searchMatch =
          !query ||
          searchable.includes(
            query
          );


        const statusMatch =
          !selectedStatus ||
          contractor.status ===
            selectedStatus;


        return (
          searchMatch &&
          statusMatch
        );

      }
    );


  if(!filtered.length){

    rowsElement.innerHTML = `
      <tr>
        <td colspan="8" class="empty">
          No contractors found.
        </td>
      </tr>
    `;

    return;

  }


  rowsElement.innerHTML =
    filtered
      .map(
        function(contractor){

          const status =
            contractor.status ||
            "pending";


          let statusClass =
            "warn";


          if(status === "approved"){

            statusClass =
              "ok";

          }
          else if(
            status === "suspended" ||
            status === "rejected"
          ){

            statusClass =
              "bad";

          }


          const isFeatured =
            contractor.is_featured === true;


          return `

            <tr>

              <td>
                <b>
                  ${esc(
                    contractor.company_name
                  )}
                </b>
              </td>


              <td>
                ${esc(
                  contractor.owner_name
                )}
              </td>


              <td>
                ${esc(
                  contractor.email
                )}
              </td>


              <td>
                ${esc(
                  contractor.mobile
                )}
              </td>


              <td>
                ${esc(
                  contractor.city
                )}
              </td>


              <td>

                <span
                  class="badge ${statusClass}"
                >
                  ${esc(status)}
                </span>

              </td>


              <td>

                <span
                  class="${
                    isFeatured
                      ? "featured-yes"
                      : "featured-no"
                  }"
                >

                  ${
                    isFeatured
                      ? "Yes"
                      : "No"
                  }

                </span>

              </td>


              <td>

                <div class="actions">

                  <button
                    type="button"
                    class="btn small success"
                    data-action="approve"
                    data-id="${esc(
                      contractor.id
                    )}"
                  >
                    Approve
                  </button>


                  <button
                    type="button"
                    class="btn small secondary"
                    data-action="suspend"
                    data-id="${esc(
                      contractor.id
                    )}"
                  >
                    Suspend
                  </button>


                  <button
                    type="button"
                    class="btn small"
                    data-action="feature"
                    data-id="${esc(
                      contractor.id
                    )}"
                  >
                    ${
                      isFeatured
                        ? "Unfeature"
                        : "Feature"
                    }
                  </button>


                  <button
                    type="button"
                    class="btn small danger"
                    data-action="delete"
                    data-id="${esc(
                      contractor.id
                    )}"
                  >
                    Delete
                  </button>

                </div>

              </td>

            </tr>

          `;

        }
      )
      .join("");

}


/* =========================================================
   CREATE CONTRACTOR
========================================================= */

contractorForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    createBtn.disabled =
      true;

    createBtn.textContent =
      "CREATING...";


    try{

      /* -----------------------------------------
         GET VALUES
      ----------------------------------------- */

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      const company =
        companyInput.value.trim();

      const owner =
        ownerInput.value.trim();

      const mobile =
        mobileInput.value.trim();

      const whatsapp =
        whatsappInput.value.trim();

      const city =
        cityInput.value.trim();

      const area =
        areaInput.value.trim();

      const address =
        addressInput.value.trim();

      const services =
        servicesInput.value
          .split(",")
          .map(
            function(item){
              return item.trim();
            }
          )
          .filter(Boolean);


      /* -----------------------------------------
         VALIDATION
      ----------------------------------------- */

      if(!email){

        throw new Error(
          "Contractor email is required."
        );

      }


      if(password.length < 6){

        throw new Error(
          "Password must be at least 6 characters."
        );

      }


      if(!company){

        throw new Error(
          "Company name is required."
        );

      }


      if(!owner){

        throw new Error(
          "Owner name is required."
        );

      }


      if(
        !/^\d{10}$/.test(
          mobile
        )
      ){

        throw new Error(
          "Mobile must be exactly 10 digits."
        );

      }


      if(
        whatsapp &&
        !/^\d{10}$/.test(
          whatsapp
        )
      ){

        throw new Error(
          "WhatsApp must be exactly 10 digits."
        );

      }


      if(!city){

        throw new Error(
          "City is required."
        );

      }


      /* -----------------------------------------
         SESSION
      ----------------------------------------- */

      const sessionResult =
        await sb.auth.getSession();


      if(
        sessionResult.error
      ){

        throw sessionResult.error;

      }


      const session =
        sessionResult.data.session;


      if(!session){

        throw new Error(
          "Session expired. Please login again."
        );

      }


      /* -----------------------------------------
         EDGE FUNCTION
      ----------------------------------------- */

      const response =
        await fetch(

          SUPABASE_URL +
          "/functions/v1/create-contractor",

          {

            method:"POST",

            headers:{

              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " +
                session.access_token,

              "apikey":
                SUPABASE_KEY

            },

            body:JSON.stringify({

              email:email,

              password:password,

              company_name:
                company,

              owner_name:
                owner,

              mobile:
                mobile,

              whatsapp:
                whatsapp,

              city:
                city,

              area:
                area,

              address:
                address,

              services:
                services

            })

          }

        );


      /* -----------------------------------------
         READ RESPONSE
      ----------------------------------------- */

      let result = {};


      try{

        result =
          await response.json();

      }
      catch(error){

        result = {};

      }


      if(!response.ok){

        throw new Error(

          result.error ||
          result.message ||
          "Contractor creation failed. HTTP " +
          response.status

        );

      }


      /* -----------------------------------------
         SUCCESS
      ----------------------------------------- */

      showMessage(
        "Contractor account created successfully.",
        "success"
      );


      contractorForm.reset();


      await loadContractors();


    }
    catch(error){

      console.error(
        "CREATE CONTRACTOR ERROR:",
        error
      );


      showMessage(
        error.message ||
        "Could not create contractor.",
        "error"
      );


    }
    finally{

      createBtn.disabled =
        false;

      createBtn.textContent =
        "CREATE CONTRACTOR";

    }

  }
);


/* =========================================================
   TABLE ACTIONS
========================================================= */

rowsElement.addEventListener(
  "click",
  async function(event){

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if(!button){

      return;

    }


    const id =
      button.dataset.id;

    const action =
      button.dataset.action;


    if(!id){

      showMessage(
        "Invalid contractor ID.",
        "error"
      );

      return;

    }


    if(action === "approve"){

      await changeStatus(
        id,
        "approved"
      );

    }


    else if(action === "suspend"){

      await changeStatus(
        id,
        "suspended"
      );

    }


    else if(action === "feature"){

      await toggleFeatured(
        id
      );

    }


    else if(action === "delete"){

      await deleteProfile(
        id
      );

    }

  }
);


/* =========================================================
   CHANGE STATUS
========================================================= */

async function changeStatus(
  id,
  newStatus
){

  try{

    const result =
      await sb
        .from("profiles")
        .update({
          status:newStatus
        })
        .eq(
          "id",
          id
        );


    if(result.error){

      throw result.error;

    }


    showMessage(
      "Contractor status changed to " +
      newStatus +
      ".",
      "success"
    );


    await loadContractors();


  }
  catch(error){

    console.error(
      "STATUS ERROR:",
      error
    );


    showMessage(
      "Could not update status: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   FEATURE / UNFEATURE
========================================================= */

async function toggleFeatured(
  id
){

  try{

    const contractor =
      contractors.find(
        function(item){
          return item.id === id;
        }
      );


    if(!contractor){

      throw new Error(
        "Contractor not found."
      );

    }


    const newValue =
      contractor.is_featured !== true;


    const result =
      await sb
        .from("profiles")
        .update({
          is_featured:newValue
        })
        .eq(
          "id",
          id
        );


    if(result.error){

      throw result.error;

    }


    showMessage(
      newValue
        ? "Contractor featured."
        : "Contractor unfeatured.",
      "success"
    );


    await loadContractors();


  }
  catch(error){

    console.error(
      "FEATURE ERROR:",
      error
    );


    showMessage(
      "Could not change featured status: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   DELETE PROFILE
========================================================= */

async function deleteProfile(
  id
){

  const contractor =
    contractors.find(
      function(item){
        return item.id === id;
      }
    );


  const name =
    contractor &&
    contractor.company_name
      ? contractor.company_name
      : "this contractor";


  const confirmed =
    window.confirm(

      "Delete profile for " +
      name +
      "?\n\n" +

      "This button deletes the profile only. " +
      "The Supabase Auth account will NOT be deleted."

    );


  if(!confirmed){

    return;

  }


  try{

    const result =
      await sb
        .from("profiles")
        .delete()
        .eq(
          "id",
          id
        );


    if(result.error){

      throw result.error;

    }


    showMessage(
      "Contractor profile deleted.",
      "success"
    );


    await loadContractors();


  }
  catch(error){

    console.error(
      "DELETE ERROR:",
      error
    );


    showMessage(
      "Could not delete profile: " +
      error.message,
      "error"
    );

  }

}
