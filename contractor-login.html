<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contractor Login | CivilLine</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><div class="auth card"><div class="logo" style="text-align:center">Civil<span>Line</span></div><h1 style="margin-top:22px">Contractor Login</h1><p class="subtitle">Login with your registered Login ID</p><form id="f"><label>Login ID / Email</label><input id="email" type="email" required autocomplete="username"><label style="margin-top:14px">Password</label><input id="password" type="password" required autocomplete="current-password"><button class="btn" style="width:100%;margin-top:18px">LOGIN</button></form><p style="text-align:center;margin-top:18px"><a href="forgot-password.html">Forgot Password?</a></p><div id="msg" class="msg"></div></div><script>f.onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return msg(r.error.message,false);const p=await sb.from('profiles').select('role,status').eq('id',r.data.user.id).single();if(p.data?.role!=='contractor'){await sb.auth.signOut();return msg('Use the Admin Login for an admin account.',false)}if(p.data.status!=='approved'){await sb.auth.signOut();return msg('Your account is not approved by Admin yet.',false)}location.href='dashboard.html'};</script></body></html>
