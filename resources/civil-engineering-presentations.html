<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civil Engineering Formula Book</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:95%;
    max-width:1200px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    overflow:hidden;
    border:1px solid rgba(255,255,255,.2);
}

.header{
    text-align:center;
    padding:25px;
    color:#fff;
    background:linear-gradient(90deg,#1565C0,#42A5F5);
}

.header h1{
    font-size:36px;
}

.header p{
    margin-top:8px;
    opacity:.9;
}

.button-area{
    text-align:center;
    padding:20px;
    background:#ffffff10;
}

.button-area a{
    display:inline-block;
    padding:14px 35px;
    background:#ff9800;
    color:white;
    text-decoration:none;
    font-size:18px;
    border-radius:40px;
    font-weight:bold;
    transition:.3s;
}

.button-area a:hover{
    background:#ff6f00;
    transform:scale(1.05);
}

iframe{
    width:100%;
    height:700px;
    border:none;
}

.footer{
    text-align:center;
    color:white;
    padding:15px;
    background:#00000055;
}

@media(max-width:768px){
    .header h1{
        font-size:26px;
    }

    iframe{
        height:500px;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="header">
        <h1>📘 Civil Engineering Formula Book</h1>
        <p>All Civil Engineering Formulae at One Place</p>
    </div>

    <div class="button-area">
        <a href="https://drive.google.com/file/d/1Ocl8CEbPie8GYoWrAIMiw_ObEJxUCroj/view" target="_blank">
            📖 Open Full PDF
        </a>
    </div>

    <iframe
    src="https://drive.google.com/file/d/1Ocl8CEbPie8GYoWrAIMiw_ObEJxUCroj/preview"
    allow="autoplay">
    </iframe>

    <div class="footer">
        © 2026 Civil Engineering Formula Handbook
    </div>

</div>

</body>
</html>
