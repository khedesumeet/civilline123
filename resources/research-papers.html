            { ch: "3. Surveying", q: 14, text: "When the length of chain used in measuring distance is shorter than the standard length, the error in measured length is", opts: ["positive error", "negative error", "compensating error", "none of these"], ans: "a" },
            { ch: "3. Surveying", q: 15, text: "Marking the end of a chain length is an example of", opts: ["positive error", "negative error", "compensating error", "personal error"], ans: "d" },
            { ch: "3. Surveying", q: 16, text: "Pick up the correct feature of accidental error in surveying", opts: ["positive and negative errors will occur with equal frequency", "small errors occur more frequently", "large errors do not occur", "all the above"], ans: "d" },
            { ch: "3. Surveying", q: 17, text: "Significant figure in the number 0.0044 is", opts: ["5", "4", "3", "2"], ans: "d" },
            { ch: "3. Surveying", q: 18, text: "To minimize rounding off errors, as per the rule the numbers 28.425 and 28.435 are rounded off as", opts: ["28.42, 28.43", "28.43, 28.43", "28.42, 28.44", "28.43, 28.44"], ans: "c" },
            { ch: "3. Surveying", q: 19, text: "In approximate measurement of a line by pacing, a step length of a normal man is taken as", opts: ["0.7 m", "0.75 m", "0.80 m", "0.85 m"], ans: "c" },
            { ch: "3. Surveying", q: 20, text: "A watch-like instrument carried in the shirt pocket to count the number of steps taken to measure a line approximately is called", opts: ["passometer", "pedometer", "odometer", "speedometer"], ans: "a" },
            { ch: "3. Surveying", q: 21, text: "The instrument which is attached to the wheel of a cycle to record the number of revolutions made for the purpose of approximate measurement is known as", opts: ["passometer", "pedometer", "odometer", "speedometer"], ans: "c" },
            { ch: "3. Surveying", q: 22, text: "In a 20m chain the brass tally with two teeth indicates the distance from the nearest end of the chain", opts: ["2m", "4m", "6m", "8m"], ans: "b" },
            { ch: "3. Surveying", q: 23, text: "Metallic tapes are made with", opts: ["varnished linen", "varnished linen with steel wires", "steel", "invar"], ans: "b" },
            { ch: "3. Surveying", q: 24, text: "The line to be measured accurately in a chain survey is", opts: ["main line", "base line", "check line", "detail line"], ans: "b" },
            { ch: "3. Surveying", q: 25, text: "If W is the weight of tape per span length, P is the pull applied, the length L measured with a tape is to be corrected by", opts: ["+1/24 (W/P)² L", "−1/24 (W/P)² L", "−1/12 (W/P) L", "−1/24 (W/P) L"], ans: "b" },
            { ch: "3. Surveying", q: 26, text: "The correction to be applied for length L measured along a sloping ground with angle q to horizontal is", opts: ["L(1 − sin q)", "L(1 − cos q)", "L(1 − tan q)", "L(1 − cot q)"], ans: "b" },
            { ch: "3. Surveying", q: 27, text: "In chain survey, as far as possible main triangles should have angles close to", opts: ["40°", "50°", "60°", "70°"], ans: "c" },
            { ch: "3. Surveying", q: 28, text: "In chain survey a triangle with any angle less than is considered as ill conditioned triangle", opts: ["25°", "30°", "35°", "40°"], ans: "b" },
            { ch: "3. Surveying", q: 29, text: "Which one of the following is not used in setting perpendicular", opts: ["line ranger", "cross staff", "optical square", "prism square"], ans: "a" },
            { ch: "3. Surveying", q: 30, text: "The bearing S 25° W means in whole circle bearing", opts: ["155°", "205°", "115°", "335°"], ans: "b" },
            { ch: "3. Surveying", q: 31, text: "The horizontal angle between the true meridian and magnetic meridian is known as", opts: ["magnetic dip", "declination", "local attraction", "magnetic bearing"], ans: "b" },
            { ch: "3. Surveying", q: 32, text: "At a place magnetic dip is 15° and declination is 10°E. If the magnetic bearing of a line is 75°, the true bearing is", opts: ["60°", "65°", "85°", "90°"], ans: "c" },
            { ch: "3. Surveying", q: 33, text: "In whole circle bearing system, the back bearing of N 20 W line is", opts: ["160°", "200°", "340°", "20°"], ans: "a" },
            { ch: "3. Surveying", q: 34, text: "Forebearing of line AB is 60° and that of BC is 130°, then angle B is", opts: ["50°", "190°", "110°", "none of the above"], ans: "c" },
            { ch: "3. Surveying", q: 35, text: "Forebearing of line AB is 80°. Included angle B is 100°. Then forebearing of BC is", opts: ["160°", "180°", "220°", "240°"], ans: "a" },
            { ch: "3. Surveying", q: 36, text: "The following bearings were observed while traversing with a compass. Which stations are affected by local attraction?", opts: ["A and B", "B and C", "C and D", "A and C"], ans: "c" },
            { ch: "3. Surveying", q: 37, text: "Which one of the following is a wrong statement about plane table surveying", opts: ["it avoids missing of any measurement required for plotting", "it is an accurate method", "it is not to be used for locating main stations accurately", "it is commonly used for filling details in small or medium scale mapping"], ans: "b" },
            { ch: "3. Surveying", q: 38, text: "Which one of the following is not an accessory of plane table?", opts: ["Plumbing fork", "Trough compass", "Telescopic alidade", "Prismatic compass"], ans: "d" },
            { ch: "3. Surveying", q: 39, text: "Which one of the following is not a method of plane tabling?", opts: ["Orientation", "Radiation", "Intersection", "Resection"], ans: "a" },
            { ch: "3. Surveying", q: 40, text: "Three-point problem in plane tabling may be solved by", opts: ["tracing paper method", "graphical method", "trial and error method", "all of the above"], ans: "d" },
            { ch: "3. Surveying", q: 41, text: "Trial and error method of solving three-point problems in plane tabling is also known as", opts: ["tracing paper method", "Bessel's method", "Lehman's method", "all the above"], ans: "c" },
            { ch: "3. Surveying", q: 42, text: "Which one of the following is wrong about level surface?", opts: ["It is a horizontal plane", "It is a surface parallel to mean spheroid of earth", "All the points lying on this surface are equidistant from the centre of the earth", "It is normal to plumb line at all points"], ans: "a" },
            { ch: "3. Surveying", q: 43, text: "In India mean sea level used for fixing reduced levels is at", opts: ["Goa", "Mumbai", "Vishakapatnam", "Karachi"], ans: "d" },
            { ch: "3. Surveying", q: 44, text: "Which one of the following is not a self-reading staff?", opts: ["Solid staff", "Folding staff", "Telescopic staff", "Target staff"], ans: "d" },
            { ch: "3. Surveying", q: 45, text: "In external focussing telescope for focussing", opts: ["eyepiece is moved", "objective tube is moved", "either eyepiece or objective piece is moved", "neither eyepiece nor objective piece is moved"], ans: "c" },
            { ch: "3. Surveying", q: 46, text: "In levelling height of instrument means", opts: ["height of telescope from the ground where instrument is set", "level of the point with respect to assumed datum", "it is the elevation of plane of sight from the assumed datum", "none of the above"], ans: "c" },
            { ch: "3. Surveying", q: 47, text: "After setting a level, the first sight to be taken is", opts: ["foresight", "back sight", "intermediate sight", "any of the above"], ans: "b" },
            { ch: "3. Surveying", q: 48, text: "The point on which both foresight and back sights are taken is", opts: ["change point", "first station point in the traverse", "last station point in a traverse", "the point where level is to be set"], ans: "a" },
            { ch: "3. Surveying", q: 49, text: "If d is horizontal distance and R is radius of the earth, curvature correction is", opts: ["d²/R", "−d²/R", "d²/2R", "−d²/2R"], ans: "d" },
            { ch: "3. Surveying", q: 50, text: "Correction for refraction is approximately", opts: ["+1/5 th curvature correction", "−1/5 th curvature correction", "+1/7 th curvature correction", "−1/7 th curvature correction"], ans: "d" },
            { ch: "3. Surveying", q: 51, text: "By balancing back sight and foresight the errors eliminated are", opts: ["errors due to non-parallelism of line of collimation and axis of bubble tube", "error due to curvature and refraction", "both (a) and (b)", "none of the above"], ans: "c" },
            { ch: "3. Surveying", q: 52, text: "Sensitivity of a bubble tube can be increased by", opts: ["increasing the length of the tube", "increasing the diameter of the tube", "decreasing viscosity of liquid", "any of the above"], ans: "d" },
            { ch: "3. Surveying", q: 53, text: "The rise and fall method of levelling provides a complete check on", opts: ["back sight", "foresight", "intermediate sight", "all of the above"], ans: "d" },
            { ch: "3. Surveying", q: 54, text: "The reading taken from an instrument station on a bench mark of 100.00 RL is 1.2 and the reading taken on next station is 1.70. Then RL of next station is", opts: ["98.8 m", "98.30 m", "99.50 m", "100.50 m"], ans: "c" },
            { ch: "3. Surveying", q: 55, text: "The reading taken from an instrument station on a benchmark of RL 100.00 is 1.4 and on a chejja reading taken with inverted staff is 2.8 m. Then RL of chejja is", opts: ["104.2 m", "101.40 m", "98.6 m", "none of the above"], ans: "a" },
            { ch: "3. Surveying", q: 56, text: "If height of sight is h metres above mean sea level, then the distance d of visible horizon is", opts: ["10⁴ √(h/6.728) m", "h×10⁴/√6.728 m", "10⁴ h/6.728 m", "10⁴×h/6.728 m"], ans: "a" },
            { ch: "3. Surveying", q: 57, text: "Contour interval selected is", opts: ["directly proportional to flatness of ground", "larger if the purpose of contouring is for earthwork calculation", "inversely proportional to the scale of map", "directly proportional to time and fund available"], ans: "c" },
            { ch: "3. Surveying", q: 58, text: "Direct method of contouring is suitable for", opts: ["small areas", "large areas", "forest areas", "urban areas"], ans: "a" },
            { ch: "3. Surveying", q: 59, text: "Method of squares is suitable for contouring", opts: ["hilly terrain", "forest", "urban area", "plains"], ans: "d" },
            { ch: "3. Surveying", q: 60, text: "Pick up the correct statement given below: In cross-section method of contouring", opts: ["spacing of cross section depends upon the nature of ground", "cross sections need not be always at 90° to main line", "the method is suitable for road projects", "all the above"], ans: "d" },
            { ch: "3. Surveying", q: 61, text: "For hilly region the ideal method of contouring is", opts: ["direct method", "method of squares", "cross-section method", "radial line method"], ans: "d" },
            { ch: "3. Surveying", q: 62, text: "For the purpose of linear interpolation of contour one can use", opts: ["estimation", "arithmetic calculations", "graphical method", "all the above"], ans: "d" },
            { ch: "3. Surveying", q: 63, text: "Contour maps are useful for", opts: ["determining intervisibility between two points", "determining catchment area", "calculation of reservoir capacity", "all the above"], ans: "d" },
            { ch: "3. Surveying", q: 64, text: "An imaginary line joining the point of intersection of the cross-hairs of the diaphragm and the optical centre of the object glass is known as", opts: ["axis of telescope", "axis of level tube", "line of collimation", "horizontal axis"], ans: "c" },
            { ch: "3. Surveying", q: 65, text: "The process of turning the telescope through 180° in vertical plane is known as", opts: ["transiting", "plunging", "reversing", "any one of the above"], ans: "a" },
            { ch: "3. Surveying", q: 66, text: "The process of rotating the telescope of a theodolite in a horizontal plane is known as", opts: ["transiting", "plunging", "swinging", "reversing"], ans: "c" },
            { ch: "3. Surveying", q: 67, text: "A theodolite is considered to be in proper condition, if", opts: ["the axis of the plate is perpendicular to the vertical axis", "the trunnion axis is perpendicular to the vertical axis", "the axis of the altitude level is parallel to the line of collimation", "all the above"], ans: "d" },
            { ch: "3. Surveying", q: 68, text: "If the least count of instrument is 20″, by measuring the horizontal angle n times repeatedly, the accuracy achieved is", opts: ["20″/n", "20″/2n", "20″", "none of the above"], ans: "b" },
            { ch: "3. Surveying", q: 69, text: "By method of repetition in measuring horizontal angle the error that is not eliminated is", opts: ["due to inaccurate graduation", "due to the line of sight and trunnion axis being out of adjustment", "due to inaccurate bisection", "due to non-verticality of vertical signal"], ans: "d" },
            { ch: "3. Surveying", q: 70, text: "Trigonometric levelling is used when", opts: ["base of the object is accessible", "base of the object is not accessible", "in both the above two cases", "in none of the above two cases"], ans: "b" },
            { ch: "3. Surveying", q: 71, text: "If the base of the object is inaccessible, in trigonometric levelling method to be used is", opts: ["single plane method", "double plane method", "any of the above two", "none of (a) and (b)"], ans: "b" },
            { ch: "3. Surveying", q: 72, text: "Two-peg test is conducted to check the following permanent adjustment of dumpy level", opts: ["axis of bubble tube is perpendicular to the vertical axis", "horizontal cross-hair lie in a plane perpendicular to the vertical axis", "the line of sight is truly parallel to the axis of bubble tube", "all the above"], ans: "c" },
            { ch: "3. Surveying", q: 73, text: "Spire test is to check the following permanent adjustment of theodolite", opts: ["plate level axis is perpendicular to vertical axis", "horizontal axis is perpendicular to vertical axis", "the line of sight coincides with the optical axis of the telescope", "the axis of altitude level is parallel to the line of sight"], ans: "b" },
            { ch: "3. Surveying", q: 74, text: "If a, b, c are the sides of a triangle and s = (a+b+c)/2, the area of the triangle is", opts: ["s(s−a)(s−b)(s−c)", "√(s(s−a)(s−b)(s−c))", "√(s(s+a)(s+b)(s+c))", "s(s+a)(s+b)(s+c)"], ans: "b" },
            { ch: "3. Surveying", q: 75, text: "According to Simpson's rule, if there are n number of segments each of width d, in terms of ordinates area of the figure is", opts: ["d/3[(O1+On)+4(O2+O4+…+On−1)+2(O3+O5+…+On−2)]", "d/3[(O1+On)+3(O2+O4+…+On−1)+2(O3+O5+…+On−2)]", "d/3[O1+4(O2+O4+…+On−1)+2(O3+O5+…+On)]", "d/3[O1+2(O2+O4+…+On−1)+3(O3+O5+…+On)]"], ans: "a" },
            { ch: "3. Surveying", q: 76, text: "To apply Simpson's rule for computation of irregular area, number of segments should be", opts: ["of equal width and odd number", "of equal width and even number", "may be of varying width also", "may be even or odd"], ans: "b" },
            { ch: "3. Surveying", q: 77, text: "If offsets are taken at irregular interval to a boundary from a line the area may be calculated from the equation", opts: ["A = Σ[(d_i+d_{i+1})/2] × (o_i+o_{i+1})/2", "A = Σ[d_i × (o_i+o_{i+1})/2]", "A = Σ[(d_i+d_{i+1}) × o_i/2]", "A = Σ[d_i × o_i]"], ans: "a" },
            { ch: "3. Surveying", q: 78, text: "If coordinates of stations A, B, C and D are (x1,y1), (x2,y2), (x3,y3) and (x4,y4) respectively, the area of ABCD is", opts: ["1/2[y1(x4−x2)+y2(x1−x3)+y3(x2−x4)+y4(x3−x1)]", "1/2[y1(x1−x2)+y2(x2−x3)+y3(x3−x4)+y4(x4−x1)]", "1/2[y1(x2−x3)+y2(x3−x4)+y3(x4−x1)+y4(x3−x2)]", "none of the above"], ans: "a" },
            { ch: "3. Surveying", q: 79, text: "Which one of the following methods is superior in finding area of map?", opts: ["Give and take rule", "Subdivision into squares", "Subdivision into trapezoids", "Using a planimeter"], ans: "d" },
            { ch: "3. Surveying", q: 80, text: "Which one of the following methods estimates best the area of an irregular curved boundary?", opts: ["Midordinate method", "Average ordinate method", "Trapezoidal method", "Simpson's method"], ans: "d" },
            { ch: "3. Surveying", q: 81, text: "While measuring the area of a plan using a planimeter the following readings were taken. If the anchor point was outside the plan and zero mark of disc crossed the index in clockwise direction, the area of map is. Given Multiplying constant = 100 cm², Initial reading = 8.378, Final reading = 1.436", opts: ["2694.2 cm²", "1305.8 cm²", "694.2 cm²", "none of the above"], ans: "b" },
            { ch: "3. Surveying", q: 82, text: "If L is length of tracing arm, a is the distance of wheel from hinge and R is length of anchor arm, the radius of zero circle of the planimeter is equal to", opts: ["zero", "√(L² − 2aL + R²)", "√(L² + R²)", "√(L² + 2aL + R²)"], ans: "b" },
            { ch: "3. Surveying", q: 83, text: "If A1, A2 ... An are the cross-sectional area of a canal at distances d, 2d, ..., then volume of earthwork involved in making the canal as per trapezoidal rule is", opts: ["d[A1+A2+...+An]", "d[(A1+An)/2 + A2+A3+...+An−1]", "d[(A1+An)/2 + A2+A3+...+An]", "d/2 [A1+A2+A3+...+An]"], ans: "b" },
            { ch: "3. Surveying", q: 84, text: "According to prismoidal rule, the volume of earthwork in terms of cross-sectional area A1, A2 ... An taken at distances d is", opts: ["d/2[A1+An+4(A2+A4+...)+2(A3+A5+...)]", "d/3[(A1+An)+4(A2+A4+...)+2(A3+A5+...)]", "d/3[(A1+An)+2(A2+A4+...)+4(A3+A5+...)]", "d/2[(A1+An)+2(A2+A4+...)+4(A3+A5+...)]"], ans: "b" },
            { ch: "3. Surveying", q: 85, text: "If the depth of excavation of block A at corners a, b, c and d is ha, hb, hc and hd, the volume of pit is", opts: ["(ha+2hb+2hc+hd)/4 × A", "(ha+3hb+3hc+hd)/3 × A", "(ha+hb+hc+hd)/4 × A", "(ha+2hb−2hc+hd)/4 × A"], ans: "c" },
            { ch: "3. Surveying", q: 86, text: "The instrument used for reducing a plan is known as", opts: ["clinometer", "planimeter", "pantograph", "sextant"], ans: "c" },
            { ch: "3. Surveying", q: 87, text: "The minor instrument used not only to take horizontal sights but also inclined sights are known as", opts: ["clinometer", "sextant", "pantograph", "planimeter"], ans: "a" },
            { ch: "3. Surveying", q: 88, text: "Minor instruments, which make use of optical principle to measure an angle in a single observation is known as", opts: ["clinometer", "sextant", "abney level", "pantograph"], ans: "b" },
            { ch: "3. Surveying", q: 89, text: "If f is focal length, i is stadia hair interval and d is the distance between the optical centre of the object lens, the multiplying constant is", opts: ["f/i", "f+d", "f/i + d", "f + id"], ans: "a" },
            { ch: "3. Surveying", q: 90, text: "In Question 89, the additive constant is", opts: ["f/i", "f+d", "f/i + d", "f + id"], ans: "b" },
            { ch: "3. Surveying", q: 91, text: "In a theodolite the multiplying constant for tacheometry is usually", opts: ["10", "50", "100", "200"], ans: "c" },
            { ch: "3. Surveying", q: 92, text: "In a tacheometry, if intercept taken on a vertically held staff is inclined at q to horizontal, the horizontal distance is", opts: ["kS + C", "kS cos q + C cos q", "kS cos² q + C cos q", "kS sin 2q + C sin q"], ans: "c" },
            { ch: "3. Surveying", q: 93, text: "In Question 92, vertical distance is", opts: ["kS + C", "kS cos q + C cos q", "kS cos² q + C cos q", "kS sin 2q + C sin q"], ans: "d" },
            { ch: "3. Surveying", q: 94, text: "In the tacheometry, if inclined sight q is taken on a staff held normal to the sight, horizontal distance is", opts: ["(kS + C) cos q + r sin q", "(kS + C) sin q", "(kS + C) cos q sin q + r sin² q", "(kS + C) tan q"], ans: "a" },
            { ch: "3. Surveying", q: 95, text: "In Question No. 94, the expression for vertical distance is", opts: ["(kS + C) cos q + r sin q", "(kS + C) sin q", "(kS + C) cos q sin q + r sin² q", "(kS + C) tan q"], ans: "b" },
            { ch: "3. Surveying", q: 96, text: "In external focussing telescope with an analytical lens, for tacheometric survey additive constant is", opts: ["zero", "0.1 m", "0.3 m", "0.5 m"], ans: "a" },
            { ch: "3. Surveying", q: 97, text: "If the focal length of the object glass is 30 cm and the distance from the object glass to the trunnion axis is 20 cm, the additive constant for tacheometry is", opts: ["0.5", "0.4", "0.3", "0.2"], ans: "a" },
            { ch: "3. Surveying", q: 98, text: "In the substance bar method of tacheometry, the substance bar is held", opts: ["vertical", "horizontal", "normal to sight when sight is inclined", "any of the above"], ans: "b" },
            { ch: "3. Surveying", q: 99, text: "The tangent, which is before the commencement of a curve is called", opts: ["back tangent", "rear tangent", "first tangent", "all of the above"], ans: "d" },
            { ch: "3. Surveying", q: 100, text: "If the degree of curve is 1, then radius of the curve is", opts: ["1800/π", "5400/π", "180/π", "540/π"], ans: "b" },
            { ch: "3. Surveying", q: 101, text: "The tangent length of a simple curve of radius R and deflection angle Δ is", opts: ["R sin(Δ/2)", "R cos(Δ/2)", "R tan(Δ/2)", "R cot(Δ/2)"], ans: "c" },
            { ch: "3. Surveying", q: 102, text: "The length of long chord of a circular curve of radius R and deflection angle Δ is", opts: ["R sin(Δ/2)", "2R sin(Δ/2)", "R cos(Δ/2)", "2R cos(Δ/2)"], ans: "b" },
            { ch: "3. Surveying", q: 103, text: "Mid-ordinate of a simple curve of radius R and deflection angle Δ is", opts: ["R(1 − cos(Δ/2))", "R(1 − sin(Δ/2))", "R(1 − tan(Δ/2))", "R(1 − cot(Δ/2))"], ans: "a" },
            { ch: "3. Surveying", q: 104, text: "If point of curve is 521.4 m in setting circular curve with 20 m chain, the first point where peg is to be driven is at", opts: ["540 m", "560 m", "580 m", "600 m"], ans: "a" },
            { ch: "3. Surveying", q: 105, text: "In linear method of setting out simple circular curves the method to be used is", opts: ["offset from long chord", "successive bisection of chord", "offsets from the tangents", "any one of the above"], ans: "d" },
            { ch: "3. Surveying", q: 106, text: "The radial offset at a distance x from the point of curve in a simple circular curve is", opts: ["√(R² + x²) + R", "√(R² + x²) − R", "√(R² − x²) + R", "−√(R² − x²) + R"], ans: "b" },
            { ch: "3. Surveying", q: 107, text: "The perpendicular offset at a distance x from the point of curve in a simple curve is", opts: ["√(R² + x²) + R", "√(R² + x²) − R", "√(R² − x²) + R", "R − √(R² − x²)"], ans: "d" },
            { ch: "3. Surveying", q: 108, text: "If obstacles are coming in the alignment of a simple circular curve use", opts: ["transition curve", "compound curve", "reverse curve", "any one of the above"], ans: "b" },
            { ch: "3. Surveying", q: 109, text: "As far as possible reverse curves should be avoided. Reason for it is", opts: ["puts passengers to discomfort", "needs cambers on opposite edges", "at the point of reverse curvature, it is not possible to provide camber", "all the above"], ans: "d" },
            { ch: "3. Surveying", q: 110, text: "In a reverse curve, the super elevation provided at the point of reverse curvature is", opts: ["minimum", "zero", "maximum", "depends upon the elements of curve"], ans: "b" },
            { ch: "3. Surveying", q: 111, text: "If R is radius of curvature and l is the distance from the beginning in a transition curve, then for ideal transition", opts: ["l ∝ R", "lR = constant", "l ∝ 1/R", "l ∝ R²"], ans: "c" },
            { ch: "3. Surveying", q: 112, text: "Which one of the following is not a transition curve?", opts: ["Cubic spiral", "Cubic parabola", "Bernoulli's lemniscate", "Sag curve"], ans: "d" },

        // ============================================================
        //  RENDER
        // ============================================================
        const container = document.getElementById('questionsContainer');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const resultStats = document.getElementById('resultStats');

        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = mcqData;

            if (term) {
                filtered = mcqData.filter(item =>
                    item.text.toLowerCase().includes(term) ||
                    item.ch.toLowerCase().includes(term) ||
                    item.q.toString().includes(term) ||
                    item.opts.some(o => o.toLowerCase().includes(term))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-results">😕 No questions found for “${filter}”</div>`;
                resultStats.textContent = '0 results';
                return;
            }

            let html = '';
            let currentChapter = '';
            let count = 0;

            filtered.forEach((item, idx) => {
                if (item.ch !== currentChapter) {
                    currentChapter = item.ch;
                    html += `<div class="chapter-tag">${currentChapter}</div>`;
                }
                const optsHtml = ['a', 'b', 'c', 'd'].map((letter, i) =>
                    `<div class="option"><span class="letter">${letter.toUpperCase()})</span> ${item.opts[i] || ''}</div>`
                ).join('');

                const qNum = item.q || (idx + 1);
                html += `
                    <div class="question-card" data-chapter="${item.ch}" data-q="${qNum}">
                        <div class="q-header">
                            <span class="q-number">Q${qNum}</span>
                            <span class="q-chapter">${item.ch}</span>
                        </div>
                        <div class="q-text">${highlightText(item.text, term)}</div>
                        <div class="options">${optsHtml}</div>
                        <div class="answer">${item.ans.toUpperCase()}</div>
                    </div>
                `;
                count++;
            });

            container.innerHTML = html;
            resultStats.textContent = `${count} question${count !== 1 ? 's' : ''}${term ? ' found' : ''}`;
        }

        function highlightText(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Search on input
        searchInput.addEventListener('input', () => render(searchInput.value));

        // Clear button
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });

        // Initial render
        render();
    </script>
