<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #dbeafe;
    --success: #16a34a;
    --warning: #f59e0b;
    --danger: #dc2626;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-600: #4b5563;
    --gray-700: #374151;
    --gray-800: #1f2937;
    --gray-900: #111827;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--gray-50);
    color: var(--gray-800);
    line-height: 1.6;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

  /* Header */
  .header {
    background: #fff;
    border-bottom: 1px solid var(--gray-200);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .header-inner { padding: 1rem 0; }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    width: 40px; height: 40px;
    background: var(--primary);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-icon svg { width: 22px; height: 22px; fill: white; }
  .brand-title { font-size: 1.25rem; font-weight: 700; color: var(--gray-900); }
  .brand-sub { font-size: 0.8rem; color: var(--gray-500); }
  .header-actions { display: flex; gap: 0.5rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-ghost {
    background: var(--gray-100);
    color: var(--gray-700);
  }
  .btn-ghost:hover { background: var(--gray-200); }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

  /* Search */
  .search-wrap {
    position: relative;
    margin-bottom: 0.75rem;
  }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--gray-400);
  }
  .search-input {
    width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem;
    border: 1px solid var(--gray-200);
    border-radius: 10px;
    font-size: 0.95rem;
    background: var(--gray-50);
    transition: all 0.2s;
  }
  .search-input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  /* Filters */
  .filters {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    padding-bottom: 0.5rem;
  }
  .filter-chip {
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--gray-200);
    background: #fff;
    color: var(--gray-600);
    transition: all 0.2s;
    user-select: none;
  }
  .filter-chip:hover { border-color: var(--gray-300); }
  .filter-chip.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* Stats bar */
  .stats-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 0;
    flex-wrap: wrap; gap: 0.5rem;
  }
  .stats-text { font-size: 0.875rem; color: var(--gray-500); }
  .sort-select {
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    font-size: 0.875rem;
    background: #fff;
    color: var(--gray-700);
    cursor: pointer;
  }
  .sort-select:focus { outline: none; border-color: var(--primary); }

  /* Job Cards */
  .jobs-list { display: flex; flex-direction: column; gap: 1rem; padding-bottom: 3rem; }
  .job-card {
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    padding: 1.25rem;
    transition: all 0.2s;
    position: relative;
  }
  .job-card:hover {
    box-shadow: var(--shadow-lg);
    border-color: var(--gray-300);
  }
  .job-card.featured {
    border-left: 4px solid var(--primary);
  }
  .job-card.walkin {
    border-left: 4px solid var(--warning);
  }
  .job-card.remote {
    border-left: 4px solid var(--success);
  }

  .job-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
  }
  .job-title-row {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  }
  .job-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--gray-900);
  }
  .job-card:hover .job-title { color: var(--primary); }
  .badge {
    display: inline-flex; align-items: center; gap: 0.25rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .badge-walkin { background: #fff7ed; color: #c2410c; }
  .badge-remote { background: #f0fdf4; color: #15803d; }
  .badge-diversity { background: #faf5ff; color: #7c3aed; }
  .badge-urgent { background: #fef2f2; color: #dc2626; }

  .company-row {
    display: flex; align-items: center; gap: 0.75rem;
    margin-top: 0.25rem;
    flex-wrap: wrap;
  }
  .company-name { font-weight: 600; color: var(--gray-700); font-size: 0.9rem; }
  .rating {
    display: flex; align-items: center; gap: 0.2rem;
    font-size: 0.8rem;
    color: var(--gray-600);
  }
  .star { color: #fbbf24; }

  .job-meta {
    display: flex; flex-wrap: wrap; gap: 1.25rem;
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: var(--gray-600);
  }
  .meta-item { display: flex; align-items: center; gap: 0.35rem; }
  .meta-item svg { width: 16px; height: 16px; color: var(--gray-400); flex-shrink: 0; }
  .meta-salary { font-weight: 600; color: var(--gray-800); }

  .job-desc {
    margin-top: 0.6rem;
    font-size: 0.85rem;
    color: var(--gray-600);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .job-tags {
    display: flex; flex-wrap: wrap; gap: 0.4rem;
    margin-top: 0.75rem;
  }
  .tag {
    padding: 0.25rem 0.6rem;
    background: var(--gray-100);
    color: var(--gray-600);
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .tag-more {
    background: transparent;
    color: var(--gray-400);
  }

  .job-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 1rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--gray-100);
  }
  .posted-time { font-size: 0.75rem; color: var(--gray-400); }
  .job-actions { display: flex; align-items: center; gap: 0.5rem; }
  .btn-save {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid var(--gray-200);
    background: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    color: var(--gray-400);
  }
  .btn-save:hover { background: var(--gray-50); border-color: var(--gray-300); }
  .btn-save.saved { color: var(--primary); border-color: var(--primary-light); background: var(--primary-light); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
  }
  .empty-state svg {
    width: 64px; height: 64px;
    color: var(--gray-300);
    margin-bottom: 1rem;
  }
  .empty-state h3 { color: var(--gray-700); font-size: 1.1rem; }
  .empty-state p { color: var(--gray-400); font-size: 0.9rem; margin-top: 0.25rem; }

  /* Footer */
  .site-footer {
    background: var(--gray-900);
    color: var(--gray-400);
    padding: 2rem 0;
    text-align: center;
    font-size: 0.85rem;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .job-header { flex-direction: column; }
    .job-meta { gap: 0.75rem; }
    .job-footer { flex-direction: column; gap: 0.75rem; align-items: flex-start; }
    .brand-title { font-size: 1.1rem; }
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .job-card { animation: fadeIn 0.3s ease-out; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--gray-100); }
  ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }
</style>

// ========== STATE ==========
let currentFilter = 'all';
let currentSearch = '';

// ========== HELPERS ==========
function getSalaryValue(s) {
  if (!s) return 0;
  const m = s.match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}
function getExpValue(s) {
  if (!s) return 0;
  const m = s.match(/(\d+)/);
  return m ? parseInt(m[1]) : 0;
}
function toggleFilters() {
  const bar = document.getElementById('filterBar');
  bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
}

// ========== FILTER & SORT ==========
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(btn => {
    if (btn.dataset.filter === f) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
  filterJobs();
}

function filterJobs() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase().trim();
  renderJobs();
}

function sortJobs() {
  const sortType = document.getElementById('sortSelect').value;
  switch(sortType) {
    case 'salary-high':
      jobsData.sort((a,b) => getSalaryValue(b.salary) - getSalaryValue(a.salary));
      break;
    case 'salary-low':
      jobsData.sort((a,b) => getSalaryValue(a.salary) - getSalaryValue(b.salary));
      break;
    case 'exp-low':
      jobsData.sort((a,b) => getExpValue(a.experience) - getExpValue(b.experience));
      break;
    case 'exp-high':
      jobsData.sort((a,b) => getExpValue(b.experience) - getExpValue(a.experience));
      break;
    case 'recent':
    default:
      jobsData.sort((a,b) => a.postedDays - b.postedDays);
  }
  renderJobs();
}

function toggleSave(id) {
  const job = jobsData.find(j => j.id === id);
  if (job) { job.saved = !job.saved; renderJobs(); }
}

function applyJob(title) {
  alert('Applying for: ' + title + '\n\nThis would open the application form or redirect to the company portal.');
}

// ========== RENDER ==========
function renderJobs() {
  const container = document.getElementById('jobsContainer');
  const countEl = document.getElementById('resultsCount');

  let filtered = jobsData.filter(job => {
    const matchesSearch = !currentSearch ||
      job.title.toLowerCase().includes(currentSearch) ||
      job.company.toLowerCase().includes(currentSearch) ||
      job.location.toLowerCase().includes(currentSearch) ||
      job.tags.some(t => t.toLowerCase().includes(currentSearch));
    const matchesFilter = currentFilter === 'all' || job.category.includes(currentFilter);
    return matchesSearch && matchesFilter;
  });

  countEl.textContent = `Showing ${filtered.length} job${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <h3>No jobs found</h3>
        <p>Try adjusting your search terms or filters</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(job => {
    let cardClass = 'job-card';
    if (job.type === 'walkin') cardClass += ' walkin';
    else if (job.type === 'remote') cardClass += ' remote';
    else if (job.postedDays <= 2) cardClass += ' featured';

    const stars = job.rating ? Array(5).fill(0).map((_,i) =>
      `<span class="star">${i < Math.round(job.rating) ? '&#9733;' : '&#9734;'}</span>`
    ).join('') : '';

    return `
    <article class="${cardClass}">
      <div class="job-header">
        <div style="min-width:0;">
          <div class="job-title-row">
            <h3 class="job-title">${job.title}</h3>
            ${job.type === 'walkin' ? '<span class="badge badge-walkin">Walk-in</span>' : ''}
            ${job.type === 'remote' ? '<span class="badge badge-remote">Remote</span>' : ''}
            ${job.diversity ? '<span class="badge badge-diversity">Prefers Women</span>' : ''}
            ${job.postedDays <= 1 ? '<span class="badge badge-urgent">New</span>' : ''}
          </div>
          <div class="company-row">
            <span class="company-name">${job.company}</span>
            ${job.rating ? `<span class="rating">${stars} <strong>${job.rating}</strong> <span style="color:var(--gray-400)">(${job.reviews.toLocaleString()})</span></span>` : ''}
          </div>
          <div class="job-meta">
            <span class="meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
              ${job.experience}
            </span>
            ${job.salary ? `<span class="meta-item meta-salary">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 10h8M8 14h8"/></svg>
              ${job.salary}
            </span>` : ''}
            <span class="meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${job.location}
            </span>
          </div>
          <p class="job-desc">${job.desc}</p>
          <div class="job-tags">
            ${job.tags.slice(0,6).map(t => `<span class="tag">${t}</span>`).join('')}
            ${job.tags.length > 6 ? `<span class="tag tag-more">+${job.tags.length-6} more</span>` : ''}
          </div>
        </div>
      </div>
      <div class="job-footer">
        <span class="posted-time">Posted ${job.posted}</span>
        <div class="job-actions">
          <button class="btn-save ${job.saved ? 'saved' : ''}" onclick="toggleSave(${job.id})" title="${job.saved ? 'Saved' : 'Save job'}">
            <svg viewBox="0 0 24 24" fill="${job.saved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
          </button>
          <button class="btn btn-primary btn-sm" onclick="applyJob('${job.title.replace(/'/g,"\'")}')">Apply Now</button>
        </div>
      </div>
    </article>`;
  }).join('');
}
