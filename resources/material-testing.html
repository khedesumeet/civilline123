<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Testing in Civil Engineering</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:95%;
    max-width:1250px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.2);
}

.header{
    background:linear-gradient(90deg,#1565C0,#42A5F5);
    color:#fff;
    text-align:center;
    padding:30px;
}

.header h1{
    font-size:36px;
}

.header p{
    margin-top:10px;
    font-size:18px;
    opacity:.9;
}

.buttons{
    text-align:center;
    padding:20px;
    background:#ffffff10;
}

.btn{
    display:inline-block;
    margin:10px;
    padding:14px 30px;
    text-decoration:none;
    color:#fff;
    background:#ff9800;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#e65100;
    transform:translateY(-3px);
}

iframe{
    width:100%;
    height:750px;
    border:none;
}

.footer{
    text-align:center;
    padding:15px;
    color:#fff;
    background:#00000055;
}

@media(max-width:768px){

.header h1{
    font-size:26px;
}

.header p{
    font-size:15px;
}

iframe{
    height:500px;
}

.btn{
    display:block;
    width:90%;
    margin:10px auto;
}
}
</style>

</head>
<body>

<div class="container">

<div class="header">
<h1>🧪 Material Testing in Civil Engineering</h1>
<p>Comprehensive PDF Handbook for Civil Engineering Students & Professionals</p>
</div>

target="_blank">

</a>

</div>
