<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger - CivilLine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Reuse your existing CSS – copy it from dashboard.html or link a shared style */
    :root { ... } /* paste your root variables and all styles from earlier */
    /* ... include all the styles from dashboard.html ... */
    .ledger-balance { font-size: 1.4rem; font-weight: bold; background: #f0fdf4; padding: 10px; border-radius: 8px; }
    .income-row { background: #f0fdf4; }
    .expense-row { background: #fef2f2; }
  </style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">Civil<span>Line</span></div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="projects.html">Projects</a>
      <a href="expenses.html">Expenses</a>
      <a href="client-bills.html">Client Bills</a>
      <a href="ledger.html" style="background:#374151;">Ledger</a>
      <button id="logout">Logout</button>
    </nav>
  </div>
</header>
<div class="wrap">
  <div class="card">
    <h1>Ledger Statement</h1>
    <div class="grid" style="grid-template-columns: 1fr 1fr 1fr;">
      <div>
        <label>Project</label>
        <select id="filterProject"><option value="">All Projects</option></select>
      </div>
      <div>
        <label>From</label>
        <input id="fromDate" type="date">
      </div>
      <div>
        <label>To</label>
        <input id="toDate" type="date">
      </div>
    </div>
    <div style="margin: 10px 0;">
      <button class="btn" id="applyFilters">Apply Filters</button>
      <button class="btn secondary" id="resetFilters">Reset</button>
    </div>
    <div id="ledgerSummary" class="ledger-balance">Balance: ₹0.00</div>
  </div>

  <div class="card table-scroll">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Project</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Running Balance</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script>
const sb = supabase.createClient("https://aoicywtjwvqzzhmxkxvs.supabase.co","sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W");
let uid = null, allProjects = [];

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

(async () => {
  const u = await sb.auth.getUser();
  if (!u.data.user) return location.href = "contractor-login.html";
  uid = u.data.user.id;
  const p = await sb.from("profiles").select("role,status").eq("id", uid).single();
  if (p.data?.role !== "contractor" || p.data.status !== "approved") return location.href = "contractor-login.html";
  
  // Load projects for filter
  const pr = await sb.from("projects").select("id,name").eq("user_id", uid).order("name");
  if (!pr.error) {
    allProjects = pr.data || [];
    const opts = allProjects.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
    document.getElementById('filterProject').innerHTML = `<option value="">All Projects</option>${opts}`;
  }
  // Set default dates (last 3 months)
  const now = new Date();
  const threeMonthsAgo = new Date();
  threeMonthsAgo.setMonth(now.getMonth() - 3);
  document.getElementById('fromDate').value = threeMonthsAgo.toISOString().slice(0,10);
  document.getElementById('toDate').value = now.toISOString().slice(0,10);
  await loadLedger();
})();

async function loadLedger() {
  const projectId = document.getElementById('filterProject').value;
  const from = document.getElementById('fromDate').value || '1970-01-01';
  const to = document.getElementById('toDate').value || '2099-12-31';

  // Fetch client bills (income)
  let queryBills = sb.from("client_bills").select("*, projects(name)").eq("user_id", uid).gte("date", from).lte("date", to);
  if (projectId) queryBills = queryBills.eq("project_id", projectId);
  const bills = await queryBills.order("date", {ascending: true});

  // Fetch expenses
  let queryExp = sb.from("expenses").select("*, projects(name)").eq("user_id", uid).gte("date", from).lte("date", to);
  if (projectId) queryExp = queryExp.eq("project_id", projectId);
  const exps = await queryExp.order("date", {ascending: true});

  // Combine into one array with type
  let entries = [];
  (bills.data || []).forEach(b => {
    entries.push({
      date: b.date,
      type: 'Income',
      project: b.projects?.name || '-',
      description: `Client Bill ${b.bill_number ? '#'+b.bill_number : ''}`,
      amount: Number(b.amount),
      isIncome: true
    });
  });
  (exps.data || []).forEach(e => {
    entries.push({
      date: e.date,
      type: 'Expense',
      project: e.projects?.name || '-',
      description: `${e.category}${e.vendor ? ' - '+e.vendor : ''}`,
      amount: Number(e.total),
      isIncome: false
    });
  });
  // Sort by date
  entries.sort((a,b) => a.date.localeCompare(b.date) || (a.isIncome ? -1 : 1));

  // Render rows with running balance
  let balance = 0;
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  entries.forEach(entry => {
    balance += entry.isIncome ? entry.amount : -entry.amount;
    const rowClass = entry.isIncome ? 'income-row' : 'expense-row';
    rows.innerHTML += `<tr class="${rowClass}">
      <td>${entry.date}</td>
      <td>${entry.type}</td>
      <td>${esc(entry.project)}</td>
      <td>${esc(entry.description)}</td>
      <td>${entry.isIncome ? '+' : '-'}₹${Number(entry.amount).toLocaleString('en-IN')}</td>
      <td>₹${balance.toLocaleString('en-IN')}</td>
    </tr>`;
  });
  // Show summary
  document.getElementById('ledgerSummary').textContent = `Balance: ₹${balance.toLocaleString('en-IN')}`;
}

document.getElementById('applyFilters').onclick = loadLedger;
document.getElementById('resetFilters').onclick = () => {
  document.getElementById('filterProject').value = '';
  document.getElementById('fromDate').value = '';
  document.getElementById('toDate').value = '';
  loadLedger();
};
logout.onclick = async () => { await sb.auth.signOut(); location.href="contractor-login.html"; };
</script>
</body>
</html>
