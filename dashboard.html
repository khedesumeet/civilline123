<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | CivilLine</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="app.js"></script></head><body><header><div class="bar"><div class="logo">Civil<span>Line</span></div><nav><a href="dashboard.html">Dashboard</a><a href="projects.html">Projects</a><a href="expenses.html">Expenses</a><a href="client-bills.html">Client Bills</a><a href="statements.html">Statements</a><button onclick="logout()">Logout</button></nav></div></header><main class="wrap"><div class="card"><div class="kicker">Financial Control Center</div><h1 id="welcome">Dashboard</h1><p class="subtitle">Project, client income, expenses and profit at a glance.</p></div><div class="grid4"><div class="stat"><div class="label">Projects</div><div class="value" id="pc">0</div></div><div class="stat"><div class="label">Client Bills</div><div class="value" id="income">₹0</div></div><div class="stat"><div class="label">Expenses</div><div class="value" id="expense">₹0</div></div><div class="stat"><div class="label">Profit / Loss</div><div class="value" id="profit">₹0</div></div></div><div class="grid" style="margin-top:18px"><div class="card"><h2>Income vs Expense</h2><canvas id="chart"></canvas></div><div class="card"><h2>Quick Actions</h2><div class="actions"><a class="btn" href="projects.html">+ Project</a><a class="btn dark" href="expenses.html">+ Expense</a><a class="btn secondary" href="client-bills.html">+ Client Bill</a><a class="btn blue" href="statements.html">Open Statements</a></div></div></div></main><script>(async()=>{const a=await auth();if(!a)return;const uid=a.user.id,p=a.profile;const [pr,ex,cb]=await Promise.all([sb.from('projects').select('id').eq('user_id',uid),sb.from('expenses').select('total').eq('user_id',uid),sb.from('client_bills').select('amount').eq('user_id',uid)]);const E=(ex.data||[]).reduce((s,x)=>s+Number(x.total||0),0),I=(cb.data||[]).reduce((s,x)=>s+Number(x.amount||0),0);welcome.textContent='Welcome, '+(p.company_name||a.user.email);pc.textContent=pr.data?.length||0;income.textContent=money(I);expense.textContent=money(E);profit.textContent=money(I-E);new Chart(chart,{type:'bar',data:{labels:['Client Bills','Expenses','Profit/Loss'],datasets:[{label:'Amount (₹)',data:[I,E,I-E]}]},options:{responsive:true,plugins:{legend:{display:false}}}})})();</script></body></html>
