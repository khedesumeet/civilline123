<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - CivilLine</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#172033;--muted:#64748b;--dark:#111827;--accent:#f59e0b;--danger:#dc2626;--line:#e5e7eb;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:10}.bar{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:24px;font-weight:900}.logo span{color:var(--accent)}nav{display:flex;gap:5px;flex-wrap:wrap}nav a,nav button{color:#fff;text-decoration:none;background:transparent;border:0;padding:9px 11px;border-radius:7px;cursor:pointer;font-weight:700}nav a:hover,nav button:hover{background:#374151}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 5px 20px #0000000a;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:14px}textarea{min-height:90px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:var(--accent);color:#111827;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.btn.secondary{background:#e5e7eb}.btn.dark{background:var(--dark);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.success{background:var(--ok);color:#fff}.btn.small{padding:7px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{padding:11px;border-radius:8px;margin-top:14px;display:none}.successmsg{background:#dcfce7;color:#166534}.errormsg{background:#fee2e2;color:#991b1b}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:24px;font-weight:900;margin-top:7px}.muted{color:var(--muted)}.auth{max-width:430px;margin:70px auto}.hero{max-width:950px;margin:60px auto;text-align:center;padding:25px}.hero h1{font-size:45px}@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid,.grid4{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="bar"><div class="logo">Civil<span>Line</span></div><nav><a href="projects.html">Projects</a><a href="expenses.html">Expenses</a><a href="client-bills.html">Client Bills</a><a href="statements.html">Statements</a><button id="logout">Logout</button></nav></div></header><div class="wrap"><div class="card"><h1 id="welcome">Dashboard</h1><p class="muted">Your contractor financial overview.</p></div><div class="grid4"><div class="stat"><div class="label">Projects</div><div class="value" id="pc">0</div></div><div class="stat"><div class="label">Client Bills</div><div class="value" id="income">₹0</div></div><div class="stat"><div class="label">Expenses</div><div class="value" id="expense">₹0</div></div><div class="stat"><div class="label">Profit / Loss</div><div class="value" id="profit">₹0</div></div></div><div class="grid" style="margin-top:18px"><div class="card"><h2>Profit & Loss</h2><canvas id="chart"></canvas></div><div class="card"><h2>Quick Actions</h2><div class="actions"><a class="btn" href="projects.html">+ Project</a><a class="btn dark" href="expenses.html">+ Expense</a><a class="btn secondary" href="client-bills.html">+ Client Bill</a></div></div></div></div><script>const sb=supabase.createClient("https://aoicywtjwvqzzhmxkxvs.supabase.co","sb_publishable_8oZE-6157A8F7sRZEWCrhw_8OQ4yz0W");(async()=>{const u=await sb.auth.getUser();if(!u.data.user)return location.href="contractor-login.html";const uid=u.data.user.id,p=await sb.from("profiles").select("company_name,status,role").eq("id",uid).single();if(p.data?.role!=="contractor"||p.data.status!=="approved"){await sb.auth.signOut();return location.href="contractor-login.html"}const pr=await sb.from("projects").select("id").eq("user_id",uid),ex=await sb.from("expenses").select("total").eq("user_id",uid),cb=await sb.from("client_bills").select("amount").eq("user_id",uid),E=(ex.data||[]).reduce((a,x)=>a+Number(x.total||0),0),I=(cb.data||[]).reduce((a,x)=>a+Number(x.amount||0),0);welcome.textContent="Welcome, "+(p.data.company_name||u.data.user.email);pc.textContent=pr.data?.length||0;income.textContent=money(I);expense.textContent=money(E);profit.textContent=money(I-E);new Chart(chart,{type:"bar",data:{labels:["Client Bills","Expenses","Profit/Loss"],datasets:[{label:"Amount (₹)",data:[I,E,I-E]}]},options:{responsive:true}})})();logout.onclick=async()=>{await sb.auth.signOut();location.href="contractor-login.html"};function money(n){return "₹"+Number(n).toLocaleString("en-IN")}</script></body></html>
