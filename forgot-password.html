<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | CivilLine</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><div class="auth card"><div class="logo" style="text-align:center">Civil<span>Line</span></div><h1 style="margin-top:22px">Reset Password</h1><p class="subtitle">Enter your Login ID / email. We'll send a secure reset link.</p><form id="f"><label>Login ID / Email</label><input id="email" type="email" required><button class="btn dark" style="width:100%;margin-top:18px">SEND RESET LINK</button></form><p style="text-align:center;margin-top:18px"><a href="contractor-login.html">Back to Login</a></p><div id="msg" class="msg"></div></div><script>f.onsubmit=async e=>{e.preventDefault();const redirect=location.origin+location.pathname.replace('forgot-password.html','reset-password.html');const r=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:redirect});if(r.error)return msg(r.error.message,false);msg('Reset link sent. Check your email.');};</script></body></html>
